# Publishes the official app catalog: charts to GHCR as OCI artifacts, plus a small
# catalog manifest committed to the repo.
#
# The two halves of "a chart repository" are separable, and treating them as one thing is
# what led this workflow through GitHub Pages and then through committing tarballs to git
# before landing here:
#
#   distribution — `helm push` to ghcr.io. Nothing to host, nothing in git, and public
#                  packages pull anonymously (verified: `helm pull oci://ghcr.io/...`
#                  succeeds with no login and no registry config).
#   discovery    — GHCR cannot be enumerated without a token (/v2/_catalog and the
#                  GitHub Packages API both 401 anonymously), so the list of what exists
#                  has to come from somewhere else. That somewhere is catalog.yaml: a few
#                  hundred bytes of text, generated here so it cannot drift from the
#                  charts, committed so it is reviewable in a PR.
#
# Nodes read catalog.yaml, then `helm pull` each chart by name and version. See charts.rs.

name: Publish charts

on:
  push:
    branches: [main]
    paths:
      - "apps/catalog/**"
      - ".github/workflows/publish-charts.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-charts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve registry
        run: |
          # OCI repository names must be lowercase — the spec requires it and GHCR
          # enforces it — while github.repository_owner preserves the account's actual
          # casing. Interpolating it directly makes `helm push` fail on any owner with a
          # capital letter, which is most of them.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=oci://ghcr.io/${owner}/charts" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint every chart
        run: |
          set -euo pipefail
          fail=0
          for chart in apps/catalog/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm dependency update "$chart" >/dev/null
            grep -q '^type: library' "$chart/Chart.yaml" && continue
            # Charts whose schema marks fields required legitimately fail lint against
            # default values, so lint with a filled-in set — the point is catching
            # template errors, not re-testing the schema.
            helm lint "$chart" \
              --set config.password=PlaceholderPw2026 \
              --set config.admin_password=PlaceholderPw2026 \
              --set config.admin_email=admin@example.com \
              --set config.server_name=example \
              --set config.server_pass=PlaceholderPw2026 \
              --set config.subdomain=example || fail=1
          done
          exit $fail

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        id: push
        run: |
          set -uo pipefail
          mkdir -p /tmp/pkg
          for chart in apps/catalog/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            # The library chart is pushed too: without it, `helm dependency update`
            # against this registry cannot resolve it for anyone building on the catalog.
            helm package "$chart" --destination /tmp/pkg
          done

          # GitHub rate-limits creating new container packages, and each chart is its own
          # package. The first run of this workflow pushed 7 of 19 and then got a hard 403
          # on the 8th — not a permissions problem (the 7 that landed are anonymously
          # pullable), just too many new packages at once. So: retry with backoff, and
          # never let one chart's failure abort the rest.
          failed=""
          for tgz in /tmp/pkg/*.tgz; do
            name=$(basename "$tgz" .tgz)
            pushed=""
            for attempt in 1 2 3 4 5; do
              # Pushing an existing name:version is a no-op rather than an error, so
              # retries and re-runs are both safe. Published versions are never deleted —
              # a restore from an old backup may need one.
              if helm push "$tgz" "${REGISTRY}"; then pushed=1; break; fi
              sleep $((attempt * 15))
              echo "retry $attempt for $name"
            done
            [ -n "$pushed" ] || failed="$failed $name"
            # Small gap between new packages to stay under the creation rate limit.
            sleep 3
          done
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ] || echo "::warning::could not push:${failed}"

      - name: Generate catalog manifest
        run: |
          set -euo pipefail
          registry_path="${REGISTRY#oci://ghcr.io/}"

          # Built from what the registry ACTUALLY serves, not from what we meant to push.
          # A manifest advertising a chart that is not there makes every node's sync log
          # a pull failure for it, forever — the manifest is a promise about the registry,
          # so it has to be checked against the registry.
          {
            echo "# Generated by .github/workflows/publish-charts.yml — do not edit."
            echo "#"
            echo "# The list of apps in the official catalog. Chart bytes live in the OCI"
            echo "# registry below; this file exists only because a registry cannot be"
            echo "# enumerated without credentials. Entries are verified present before"
            echo "# being listed."
            echo "apiVersion: yolab.io/v1"
            echo "registry: ${REGISTRY}"
            echo "charts:"
            for chart in apps/catalog/*/; do
              [ -f "$chart/Chart.yaml" ] || continue
              grep -q '^type: library' "$chart/Chart.yaml" && continue
              name=$(grep '^name:' "$chart/Chart.yaml" | head -1 | awk '{print $2}')
              version=$(grep '^version:' "$chart/Chart.yaml" | head -1 | awk '{print $2}')
              # Anonymous token issuance is exactly the check a node's pull performs.
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${registry_path}/${name}:pull")
              if [ "$code" = "200" ]; then
                echo "  - name: ${name}"
                echo "    version: \"${version}\""
              else
                echo "::warning::${name} is not readable in the registry (HTTP ${code}) — omitted" >&2
              fi
            done
          } > catalog.yaml
          cat catalog.yaml

      - name: Commit the manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.yaml
          if git diff --cached --quiet; then
            echo "catalog unchanged"
            exit 0
          fi
          # [skip ci] because this push lands on main and would otherwise re-trigger.
          git commit -m "Update catalog manifest from ${GITHUB_SHA::7} [skip ci]"
          git push

      - name: Report unpublished charts
        if: steps.push.outputs.failed != ''
        run: |
          # Deliberately last: the manifest for everything that DID publish is already
          # committed by this point, so a partial run still moves the catalog forward and
          # the next run retries the rest. Failing here only makes the gap visible.
          echo "charts that did not publish:${{ steps.push.outputs.failed }}"
          exit 1
