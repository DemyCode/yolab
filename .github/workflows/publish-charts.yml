# Publishes the official app catalog as a Helm chart repository served straight out of
# this repo, via raw.githubusercontent.com.
#
# No gh-pages branch and no GitHub Pages: the repository is a plain `index.yaml` plus
# version-named tarballs committed under charts/, which is the entire hosting story. The
# manifest is reviewable in a PR alongside the charts it describes, and a node adds it
# with a normal `helm repo add` — nothing about it is YoLab-specific.
#
# Two things to know about this host. GitHub does not position raw.githubusercontent.com
# as production infrastructure and rate-limits it, which is fine at this scale but is not
# a promise; and the URL is baked into every deployed node, so moving off it later means
# the old URL has to keep working. Both are acceptable trade-offs for not maintaining a
# second publishing surface — see charts.rs for how a node consumes this.

name: Publish chart repository

on:
  push:
    branches: [main]
    paths:
      - "apps/catalog/**"
      - ".github/workflows/publish-charts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two runs committing to charts/ at once would conflict on index.yaml.
  group: publish-charts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint every chart
        run: |
          set -euo pipefail
          fail=0
          for chart in apps/catalog/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm dependency update "$chart" >/dev/null
            grep -q '^type: library' "$chart/Chart.yaml" && continue
            # Charts whose schema marks fields required legitimately fail lint against
            # default values, so lint with a filled-in set — the point is catching
            # template errors, not re-testing the schema.
            helm lint "$chart" \
              --set config.password=PlaceholderPw2026 \
              --set config.admin_password=PlaceholderPw2026 \
              --set config.admin_email=admin@example.com \
              --set config.server_name=example \
              --set config.server_pass=PlaceholderPw2026 \
              --set config.subdomain=example || fail=1
          done
          exit $fail

      - name: Package and index
        run: |
          set -euo pipefail
          mkdir -p charts
          for chart in apps/catalog/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            # The library chart is published too: without it, `helm dependency update`
            # against this repo cannot resolve it for anyone building on the catalog.
            helm package "$chart" --destination charts
          done
          # Regenerate over the existing directory so previously published versions are
          # kept. Old chart versions must stay fetchable — a restore from an old backup
          # may need one, and pruning them would quietly make old backups unrestorable.
          helm repo index charts \
            --url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/charts/"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts
          if git diff --cached --quiet; then
            echo "no chart changes to publish"
            exit 0
          fi
          # [skip ci] because this push lands on main, and the workflow's own path filter
          # would otherwise have to be trusted to break the loop by itself.
          git commit -m "Publish charts from ${GITHUB_SHA::7} [skip ci]"
          git push
