name: format

# Every branch gets its own formatting PR: push `ok`, and if `nix fmt` has work
# to do you get `fmt-ok` opened against `ok`. Not just the default branch,
# because an unformatted feature branch is red on `formatting` the moment it is
# pushed, and the fix should arrive before review rather than after.
#
# Push-triggered only. There is no schedule: a formatter version moving is
# something you find out about on the next push, and a cron that opens PRs
# against every stale branch in the repo is noise.
#
# `fmt-**` is excluded or this eats itself — the bot's push to `fmt-ok` would
# trigger a run that opens `fmt-fmt-ok`. In practice a push made with
# GITHUB_TOKEN does not start another workflow, but relying on that as the only
# guard means the loop returns the day someone swaps in a PAT.

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "fmt-**"

# Per branch, so two branches formatting at once do not cancel each other.
concurrency:
  group: format-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # `nix fmt` and `checks.formatting` are the same treefmt wrapper, built
      # from nix/treefmt.nix — so whatever this writes is exactly what the check
      # would otherwise have demanded. There is no second formatter here that
      # could disagree with the gate.
      - name: Run nix fmt
        run: nix fmt

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # fmt-<branch>, targeting <branch>. A fixed name per source branch, so
          # a later push updates the open PR rather than stacking a second one.
          branch: fmt-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          title: "style: nix fmt (${{ github.ref_name }})"
          commit-message: |
            style: nix fmt

            Produced by `nix fmt`, the same treefmt wrapper that
            `checks.formatting` gates on.
          labels: formatting
          body: |
            `nix fmt` produced changes against `${{ github.ref_name }}`.

            This is mechanical output — the same treefmt wrapper
            `checks.formatting` builds, so merging it is what makes
            `nix run .#ci` green on that branch.

            If this appeared without anyone editing the affected files, a
            formatter version moved: check the most recent bump to
            `treefmt-nix`, `nixpkgs` (prettier, shfmt, alejandra) or the
            pinned Rust toolchain (rustfmt).
