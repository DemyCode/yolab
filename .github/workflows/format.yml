name: format

# Push `ok` and, if `nix fmt` has work to do, `fmt-ok` opens against `ok`.
#
# No branch exclusion and no schedule. This cannot recurse because a formatted
# tree produces no diff, which is checked explicitly below rather than left to
# the PR action no-opping — excluding `fmt-**` would also have made those
# branches permanently unformattable.
#
# `branches: ["**"]` rather than a bare `push:` — every branch, but not tags. A
# tag push would open a PR whose base is a tag.

on:
  workflow_dispatch:
  push:
    branches: ["**"]

concurrency:
  group: format-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Run nix fmt
        id: fmt
        run: |
          nix fmt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already formatted; nothing to open a PR for."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Open a pull request
        if: steps.fmt.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Fixed name per source branch, so a later push updates the open PR
          # rather than stacking a second one.
          branch: fmt-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          title: "style: nix fmt (${{ github.ref_name }})"
          commit-message: |
            style: nix fmt

            Produced by `nix fmt`, the same treefmt wrapper that
            `checks.formatting` gates on.
          labels: formatting
          body: |
            `nix fmt` produced changes against `${{ github.ref_name }}`.

            This is mechanical output — the same treefmt wrapper
            `checks.formatting` builds, so merging it is what makes
            `nix run .#ci` green on that branch.

            If this appeared without anyone editing the affected files, a
            formatter version moved: check the most recent bump to
            `treefmt-nix`, `nixpkgs` (prettier, shfmt, alejandra) or the
            pinned Rust toolchain (rustfmt).
