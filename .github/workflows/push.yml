name: push

on:
  push:
    branches:
      - master
      - main

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    concurrency:
      group: configure-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            fallback = true
            connect-timeout = 10

      - id: list
        run: |
          set -euo pipefail
          {
            for system in x86_64-linux aarch64-linux; do
              for kind in packages checks devShells; do
                nix eval --json ".#${kind}.${system}" --apply "a: builtins.map (n: \"${kind}.${system}.\${n}\") (builtins.attrNames a)"
              done
              printf '["formatter.%s"]' "$system"
            done
            nix eval --json '.#nixosConfigurations' --apply 'a: builtins.map (n: "nixosConfigurations.${n}.config.system.build.toplevel") (builtins.attrNames a)'
          } | jq --slurp --compact-output 'add | map(select(. != "packages.aarch64-linux.android-apk")) | map({target: ., runner: (if test("aarch64") then "ubuntu-24.04-arm" else "ubuntu-latest" end)})' > matrix.json
          cat matrix.json
          echo "jobs=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.job.target }}
    needs: configure
    runs-on: ${{ matrix.job.runner }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.configure.outputs.jobs) }}
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.job.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Grant KVM if available
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm; the VM test jobs will fail on this runner"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            fallback = true
            connect-timeout = 10
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build
        run: |
          set -euo pipefail
          nix build ".#${{ matrix.job.target }}" -L --no-link --print-out-paths > /tmp/out.txt
          cat /tmp/out.txt

      - name: Push to the Nix cache
        continue-on-error: true
        env:
          ATTIC_AUTH_TOKEN: ${{ secrets.ATTIC_AUTH_TOKEN }}
        if: ${{ env.ATTIC_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          nix run nixpkgs#attic-client -- login yolab https://cache.yolab.io "$ATTIC_AUTH_TOKEN"
          xargs -a /tmp/out.txt nix path-info --recursive \
            | nix run nixpkgs#attic-client -- push yolab --stdin --no-closure

  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-images-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set branch tag
        id: tag
        run: echo "value=$(echo '${{ github.ref_name }}' | sed 's|/|-|g')" >>
          $GITHUB_OUTPUT

      - name: Emulate arm64 for the image builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push wg-sidecar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/wg-sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/demycode/wg-sidecar:${{ steps.tag.outputs.value }}-latest

      - name: Build and push wg-register
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/wg-register
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/demycode/wg-register:${{ steps.tag.outputs.value }}-latest

      - name: Build and push ollama-vulkan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/ollama-vulkan
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/demycode/ollama-vulkan:0.35.1

      - name: Build and push generic-cdi-plugin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: https://github.com/OlfillasOdikno/generic-cdi-plugin.git#7d12b0c5fcb6f8f9424c43cb1e7b056402de3f41
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/demycode/generic-cdi-plugin:7d12b0c

  charts-library:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.registry.outputs.registry }}
      suffix: ${{ steps.registry.outputs.suffix }}
      lib_version: ${{ steps.library.outputs.lib_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Resolve registry and version suffix
        id: registry
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          registry="oci://ghcr.io/${owner}/charts"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            suffix=""
          else
            suffix="-$(echo '${{ github.ref_name }}' | sed 's|[^0-9A-Za-z]|-|g')"
          fi
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
          echo "SUFFIX=${suffix}" >> "$GITHUB_ENV"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: A changed chart must change its version
        run: |
          set -uo pipefail
          # PUBLISHING AN EXISTING name:version IS A NO-OP (see the push step
          # below), so a chart edited without a version bump is silently
          # discarded: the registry keeps serving the old templates and the fix
          # never reaches a cluster, with nothing anywhere reporting it.
          #
          # That had happened to the whole catalog. On 2026-09-11 every chart
          # still read 0.1.0 while their templates had moved on repeatedly —
          # qbittorrent's liveness probe was removed on 09-08 and clusters were
          # still running the version with it, crash-looping, because 0.1.0 had
          # been published back in August and never changed again.
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "no usable base commit — skipping"
            exit 0
          fi
          bad=""
          for chart in apps/catalog/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            name=$(grep '^name:' "$chart/Chart.yaml" | head -1 | awk '{print $2}')
            # Untouched in this push: nothing to say about it.
            git diff --quiet "$before" HEAD -- "$chart" && continue
            new=$(grep '^version:' "$chart/Chart.yaml" | head -1 | awk '{print $2}')
            # ${chart%/} strips the trailing slash: git's rev:path syntax rejects
            # the doubled separator that "$chart/Chart.yaml" would produce, and it
            # fails quietly — which made an earlier version of this check treat
            # every chart as brand-new and pass unconditionally.
            old=$(git show "$before:${chart%/}/Chart.yaml" 2>/dev/null \
                  | grep '^version:' | head -1 | awk '{print $2}')
            # A brand-new chart has no old version, and needs no bump.
            [ -z "$old" ] && continue
            [ "$old" != "$new" ] || bad="$bad $name($new)"
          done
          if [ -n "$bad" ]; then
            echo "::error::These charts changed but kept their version, so the" \
                 "registry will ignore them and clusters keep the old templates:$bad"
            exit 1
          fi
          echo "every changed chart bumped its version"

      - name: Publish the library chart
        id: library
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg
          base=$(grep '^version:' apps/catalog/yolab-common/Chart.yaml | head -1 | awk '{print $2}' | tr -d '"')
          LIB_VERSION="${base}${SUFFIX}"
          echo "LIB_VERSION=${LIB_VERSION}" >> "$GITHUB_ENV"
          echo "lib_version=${LIB_VERSION}" >> "$GITHUB_OUTPUT"
          helm package apps/catalog/yolab-common --version "${LIB_VERSION}" --destination /tmp/pkg
          for attempt in 1 2 3 4 5; do
            helm push /tmp/pkg/yolab-common-*.tgz "${REGISTRY}" && break
            sleep $((attempt * 15))
          done
          verified=""
          for attempt in 1 2 3 4 5; do
            if helm show chart "${REGISTRY}/yolab-common" --version "${LIB_VERSION}" >/dev/null; then
              verified=1
              break
            fi
            sleep $((attempt * 15))
          done
          [ -n "$verified" ] || {
            echo "::error::yolab-common ${LIB_VERSION} is not readable after push"
            exit 1
          }
          rm -f /tmp/pkg/yolab-common-*.tgz


  charts:
    name: charts (${{ matrix.shard }}/8)
    needs: charts-library
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      REGISTRY: ${{ needs.charts-library.outputs.registry }}
      SUFFIX: ${{ needs.charts-library.outputs.suffix }}
      LIB_VERSION: ${{ needs.charts-library.outputs.lib_version }}
      SHARD: ${{ matrix.shard }}
      SHARDS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Lint, package and push this shard's charts
        run: |
          set -uo pipefail
          mkdir -p /tmp/pkg
          failed=""
          index=0
          for chart in apps/catalog/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            grep -q '^type: library' "$chart/Chart.yaml" && continue
            mine=$((index % SHARDS))
            index=$((index + 1))
            [ "$mine" -eq "$SHARD" ] || continue
            name=$(grep '^name:' "$chart/Chart.yaml" | head -1 | awk '{print $2}')
            base=$(grep '^version:' "$chart/Chart.yaml" | head -1 | awk '{print $2}' | tr -d '"')
            if helm show chart "${REGISTRY}/${name}" --version "${base}${SUFFIX}" >/dev/null 2>&1; then
              echo "${name} ${base}${SUFFIX} is already published"
              continue
            fi

            # Point the dependency at the version just published. Without this a branch
            # build vendors main's library and silently tests the wrong thing.
            sed -i "/- name: yolab-common/{n;s|version: .*|version: \"${LIB_VERSION}\"|}" "$chart/Chart.yaml"
            dep=""
            for attempt in 1 2 3 4 5; do
              if helm dependency update "$chart" >/dev/null; then dep=1; break; fi
              sleep $((attempt * 15))
            done
            [ -n "$dep" ] || { failed="$failed $name(dependency)"; continue; }

            # Every app must tear its tunnel down on uninstall — the shared pre-delete
            # hook is what does that (see yolab-common/templates/_uninstall.tpl). A
            # chart missing this leaks an orphaned tunnel on the platform every time
            # it's removed, silently, with nothing in the uninstall response to say so.
            grep -q "yolab.io/kind: group" "$chart/Chart.yaml" \
              || grep -rq "yolab-common.uninstallHook" "$chart" \
              || { failed="$failed $name(no-uninstall-hook)"; continue; }

            # Charts whose schema marks fields required legitimately fail lint against
            # default values, so lint with a filled-in set — the point is catching
            # template errors, not re-testing the schema.
            helm lint "$chart" \
              --set config.password=PlaceholderPw2026 \
              --set config.admin_password=PlaceholderPw2026 \
              --set config.admin_email=admin@example.com \
              --set config.app_secret=PlaceholderPw2026 \
              --set config.app_key=PlaceholderAppKey2026Placeholder \
              --set config.api_key=PlaceholderApiKey2026 \
              --set config.auth_secret_key=PlaceholderAuthSecretKey2026Placeholder \
              --set config.gateway_token=PlaceholderGatewayToken2026Placeholder \
              --set config.server_name=example \
              --set config.server_pass=PlaceholderPw2026 \
              --set config.vpn_private_key=PlaceholderVpnKey2026= \
              --set config.vpn_addresses=10.64.0.2/32 \
              --set 'config.auth_users[0].username=admin' \
              --set 'config.auth_users[0].password=PlaceholderPw2026' \
              --set config.desktop_password=PlaceholderPw2026 \
              --set config.sunshine_password=PlaceholderPw2026 \
              --set config.subdomain=example || { failed="$failed $name(lint)"; continue; }

            helm package "$chart" --version "${base}${SUFFIX}" --destination /tmp/pkg

            # GitHub rate-limits creating new container packages, and each chart is its
            # own package: the first run of this pushed 7 of 19 before a hard 403. Retry
            # with backoff, and never let one chart's failure abort the rest.
            pushed=""
            for attempt in 1 2 3 4 5; do
              # Pushing an existing name:version is a no-op, so retries and re-runs are
              # both safe. Published versions are never deleted — a restore from an old
              # backup may need one.
              if helm push "/tmp/pkg/${name}-${base}${SUFFIX}.tgz" "${REGISTRY}"; then pushed=1; break; fi
              sleep $((attempt * 15))
            done
            [ -n "$pushed" ] || failed="$failed $name"
            sleep 3
          done
          git checkout -- apps/catalog
          if [ -n "$failed" ]; then
            echo "::error::charts that did not publish:${failed}"
            exit 1
          fi

  charts-catalog:
    needs: [charts-library, charts]
    if: always() && needs.charts-library.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: charts-catalog-${{ github.ref }}
      cancel-in-progress: false
    env:
      REGISTRY: ${{ needs.charts-library.outputs.registry }}
      SUFFIX: ${{ needs.charts-library.outputs.suffix }}
      LIB_VERSION: ${{ needs.charts-library.outputs.lib_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate the catalog manifest
        run: |
          set -euo pipefail
          registry_path="${REGISTRY#oci://ghcr.io/}"
          {
            echo "# Generated by .github/workflows/push.yml — do not edit."
            echo "#"
            echo "# The list of apps in the official catalog. Chart bytes live in the OCI"
            echo "# registry below; this file exists only because a registry cannot be"
            echo "# enumerated without credentials. Entries are verified present before"
            echo "# being listed."
            echo "apiVersion: yolab.io/v1"
            echo "registry: ${REGISTRY}"
            # The library chart apps and custom apps depend on. A node pulls it
            # so a chart built on yolab-common renders with OUR copy, never one a
            # chart's own `repository:` line names. Only named if it is actually
            # readable, so the manifest never points at a missing package.
            lib_code=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${registry_path}/yolab-common:pull")
            if [ "$lib_code" = "200" ]; then
              echo "# The library chart apps and custom apps depend on. Pulled into the cache so a"
              echo "# chart built on it renders on a node, but never listed on the storefront."
              echo "library:"
              echo "  name: yolab-common"
              echo "  version: \"${LIB_VERSION}\""
            else
              echo "::warning::yolab-common is not readable in the registry (HTTP ${lib_code}) — custom apps built on it will not render" >&2
            fi
            echo "charts:"
            for chart in apps/catalog/*/; do
              [ -f "$chart/Chart.yaml" ] || continue
              grep -q '^type: library' "$chart/Chart.yaml" && continue
              name=$(grep '^name:' "$chart/Chart.yaml" | head -1 | awk '{print $2}')
              base=$(grep '^version:' "$chart/Chart.yaml" | head -1 | awk '{print $2}' | tr -d '"')
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${registry_path}/${name}:pull")
              if [ "$code" = "200" ]; then
                echo "  - name: ${name}"
                echo "    version: \"${base}${SUFFIX}\""
              else
                echo "::warning::${name} is not readable in the registry (HTTP ${code}) — omitted" >&2
              fi
            done
          } > catalog.yaml
          cat catalog.yaml

      - name: Upload the branch catalog manifest
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-${{ github.ref_name }}
          path: catalog.yaml
          retention-days: 7

      - name: Commit the catalog manifest
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.yaml
          if git diff --cached --quiet; then
            echo "catalog unchanged"
            exit 0
          fi
          # No [skip ci]: the run this push triggers regenerates the same manifest,
          # finds it unchanged above, and stops there.
          git commit -m "Update catalog manifest from ${GITHUB_SHA::7}"
          pushed=""
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          [ -n "$pushed" ] || { echo "::error::could not push the catalog manifest"; exit 1; }


      - name: Report unpublished charts
        if: needs.charts.result != 'success'
        run: |
          echo "some chart shards failed; their charts are left out of the catalog until a run publishes them"
          exit 1

  build-iso:
    name: build-iso (${{ matrix.iso.system }})
    runs-on: ${{ matrix.iso.runner }}
    strategy:
      fail-fast: false
      matrix:
        iso:
          - system: x86_64-linux
            runner: ubuntu-latest
            config: yolab-installer
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            config: yolab-installer-aarch64
    permissions:
      contents: write
    concurrency:
      group: build-iso-${{ github.ref_name }}-${{ matrix.iso.runner }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set branch tag
        id: tag
        run: echo "value=$(echo '${{ github.ref_name }}' | sed 's|/|-|g')" >>
          $GITHUB_OUTPUT

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            fallback = true
            connect-timeout = 10

      - name: Build ISO
        id: build_iso
        run: |
          # `.#`, the git flake, like every nix invocation in this workflow and
          # every machine's rebuild. `.#` and `path:.#` resolve to different flake
          # sources — the git flake copies only tracked files, `path:` copies the
          # directory — so their source hashes differ and so does every derivation
          # built from them: when this job and the checks disagreed, local-api was
          # two distinct derivations (cn8cc3y… vs vnb0nah…) built from scratch on
          # both runners, neither able to use the cache the other had just filled.
          # A machine's own files come in through the `yolab-machine` input
          # instead (see flake.nix), which is why nothing needs `path:` any more.
          ISO_OUT=$(nix build .#nixosConfigurations.${{ matrix.iso.config }}.config.system.build.isoImage --no-link --print-build-logs --print-out-paths)
          echo "store_path=$ISO_OUT" >> "$GITHUB_OUTPUT"
          echo "ISO store path: $ISO_OUT"

      - name: Push to the Nix cache
        continue-on-error: true
        env:
          ATTIC_AUTH_TOKEN: ${{ secrets.ATTIC_AUTH_TOKEN }}
        if: ${{ env.ATTIC_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          nix run nixpkgs#attic-client -- login yolab https://cache.yolab.io "$ATTIC_AUTH_TOKEN"
          nix run nixpkgs#attic-client -- push yolab \
            "${{ steps.build_iso.outputs.store_path }}"

      - name: Get ISO info
        id: iso_info
        run: |
          ISO_PATH=$(readlink -f "${{ steps.build_iso.outputs.store_path }}"/iso/*.iso)
          ISO_NAME=$(basename "$ISO_PATH")
          echo "iso_path=$ISO_PATH" >> $GITHUB_OUTPUT
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "ISO built: $ISO_NAME"
          ls -lh "$ISO_PATH"

      - name: Create/Update Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.value }}-latest
          name: NixOS Homelab Installer — ${{ steps.tag.outputs.value }}
          files: ${{ steps.iso_info.outputs.iso_path }}
          body: |
            ## NixOS Homelab Installer ISO

            This ISO can be used to install the homelab configuration.

            **Usage:**
            - Download the ISO file
            - Write to USB drive using Rufus (Windows) or dd (Linux/macOS):
              ```bash
              sudo dd if=${{ steps.iso_info.outputs.iso_name }} of=/dev/sdX bs=4M status=progress && sync
              ```
            - Boot from USB and follow installation instructions

            **Branch:** `${{ github.ref_name }}`
            **Built from:** `${{ github.sha }}`
            **Built at:** ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixos-homelab-installer-${{ steps.tag.outputs.value }}-${{ matrix.iso.system }}-${{ github.sha }}
          path: ${{ steps.iso_info.outputs.iso_path }}
          retention-days: 7

  format:
    if: startsWith(github.ref, 'refs/heads/')
    concurrency:
      group: format-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            fallback = true
            connect-timeout = 10

      - name: Run nix fmt
        id: fmt
        run: |
          nix fmt -v -L
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already formatted; nothing to open a PR for."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Open a pull request
        if: steps.fmt.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: fmt-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          title: "style: nix fmt (${{ github.ref_name }})"
          commit-message: |
            style: nix fmt

            Produced by `nix fmt`, the same treefmt wrapper that
            `checks.formatting` gates on.
          labels: formatting
          body: |
            `nix fmt` produced changes against `${{ github.ref_name }}`.

            This is mechanical output — the same treefmt wrapper
            `checks.formatting` builds, so merging it is what makes
            CI green on that branch.

            If this appeared without anyone editing the affected files, a
            formatter version moved: check the most recent bump to
            `treefmt-nix`, `nixpkgs` (prettier, shfmt, alejandra) or the
            pinned Rust toolchain (rustfmt).

