  build-images:
    runs-on: ubuntu-latest
    # needs: pre-commit
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set branch tag
        id: tag
        run: echo "value=$(echo '${{ github.ref_name }}' | sed 's|/|-|g')" >>
          $GITHUB_OUTPUT

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push wg-sidecar
        uses: docker/build-push-action@v6
        with:
          context: apps/wg-sidecar
          push: true
          tags: ghcr.io/demycode/wg-sidecar:${{ steps.tag.outputs.value }}-latest

      - name: Build and push wg-register
        uses: docker/build-push-action@v6
        with:
          context: apps/wg-register
          push: true
          tags: ghcr.io/demycode/wg-register:${{ steps.tag.outputs.value }}-latest

  # build-nixos:
