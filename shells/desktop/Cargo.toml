[package]
name = "yolab-desktop"
version = "0.1.0"
edition = "2021"
description = "A window pointed at your YoLab box"

[lib]
name = "yolab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
