# Stub config used by CI to evaluate the NixOS system without real secrets.
# All values here are dummies — this file is never deployed to a real machine.

[homelab]
hostname = "yolab-ci"
timezone = "UTC"
locale = "en_US.UTF-8"
ssh_port = 22
root_ssh_key = ""
allowed_ssh_keys = []
homelab_password_hash = ""

[tunnel]
enabled = false
platform_api_url = "https://api.yolab.dev"
account_token = ""
service_name = "homelab"
service_id = 0
wg_private_key = ""
wg_public_key = ""
sub_ipv6 = "fd00:1::"
sub_ipv6_private = "fd00:cafe::1"
wg_server_endpoint = "1.2.3.4:51820"
wg_server_public_key = ""
dns_url = "https://ci.example.com"

[node]
node_id = "ci"
# These are read from [node], not [tunnel] — `s.nodeCfg` is `homelabConfig.node`.
# They were missing here, and the eval fails outright without them
# ("attribute 'sub_ipv6_private' missing"), which went unnoticed because the
# NixOS build job in .github/workflows/push.yml is commented out.
sub_ipv6_private = "fd00:cafe::1"
sub_ipv6_private_subnet = "fd00:cafe::/112"
wg_private_key = ""
wg_server_endpoint = "1.2.3.4:51820"
wg_server_public_key = ""

[node.k3s]
role = "server"
token = "ci-token"
# "" means this stub describes the machine that CREATES the cluster. Joining is
# a different code path in both k3s (--cluster-init vs --server) and Ceph
# (generate the cluster's keys vs fetch them) — ci-join-config.toml covers that
# side, and both must be evaluated to have checked the module at all.
server_addr = ""

# Ceph runs as host daemons now, so the NixOS config requires a cluster fsid
# and throws without one. A fixed value is correct here precisely because this
# stub never builds a real cluster — on a real install the installer generates
# one per cluster and it must never change afterwards.
[ceph]
fsid = "00000000-0000-4000-8000-000000000000"

# disk-config.nix throws without a [disk] section, so nixosSystems.*.config
# .system.build.diskoScript went completely unbuilt by any check — the code
# that partitions a disk had zero CI coverage. /dev/vda is never touched (disko
# bakes the device path into a generated script; nothing at eval/build time
# reads the real filesystem for it), same placeholder nix/tests/boot.nix's
# real-booting VM harness already uses.
[disk]
device = "/dev/vda"
esp_size = "512M"
system_size = "8G"
