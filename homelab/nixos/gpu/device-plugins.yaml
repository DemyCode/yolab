apiVersion: v1
kind: Namespace
metadata:
  name: yolab-gpu
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-cdi-plugin
  namespace: yolab-gpu
  labels:
    app.kubernetes.io/name: nvidia-cdi-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-cdi-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-cdi-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        yolab.io/gpu-nvidia: "true"
      tolerations:
      - operator: Exists
      containers:
      - name: generic-cdi-plugin
        image: ghcr.io/olfillasodikno/generic-cdi-plugin:main@sha256:5399b02c75e7e1ef2f9f4d2ab75e05cfa66fac6e30bd2a8ea1045f8c02bda4ec
        imagePullPolicy: IfNotPresent
        command:
        - /generic-cdi-plugin
        - /var/run/cdi/nvidia-container-toolkit.json
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            memory: 64Mi
        securityContext:
          privileged: true
        volumeMounts:
        - name: kubelet
          mountPath: /var/lib/kubelet
        - name: nvidia-cdi-spec
          mountPath: /var/run/cdi/nvidia-container-toolkit.json
          readOnly: true
      volumes:
      - name: kubelet
        hostPath:
          path: /var/lib/kubelet
      - name: nvidia-cdi-spec
        hostPath:
          path: /var/run/cdi/nvidia-container-toolkit.json
          type: File
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: device-plugin
  namespace: yolab-gpu
  labels:
    app.kubernetes.io/name: device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - name: generic-device-plugin
        image: docker.io/squat/generic-device-plugin:latest@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
        imagePullPolicy: IfNotPresent
        args:
        - --domain
        - yolab.io
        - --device
        - |
          name: dri
          groups:
            - count: 16
              paths:
                - path: /dev/dri
        - --device
        - |
          name: kfd
          groups:
            - count: 16
              paths:
                - path: /dev/kfd
                - path: /dev/dri
        - --device
        - |
          name: uinput
          groups:
            - count: 4
              paths:
                - path: /dev/uinput
                - path: /dev/uhid
                  optional: true
        resources:
          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            memory: 32Mi
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: dev
          mountPath: /dev
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: dev
        hostPath:
          path: /dev
