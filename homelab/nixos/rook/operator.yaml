apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: rook-ceph
  namespace: kube-system
spec:
  repo: https://charts.rook.io/release
  chart: rook-ceph
  version: v1.16.3
  targetNamespace: rook-ceph
  createNamespace: true
  valuesContent: |-
    # allowLoopDevices was needed when the system OSD was a loop-mounted file. It is now
    # a real LVM logical volume (/dev/mapper/pool-ceph, see disk-config.nix), no loop
    # devices exist on a node, and leaving it enabled would let Rook claim a stray one.
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 128Mi
        cpu: 100m
    cephCommandsTimeoutSeconds: "60"
    csi:
      enableCephfsDriver: true
      enableRbdDriver: false
      provisionerReplicas: 1
      grpcTimeoutInSeconds: 300
