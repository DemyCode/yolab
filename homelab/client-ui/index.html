<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>YoLab</title>
    <meta name="description" content="Your apps, running at home." />

    <!-- Colours the browser chrome on mobile, so the app does not sit under a
         white bar in dark mode. Values match --bg in src/index.css. -->
    <meta
      name="theme-color"
      content="#f6f3ed"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14120f"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Fonts are served from this box.
         These used to be <link>s to fonts.googleapis.com, which meant every
         page load told Google someone was looking at their own server, and
         meant the app fell back to a system font in the one situation it most
         needs to work: a house whose internet is down. Preloaded because the
         display face is in the first thing painted. -->
    <link
      rel="preload"
      href="/fonts/inter.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
