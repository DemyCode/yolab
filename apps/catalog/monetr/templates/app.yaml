{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: monetr
        image: ghcr.io/monetr/monetr:1.22.0@sha256:194387ae7ec127c706db65d73a0939532d1c7f23709c8c9d70b776d271e5f996
        imagePullPolicy: IfNotPresent
        args:
        - serve
        - --migrate
        - --generate-certificates
        env:
        - name: MONETR_ALLOW_SIGN_UP
          value: ${MONETR_ALLOW_SIGN_UP:-true}
        - name: MONETR_PROOF_OF_WORK_ENABLED
          value: ${MONETR_PROOF_OF_WORK_ENABLED:-false}
        - name: MONETR_PG_USERNAME
          value: postgres
        - name: MONETR_PG_PASSWORD
          value: m0netrPass123
        - name: MONETR_PG_DATABASE
          value: monetr
        - name: MONETR_PG_ADDRESS
          value: db
        - name: MONETR_PG_PORT
          value: '5432'
        - name: MONETR_REDIS_ENABLED
          value: 'true'
        - name: MONETR_REDIS_ADDRESS
          value: valkey
        - name: MONETR_REDIS_PORT
          value: '6379'
        - name: MONETR_STORAGE_ENABLED
          value: ${MONETR_STORAGE_ENABLED:-true}
        - name: MONETR_STORAGE_PROVIDER
          value: ${MONETR_STORAGE_PROVIDER:-filesystem}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 4000
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 4000
        volumeMounts:
        - name: data
          mountPath: /etc/monetr
          subPath: 'data/app'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_PASSWORD
          value: m0netrPass123
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: monetr
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres || exit 1
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: 'data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6379
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - valkey-cli
            - ping
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: 'data/valkey'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: valkey
  ports:
  - port: 6379
    targetPort: 6379
