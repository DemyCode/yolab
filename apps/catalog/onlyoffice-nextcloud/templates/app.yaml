{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: a4004/onlyoffice-nextcloud-web:1.0.4@sha256:774bd9bda641e6be49286921637840efba050fdfd022934dfd9ee9b6ec8d0a63
        imagePullPolicy: IfNotPresent
        env:
        - name: DOCS_ADDRESS
          value: http://localhost:$(DOCSERVER_PORT)
        - name: DOCS_INTERNAL_ADDRESS
          value: http://onlyoffice-nextcloud-documentserver
        - name: NEXTCLOUD_INTERNAL_ADDRESS
          value: http://nextcloud_web_1
        - name: NEXTCLOUD_WEB_URL
          value: http://localhost:APP_NEXTCLOUD_PORT
        ports:
        - containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: 3000
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentserver
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: documentserver
  template:
    metadata:
      labels:
        app: documentserver
    spec:
      containers:
      - name: documentserver
        image: onlyoffice/documentserver:9.4.0@sha256:e3da62a847b9a5d51a11f73cfea1d9c13c3be3809614490d4edddcf01dcf919b
        imagePullPolicy: IfNotPresent
        env:
        - name: JWT_ENABLED
          value: 'false'
        - name: ONLYOFFICE_HTTPS_HSTS_ENABLED
          value: 'false'
        - name: USE_UNAUTHORIZED_STORAGE
          value: 'true'
        - name: ALLOW_PRIVATE_IP_ADDRESS
          value: 'true'
        - name: ALLOW_META_IP_ADDRESS
          value: 'true'
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/log/onlyoffice
          subPath: '{{ .Release.Name }}/data/logs'
        - name: data
          mountPath: /var/www/onlyoffice/Data
          subPath: '{{ .Release.Name }}/data/certs'
        - name: data
          mountPath: /var/lib/onlyoffice
          subPath: '{{ .Release.Name }}/data/cache'
        - name: data
          mountPath: /var/lib/postgresql
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: documentserver
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: documentserver
  ports:
  - port: 80
    targetPort: 80
