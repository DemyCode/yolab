apiVersion: v2
name: photoprism
description: "AI-powered photo library with face and object recognition"
home: https://www.photoprism.app
type: application
# Chart version — bump on any packaging change. This is what a backup records and a
# restore pins to, so "which version wrote this data" stops being a guess.
version: 0.1.0
# Upstream application version this chart tracks.
appVersion: "240915"

dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"

# YoLab-specific metadata Helm has no field for. Annotations are the standard escape
# hatch, and keeping them here means one file describes the whole app.
annotations:
  yolab.io/display-name: "PhotoPrism"
  yolab.io/icon: "📷"
  yolab.io/category: "media"
  # RJSF layout hints for the install form; the form's JSON Schema itself lives in
  # values.schema.json under `properties.config`.
  yolab.io/uischema: |
    {
      "subdomain": {
        "ui:widget": "TunnelWidget"
      },
      "admin_password": {
        "ui:widget": "PasswordWidget"
      }
    }
  # Values scraped out of pod logs after install (regex, capture group 1).
  yolab.io/outputs: |
    [
      { "key": "url", "label": "Web URL", "type": "url", "pattern": "YOLAB_OUTPUT url (\\S+)" },
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
