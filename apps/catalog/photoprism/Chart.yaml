apiVersion: v2
name: photoprism
description: "AI-powered photo library with face and object recognition"
home: https://www.photoprism.app
type: application
version: 0.1.1
appVersion: "240915"

dependencies:
  - name: yolab-common
    version: "0.1.1"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "PhotoPrism"
  yolab.io/icon: "📷"
  yolab.io/category: "media"
  yolab.io/uischema: |
    {
      "subdomain": {
        "ui:widget": "TunnelWidget"
      },
      "admin_password": {
        "ui:widget": "PasswordWidget"
      }
    }
  yolab.io/outputs: |
    [
      { "key": "url", "label": "Web URL", "type": "url", "pattern": "YOLAB_OUTPUT url (\\S+)" },
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
