{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.wireguardContainer" . | nindent 6 }}
      - name: valheim
        image: ghcr.io/community-valheim-tools/valheim-server:latest@sha256:e8b13da3c44f54a38511c8ac224f2959a437c0b2626cf916683ca7acc8dfb146
        imagePullPolicy: IfNotPresent
        readinessProbe:
          tcpSocket:
            port: 2456
          initialDelaySeconds: 120
          periodSeconds: 30
        livenessProbe:
          tcpSocket:
            port: 2456
          initialDelaySeconds: 180
          periodSeconds: 60
          failureThreshold: 3
        env:
        - name: SERVER_NAME
          value: {{ .Values.config.server_name }}
        - name: WORLD_NAME
          value: {{ .Values.config.world_name | default "Dedicated" }}
        - name: SERVER_PASS
          value: {{ .Values.config.server_pass }}
        - name: SERVER_PUBLIC
          value: {{ if .Values.config.server_public }}true{{ else }}false{{ end }}
        - name: BACKUPS
          value: 'true'
        - name: TZ
          value: Etc/UTC
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: {{ .Release.Name }}/valheim/config
        - name: data
          mountPath: /opt/valheim
          subPath: {{ .Release.Name }}/valheim/game
      volumes:
      {{- include "yolab-common.tunnelVolumes" . | nindent 6 }}
