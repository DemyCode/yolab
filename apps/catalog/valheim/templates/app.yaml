{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "server_pass" (dict "value" .Values.config.server_pass))) | nindent 6 }}
      containers:
      {{- include "yolab-common.wireguardContainer" . | nindent 6 }}
      - name: valheim
        image: ghcr.io/community-valheim-tools/valheim-server:latest@sha256:f34d67ba8023e343b10ffda0144759a8c8d986f276510460315a01051bed8a6d
        imagePullPolicy: IfNotPresent
        readinessProbe:
          tcpSocket:
            port: 2456
          initialDelaySeconds: 120
          periodSeconds: 30
        env:
        - name: SERVER_NAME
          value: {{ .Values.config.server_name }}
        - name: WORLD_NAME
          value: {{ .Values.config.world_name | default "Dedicated" }}
        - name: SERVER_PASS
          value: {{ .Values.config.server_pass }}
        - name: SERVER_PUBLIC
          value: {{ if .Values.config.server_public }}true{{ else }}false{{ end }}
        - name: BACKUPS
          value: 'true'
        - name: TZ
          value: Etc/UTC
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: valheim/config
        - name: data
          mountPath: /opt/valheim
          subPath: valheim/game
      volumes:
      {{- include "yolab-common.tunnelVolumes" . | nindent 6 }}
