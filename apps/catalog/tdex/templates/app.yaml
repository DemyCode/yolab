{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: OjgwODAgewoJaGFuZGxlX3BhdGggL2FwaS8qIHsKCQlyZXZlcnNlX3Byb3h5IHRkZXhfdGRleGRfMTo5MDkyCgl9CglyZXZlcnNlX3Byb3h5IHRkZXhfZGFzaGJvYXJkXzE6ODA4MAp9Cg==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/caddy-data"

          [ -e "$D/caddy-data/Caddyfile" ] || cp /seed/f0 "$D/caddy-data/Caddyfile"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: caddy
        image: caddy:2.6.4-alpine@sha256:4dfec6c3b22c36b63ea4a3633c7cdbdaa9926d1324c27db2b0e2b70ef9cd105a
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
        volumeMounts:
        - name: data
          mountPath: /etc/caddy/Caddyfile
          subPath: '{{ .Release.Name }}/caddy-data/Caddyfile'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oceand
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oceand
  template:
    metadata:
      labels:
        app: oceand
    spec:
      containers:
      - name: oceand
        image: ghcr.io/vulpemventures/oceand:v0.1.17@sha256:37b813b43b068e32d918b9f42539c33287308cc81d00909c742b7164dfefc0c4
        imagePullPolicy: IfNotPresent
        env:
        - name: ('OCEAN_LOG_LEVEL', 5)
          value: ''
        - name: ('OCEAN_DB_TYPE', 'badger')
          value: ''
        - name: ('OCEAN_NO_TLS', 'true')
          value: ''
        - name: ('OCEAN_NO_PROFILER', 'true')
          value: ''
        - name: ('OCEAN_UTXO_EXPIRY_DURATION_IN_SECONDS', 240)
          value: ''
        volumeMounts:
        - name: data
          mountPath: /home/ocean/.oceand
          subPath: '{{ .Release.Name }}/ocean-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/caddy-data"

          [ -e "$D/caddy-data/Caddyfile" ] || cp /seed/f0 "$D/caddy-data/Caddyfile"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdexd
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdexd
  template:
    metadata:
      labels:
        app: tdexd
    spec:
      containers:
      - name: tdexd
        image: ghcr.io/tdex-network/tdexd:v1.0.1@sha256:eef1f31e98208e9a35ddf308317bc1df71065e189fa0915c769c7a01394ef79a
        imagePullPolicy: IfNotPresent
        env:
        - name: ('TDEX_LOG_LEVEL', 5)
          value: ''
        - name: ('TDEX_OPERATOR_LISTENING_PORT', '${APP_TDEX_PORT}')
          value: ''
        - name: ('TDEX_TRADE_LISTENING_PORT', '${APP_TDEX_PORT}')
          value: ''
        - name: ('TDEX_NO_OPERATOR_TLS', 'true')
          value: ''
        - name: ('TDEX_WALLET_ADDR', 'oceand:18000')
          value: ''
        - name: ('TDEX_CONNECT_ADDR', '${APP_TDEX_DAEMON_HIDDEN_SERVICE}')
          value: ''
        - name: ('TDEX_CONNECT_PROTO', 'http')
          value: ''
        volumeMounts:
        - name: data
          mountPath: /home/tdex/.tdex-daemon
          subPath: '{{ .Release.Name }}/tdexd'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/caddy-data"

          [ -e "$D/caddy-data/Caddyfile" ] || cp /seed/f0 "$D/caddy-data/Caddyfile"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
