apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tor
  template:
    metadata:
      labels:
        app: tor
    spec:
      containers:
      - name: tor
        image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
        imagePullPolicy: IfNotPresent
        env:
        - name: ('HOME', '/tmp')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /etc/tor/torrc
          subPath: '{{ .Release.Name }}/torrc'
          readOnly: true
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/volumes/${TOR_DATA_DIR}'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/caddy-data"

          [ -e "$D/caddy-data/Caddyfile" ] || cp /seed/f0 "$D/caddy-data/Caddyfile"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
