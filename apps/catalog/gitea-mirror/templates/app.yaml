{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: ghcr.io/raylabshq/gitea-mirror:v3.40.3@sha256:786b193599c60138a3fa04b8d7abc45faef9748af030d49da802c5a478314154
        imagePullPolicy: IfNotPresent
        env:
        - name: ('BETTER_AUTH_SECRET', '${APP_SEED}')
          value: ''
        - name: ('BETTER_AUTH_URL', 'http://${DEVICE_DOMAIN_NAME}:${APP_GITEA_MIRROR_PORT}')
          value: ''
        - name: ('BETTER_AUTH_TRUSTED_ORIGINS', '*')
          value: ''
        - name: ('NODE_ENV', 'production')
          value: ''
        - name: ('DATABASE_URL', 'file:data/gitea-mirror.db')
          value: ''
        - name: ('HOST', '0.0.0.0')
          value: ''
        - name: ('PORT', '4321')
          value: ''
        - name: ('PUBLIC_BETTER_AUTH_URL', 'http://${DEVICE_DOMAIN_NAME}:${APP_GITEA_MIRROR_PORT}')
          value: ''
        - name: ('MIRROR_ISSUE_CONCURRENCY', '3')
          value: ''
        - name: ('MIRROR_PULL_REQUEST_CONCURRENCY', '5')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 4321
        readinessProbe:
          exec:
            command:
            - wget
            - --no-verbose
            - --tries=3
            - --spider
            - http://localhost:4321/api/health
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: '{{ .Release.Name }}/data'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
