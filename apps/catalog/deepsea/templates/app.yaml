{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: ewogICAgInBvd2VyX2Nvc3QiOiAwLjAsCiAgICAicG93ZXJfdXNhZ2UiOiAwLjAsCiAgICAid2FsbGV0IjogInlvdXJ3YWxsZXRoZXJlIiwKICAgICJ0aW1lem9uZSI6ICJBbWVyaWNhL0xvc19BbmdlbGVzIiwKICAgICJuZXR3b3JrX2ZlZSI6IDAuMAp9Cg==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/data"

          [ -e "$D/data/config.json" ] || cp /seed/f0 "$D/data/config.json"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: deepsea
        image: ghcr.io/retropex/custom-dashboard-ocean:v2.0.4@sha256:9f5b867d2c5873390614a5e7faab58a4279ecd451b47b2db0034308c35166970
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
        volumeMounts:
        - name: data
          mountPath: /app/data/
          subPath: '{{ .Release.Name }}/data'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
