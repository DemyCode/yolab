{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: ghcr.io/wavelog/wavelog:3.2.5@sha256:eb582a20ff496fccb25fda5d752dae9ed3728b213a6a45ed06214bbf0401b4c6
        imagePullPolicy: IfNotPresent
        env:
        - name: CI_ENV
          value: docker
        ports:
        - containerPort: 80
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/www/html/application/config/docker
          subPath: 'data/config'
        - name: data
          mountPath: /var/www/html/uploads
          subPath: 'data/uploads'
        - name: data
          mountPath: /var/www/html/userdata
          subPath: 'data/userdata'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wavelog-db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wavelog-db
  template:
    metadata:
      labels:
        app: wavelog-db
    spec:
      containers:
      - name: wavelog-db
        image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
        imagePullPolicy: IfNotPresent
        env:
        - name: MARIADB_RANDOM_ROOT_PASSWORD
          value: 'True'
        - name: MARIADB_DATABASE
          value: wavelog
        - name: MARIADB_USER
          value: wavelog
        - name: MARIADB_PASSWORD
          value: wavelog
        ports:
        - containerPort: 3306
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: 'data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: wavelog-db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: wavelog-db
  ports:
  - port: 3306
    targetPort: 3306
