{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: anirdev/slink:v1.14.0@sha256:fff70ce3cee309377424466565810d500ae4df0d1b918ee47b5126807621841d
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: UTC
        - name: ORIGIN
          value: http://localhost:8811
        - name: REQUIRE_SSL
          value: 'false'
        - name: USER_APPROVAL_REQUIRED
          value: 'false'
        - name: USER_PASSWORD_MIN_LENGTH
          value: '8'
        - name: USER_PASSWORD_REQUIREMENTS
          value: '15'
        - name: IMAGE_MAX_SIZE
          value: 15M
        - name: IMAGE_STRIP_EXIF_METADATA
          value: 'true'
        - name: IMAGE_COMPRESSION_QUALITY
          value: '80'
        - name: STORAGE_PROVIDER
          value: local
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: 3000
        volumeMounts:
        - name: data
          mountPath: /app/var/data
          subPath: '{{ .Release.Name }}/data/var'
        - name: data
          mountPath: /app/slink/images
          subPath: '{{ .Release.Name }}/data/images'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
