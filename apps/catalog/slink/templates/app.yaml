{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: anirdev/slink:v1.14.6@sha256:7f7cab180971caeb83ce8818a676be04a7923dff6bf6e201ae0a9ce4f64be593
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: UTC
        - name: ORIGIN
          value: http://localhost:8811
        - name: REQUIRE_SSL
          value: 'false'
        - name: USER_APPROVAL_REQUIRED
          value: 'false'
        - name: USER_PASSWORD_MIN_LENGTH
          value: '8'
        - name: USER_PASSWORD_REQUIREMENTS
          value: '15'
        - name: IMAGE_MAX_SIZE
          value: 15M
        - name: IMAGE_STRIP_EXIF_METADATA
          value: 'true'
        - name: IMAGE_COMPRESSION_QUALITY
          value: '80'
        - name: STORAGE_PROVIDER
          value: local
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3000
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 3000
        volumeMounts:
        - name: data
          mountPath: /app/var/data
          subPath: 'data/var'
        - name: data
          mountPath: /app/slink/images
          subPath: 'data/images'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
