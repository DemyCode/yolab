{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'AUTH_SECRET=%s\\n' \"$(tr -dc a-f0-9 </dev/urandom | head -c 64)\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\ncp \"$SECRETS\" /yolab/secrets.env\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      - name: app
        image: amruthpillai/reactive-resume:latest@sha256:39e9452a563863d4d6cb2c1c5b2d4bfdd3cc427d4925933f09ab0fc946f76f8f
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        - '. /yolab/env

          set -a

          . /yolab/secrets.env

          set +a

          export APP_URL="https://$YOLAB_FQDN"

          export STORAGE_URL="https://$YOLAB_FQDN/minio/default"

          exec node apps/server/dist/main.js

          '
        env:
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          value: postgresql://rxresume:rxresume@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/rxresume
        - name: PRINTER_ENDPOINT
          value: ws://chrome.{{ .Release.Namespace }}.svc.cluster.local:3000
        - name: S3_ENDPOINT
          value: http://minio.{{ .Release.Namespace }}.svc.cluster.local:9000
        - name: S3_BUCKET
          value: default
        - name: S3_REGION
          value: us-east-1
        - name: S3_ACCESS_KEY
          value: minioadmin
        - name: S3_SECRET_KEY
          value: minioadmin
        - name: S3_FORCE_PATH_STYLE
          value: 'true'
        - name: DISABLE_SIGNUPS
          value: 'false'
        volumeMounts:
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        imagePullPolicy: IfNotPresent
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - rxresume
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: POSTGRES_USER
          value: rxresume
        - name: POSTGRES_PASSWORD
          value: rxresume
        - name: POSTGRES_DB
          value: rxresume
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: {{ .Release.Name }}/postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        readinessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
        command:
        - minio
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: {{ .Release.Name }}/minio
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      containers:
      - name: chrome
        image: ghcr.io/browserless/chromium:v2.57.0@sha256:6bac628b3d8293f8fb251d3a6b63030dfc5a1cb0c7e5c39abe5efd8f4b25360b
        imagePullPolicy: IfNotPresent
        env:
        - name: TIMEOUT
          value: '10000'
        - name: CONCURRENT
          value: '10'
        - name: TOKEN
          value: chrome_token
---
apiVersion: v1
kind: Service
metadata:
  name: chrome
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: chrome
  ports:
  - port: 3000
    targetPort: 3000
