{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'AUTH_SECRET=%s\\n' \"$(tr -dc a-f0-9 </dev/urandom | head -c 64)\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\ncp \"$SECRETS\" /yolab/secrets.env\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: app
        image: amruthpillai/reactive-resume:latest@sha256:ff5d74fed8f8611b3e3182b9420b6b6ed7020aa39db9b5f8e9d8fb090a9374e9
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        command:
        - /bin/sh
        - -c
        - '. /yolab/env

          . /yolab/secrets.env

          export APP_URL="https://$YOLAB_FQDN"

          export STORAGE_URL="https://$YOLAB_FQDN/minio/default"

          exec node apps/server/dist/main.js

          '
        env:
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          value: postgresql://rxresume:rxresume@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/rxresume
        - name: PRINTER_ENDPOINT
          value: ws://chrome.{{ .Release.Namespace }}.svc.cluster.local:3000
        - name: S3_ENDPOINT
          value: http://minio.{{ .Release.Namespace }}.svc.cluster.local:9000
        - name: S3_BUCKET
          value: default
        - name: S3_REGION
          value: us-east-1
        - name: S3_ACCESS_KEY
          value: minioadmin
        - name: S3_SECRET_KEY
          value: minioadmin
        - name: S3_FORCE_PATH_STYLE
          value: 'true'
        - name: DISABLE_SIGNUPS
          value: 'false'
        volumeMounts:
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        imagePullPolicy: IfNotPresent
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - rxresume
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - rxresume
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        env:
        - name: POSTGRES_USER
          value: rxresume
        - name: POSTGRES_PASSWORD
          value: rxresume
        - name: POSTGRES_DB
          value: rxresume
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: {{ .Release.Name }}/postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
        command:
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: {{ .Release.Name }}/minio
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      containers:
      - name: chrome
        image: ghcr.io/browserless/chromium:v2.18.0@sha256:b0adebacc9b737505e3de46b1feec1f184410b22091a778f94fd09bcc48806f1
        imagePullPolicy: IfNotPresent
        env:
        - name: TIMEOUT
          value: '10000'
        - name: CONCURRENT
          value: '10'
        - name: TOKEN
          value: chrome_token
---
apiVersion: v1
kind: Service
metadata:
  name: chrome
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: chrome
  ports:
  - port: 3000
    targetPort: 3000
