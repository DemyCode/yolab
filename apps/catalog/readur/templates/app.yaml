{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: app
        image: ghcr.io/readur/readur:3.0.0@sha256:9880a6ca74d84abb8549a1dbac48a779069c117bf8af19340ab5898193dff11b
        imagePullPolicy: IfNotPresent
        env:
        - name: ('DATABASE_URL', 'postgresql://readur:readur_password@readur_postgres_1:5432/readur')
          value: ''
        - name: ('JWT_SECRET', '${APP_SEED}')
          value: ''
        - name: ('SERVER_ADDRESS', '0.0.0.0:8000')
          value: ''
        - name: ('UPLOAD_PATH', '/app/uploads')
          value: ''
        - name: ('WATCH_FOLDER', '/app/watch')
          value: ''
        - name: ('ALLOWED_FILE_TYPES', 'pdf,png,jpg,jpeg,tiff,bmp,gif,txt,rtf,doc,docx')
          value: ''
        - name: ('WATCH_INTERVAL_SECONDS', 30)
          value: ''
        - name: ('FILE_STABILITY_CHECK_MS', 500)
          value: ''
        - name: ('MAX_FILE_AGE_HOURS', 168)
          value: ''
        - name: ('OCR_LANGUAGE', 'eng')
          value: ''
        - name: ('CONCURRENT_OCR_JOBS', 4)
          value: ''
        - name: ('OCR_TIMEOUT_SECONDS', 300)
          value: ''
        - name: ('MAX_FILE_SIZE_MB', 50)
          value: ''
        - name: ('MEMORY_LIMIT_MB', 512)
          value: ''
        - name: ('CPU_PRIORITY', 'normal')
          value: ''
        - name: ('ADMIN_PASSWORD', 'readur2024')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 8000
        readinessProbe:
          exec:
            command:
            - curl
            - -f
            - http://localhost:8000/api/health
          initialDelaySeconds: 40
          periodSeconds: 30
        volumeMounts:
        - name: data
          mountPath: /app/uploads
          subPath: '{{ .Release.Name }}/data/uploads'
        - name: data
          mountPath: /app/watch
          subPath: '{{ .Release.Name }}/data/watch'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17.5@sha256:3962158596daaef3682838cc8eb0e719ad1ce520f88e34596ce8d5de1b6330a1
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_USER', 'readur')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'readur_password')
          value: ''
        - name: ('POSTGRES_DB', 'readur')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U readur
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/postgres_data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
