{{- $c := .Values.config }}
{{- if eq $c.models_from "new" }}
apiVersion: yolab.io/v1
kind: App
name: ollama
chart: ollama
values: {{ dict "yolab_enabled" false | toJson }}
---
{{- else if eq $c.models_from "existing" }}
apiVersion: yolab.io/v1
kind: App
name: ollama
use: {{ $c.existing_ollama | quote }}
---
{{- end }}
{{- $ollama := dict "from" (index .Values.yolab.apps "ollama" | default "") }}
{{- if eq $c.models_from "elsewhere" }}
{{- $ollama = dict "from" "" "api" $c.ollama_address }}
{{- end }}
{{- $chat := dict "ollama" $ollama "yolab_enabled" $c.chat_anywhere "tailscale_enabled" $c.tailscale }}
{{- if $c.tailscale }}
{{- $_ := set $chat "tailscale_auth_key" $c.tailscale_auth_key }}
{{- end }}
apiVersion: yolab.io/v1
kind: App
name: open-webui
chart: open-webui
main: true
values: {{ $chat | toJson }}
