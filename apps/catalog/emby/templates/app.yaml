{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: server
        image: linuxserver/emby:version-4.10.2.0@sha256:53a11e2882cf9de4dccfd82289b0781846f522022b6810c1723b8304c89e37e1
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Europe/Berlin
        - name: UID
          value: '1000'
        - name: GID
          value: '1000'
        ports:
        - containerPort: 8096
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8096
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: 'data/config'
        - name: data
          mountPath: /downloads
          subPath: 'storage/downloads'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
