{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: chantools
        image: guggero/chantools:v0.14.1-umbrel@sha256:8994745086ab1708205f030f70e37dcfbe57154c72f27782089b229069fd8043
        imagePullPolicy: IfNotPresent
        args:
        - ttyd
        - -W
        - -p
        - '7682'
        - bash
        - -c
        - /bash-wrapper.sh
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 7682
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 7682
        volumeMounts:
        - name: data
          mountPath: /chantools
          subPath: 'data'
        - name: data
          mountPath: /lnd
          subPath: 'umbrel/app-data/lightning/data/lnd'
          readOnly: true
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
