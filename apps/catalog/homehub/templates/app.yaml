{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/data/config"

          [ -e "$D/data/config/config.yml" ] || cp /seed/f0 "$D/data/config/config.yml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: ghcr.io/surajverma/homehub:0.2.4@sha256:fd1a7172b56f01dff3fb9fb5c9c2268baa7ab63ed5d7e348907107a34dee83e8
        imagePullPolicy: IfNotPresent
        env:
        - name: ('FLASK_ENV', 'production')
          value: ''
        - name: ('SECRET_KEY', '${APP_SEED}')
          value: ''
        ports:
        - containerPort: 5000
        readinessProbe:
          tcpSocket:
            port: 5000
        volumeMounts:
        - name: data
          mountPath: /app/uploads
          subPath: '{{ .Release.Name }}/data/uploads'
        - name: data
          mountPath: /app/media
          subPath: '{{ .Release.Name }}/data/media'
        - name: data
          mountPath: /app/pdfs
          subPath: '{{ .Release.Name }}/data/pdfs'
        - name: data
          mountPath: /app/data
          subPath: '{{ .Release.Name }}/data/app_data'
        - name: data
          mountPath: /app/config.yml
          subPath: '{{ .Release.Name }}/data/config/config.yml'
          readOnly: true
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
