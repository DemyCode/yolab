{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      - name: web
        image: dennysubke/torbrowser:15.0.17@sha256:b0c12dbc6b93338ef02f57186f47a57952f864e31f015a9fb47fa6c5afc0d0b1
        imagePullPolicy: IfNotPresent
        env:
        - name: DARK_MODE
          value: '1'
        - name: WEB_AUDIO
          value: '1'
        ports:
        - containerPort: 5800
        readinessProbe:
          tcpSocket:
            port: 5800
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: 'config'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
