{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "100Gi" | quote }}
{{- $gpu := include "frigate.gpu" . | fromJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      {{- if $gpu.name }}
      nodeSelector:
        kubernetes.io/hostname: {{ $gpu.name | quote }}
      {{- end }}
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      
      - name: seed-config
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -e
            mkdir -p /config
            if [ ! -f /config/config.yml ]; then
              cat > /config/config.yml <<'EOF'
            mqtt:
              enabled: false
            tls:
              enabled: false
            cameras: {}
            {{- if eq ($gpu.accelerator | default "") "nvidia" }}
            ffmpeg:
              hwaccel_args: preset-nvidia
            {{- else if $gpu.accelerator }}
            ffmpeg:
              hwaccel_args: preset-vaapi
            {{- end }}
            {{- if eq ($gpu.accelerator | default "") "intel" }}
            detectors:
              ov:
                type: openvino
                device: GPU
            model:
              width: 300
              height: 300
              input_tensor: nhwc
              input_pixel_format: bgr
              path: /openvino-model/ssdlite_mobilenet_v2.xml
              labelmap_path: /openvino-model/coco_91cl_bkgr.txt
            {{- end }}
            EOF
              echo "wrote initial config.yml"
            fi
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ printf "%s/frigate/config" .Release.Name | quote }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      - name: frigate
        image: ghcr.io/blakeblackshear/frigate:stable@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
        imagePullPolicy: IfNotPresent
        readinessProbe:
          tcpSocket:
            port: 8971
          initialDelaySeconds: 30
          periodSeconds: 10
        {{- if eq ($gpu.accelerator | default "") "nvidia" }}
        env:
          - name: NVIDIA_VISIBLE_DEVICES
            value: all
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: all
        {{- end }}
        {{- if $gpu.accelerator }}
        resources:
          limits:
            {{ if eq $gpu.accelerator "nvidia" }}nvidia.com/gpu-all{{ else }}yolab.io/dri{{ end }}: "1"
        {{- end }}
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ printf "%s/frigate/config" .Release.Name | quote }}
          - name: data
            mountPath: /media/frigate
            subPath: {{ printf "%s/frigate/media" .Release.Name | quote }}
          - name: shm
            mountPath: /dev/shm
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
