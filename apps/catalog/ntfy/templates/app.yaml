{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      - name: ntfy
        image: binwiederhier/ntfy:latest@sha256:4c599cf0818965782f93f652bd843e92714992e84d6b88ad17713dc0951cda1f
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 2586
          initialDelaySeconds: 5
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        
        - '. /yolab/env

          export NTFY_BASE_URL="https://$YOLAB_FQDN"

          export NTFY_LISTEN_HTTP=":2586"

          export NTFY_CACHE_FILE=/var/lib/ntfy/cache.db

          export NTFY_AUTH_FILE=/var/lib/ntfy/auth.db

          exec ntfy serve

          '
        volumeMounts:
        - name: data
          mountPath: /var/lib/ntfy
          subPath: {{ .Release.Name }}/ntfy
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
