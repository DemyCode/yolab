{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: ntfy
        image: binwiederhier/ntfy:latest@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /v1/health
            port: 2586
          initialDelaySeconds: 5
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        
        - '. /yolab/env

          export NTFY_BASE_URL="https://$YOLAB_FQDN"

          export NTFY_LISTEN_HTTP=":2586"

          export NTFY_CACHE_FILE=/var/lib/ntfy/cache.db

          export NTFY_AUTH_FILE=/var/lib/ntfy/auth.db

          exec ntfy serve

          '
        volumeMounts:
        - name: data
          mountPath: /var/lib/ntfy
          subPath: ntfy
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
