apiVersion: v2
name: onlyoffice
description: "Edit documents, spreadsheets and slides in the browser, next to Nextcloud"
home: https://www.onlyoffice.com
type: application
version: 0.1.0
dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"
annotations:
  yolab.io/display-name: "ONLYOFFICE Docs"
  yolab.io/icon: "📝"
  yolab.io/category: "productivity"
  yolab.io/uischema: |
    { "subdomain": { "ui:widget": "TunnelWidget" } }
  # Nextcloud's ONLYOFFICE connector asks for this secret. It is generated here and
  # printed once so it can be copied across without anyone inventing their own.
  yolab.io/outputs: |
    [{"key": "jwt_secret", "label": "Connector secret", "type": "text", "pattern": "YOLAB_OUTPUT jwt_secret (\\S+)"}]
