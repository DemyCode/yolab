{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.21-alpine@sha256:686aac2769fd6e7bab67663fd38750c135b72d993d0bb0a942ab02ef647fc9c3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /etc/nginx/conf.d/nginx.conf
          subPath: '{{ .Release.Name }}/config/nginx.conf'
          readOnly: true
        - name: data
          mountPath: /var/www/html/public
          subPath: '{{ .Release.Name }}/data/public'
          readOnly: true
        - name: data
          mountPath: /var/www/html/storage
          subPath: '{{ .Release.Name }}/data/fake/../storage'
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: invoiceninja/invoiceninja-debian:5.13.43@sha256:c052414958dce9bb186f3da83c8066c84d419092e7a55025b5a7c201eff75387
        imagePullPolicy: IfNotPresent
        env:
        - name: ('APP_URL', 'http://${APP_DOMAIN}:8676')
          value: ''
        - name: ('APP_KEY', '${APP_KEY:-unset}')
          value: ''
        - name: ('APP_ENV', 'production')
          value: ''
        - name: ('APP_DEBUG', 'false')
          value: ''
        - name: ('REQUIRE_HTTPS', 'false')
          value: ''
        - name: ('DB_HOST', 'invoice-ninja_db_1')
          value: ''
        - name: ('DB_DATABASE', 'invoiceninja')
          value: ''
        - name: ('DB_USERNAME', 'invoiceninja')
          value: ''
        - name: ('DB_PASSWORD', 'moneyprintergobrrr')
          value: ''
        - name: ('IN_USER_EMAIL', 'admin@example.com')
          value: ''
        - name: ('IN_PASSWORD', '$APP_PASSWORD')
          value: ''
        - name: ('IS_DOCKER', 'true')
          value: ''
        - name: ('CACHE_DRIVER', 'redis')
          value: ''
        - name: ('QUEUE_CONNECTION', 'redis')
          value: ''
        - name: ('SESSION_DRIVER', 'redis')
          value: ''
        - name: ('REDIS_HOST', 'invoice-ninja_redis_1')
          value: ''
        - name: ('REDIS_PASSWORD', None)
          value: ''
        - name: ('REDIS_PORT', 6379)
          value: ''
        - name: ('FILESYSTEM_DISK', 'debian_docker')
          value: ''
        volumeMounts:
        - name: data
          mountPath: /var/www/html/public
          subPath: '{{ .Release.Name }}/data/public'
        - name: data
          mountPath: /var/www/html/storage
          subPath: '{{ .Release.Name }}/data/fake/../storage'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:11.4.5@sha256:5dfb3093333fa0ea53194ddef0a2bfa21d3b1e1353bd228b22610cd6fc0c04da
        imagePullPolicy: IfNotPresent
        env:
        - name: ('MYSQL_ROOT_PASSWORD', 'invoiceninja')
          value: ''
        - name: ('MYSQL_USER', 'invoiceninja')
          value: ''
        - name: ('MYSQL_PASSWORD', 'moneyprintergobrrr')
          value: ''
        - name: ('MYSQL_DATABASE', 'invoiceninja')
          value: ''
        - name: ('MARIADB_AUTO_UPGRADE', 'true')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          initialDelaySeconds: 10
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.3@sha256:ee8ec723c831b815c3e2f2c6fbd1c145c68d1c04ba284f044ec1434fbca0fee8
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/redis'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
