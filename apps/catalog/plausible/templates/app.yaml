{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
  f1: PGNsaWNraG91c2U+CiAgICA8cHJvZmlsZXM+CiAgICAgICAgPGRlZmF1bHQ+CiAgICAgICAgICAgIDxsb2dfcXVlcmllcz4wPC9sb2dfcXVlcmllcz4KICAgICAgICAgICAgPGxvZ19xdWVyeV90aHJlYWRzPjA8L2xvZ19xdWVyeV90aHJlYWRzPgogICAgICAgIDwvZGVmYXVsdD4KICAgIDwvcHJvZmlsZXM+CjwvY2xpY2tob3VzZT4K
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/clickhouse"

          [ -e "$D/clickhouse/clickhouse-config.xml" ] || cp /seed/f0 "$D/clickhouse/clickhouse-config.xml"

          mkdir -p "$D/clickhouse"

          [ -e "$D/clickhouse/clickhouse-user-config.xml" ] || cp /seed/f1 "$D/clickhouse/clickhouse-user-config.xml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: plausible
        image: ghcr.io/plausible/community-edition:v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
        imagePullPolicy: IfNotPresent
        args:
        - /bin/sh
        - -c
        - sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
        env:
        - name: ('BASE_URL', 'http://${DEVICE_DOMAIN_NAME}:9093')
          value: ''
        - name: ('SECRET_KEY_BASE', '${APP_SEED}')
          value: ''
        - name: ('TOTP_VAULT_KEY', '${APP_PLAUSIBLE_VAULT_KEY}')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible_db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plausible_db
  template:
    metadata:
      labels:
        app: plausible_db
    spec:
      containers:
      - name: plausible_db
        image: postgres:16-alpine@sha256:492898505cb45f9835acc327e98711eaa9298ed804e0bb36f29e08394229550d
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_PASSWORD', 'postgres')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          tcpSocket:
            port: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/db-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/clickhouse"

          [ -e "$D/clickhouse/clickhouse-config.xml" ] || cp /seed/f0 "$D/clickhouse/clickhouse-config.xml"

          mkdir -p "$D/clickhouse"

          [ -e "$D/clickhouse/clickhouse-user-config.xml" ] || cp /seed/f1 "$D/clickhouse/clickhouse-user-config.xml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: plausible_db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: plausible_db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible_events_db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plausible_events_db
  template:
    metadata:
      labels:
        app: plausible_events_db
    spec:
      containers:
      - name: plausible_events_db
        image: clickhouse/clickhouse-server:24.12-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
        imagePullPolicy: IfNotPresent
        env:
        - name: ('CLICKHOUSE_SKIP_USER_SETUP', '1')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
          subPath: '{{ .Release.Name }}/event-data'
        - name: data
          mountPath: /var/log/clickhouse-server
          subPath: '{{ .Release.Name }}/event-logs'
        - name: data
          mountPath: /etc/clickhouse-server/config.d/logging.xml
          subPath: '{{ .Release.Name }}/clickhouse/clickhouse-config.xml'
          readOnly: true
        - name: data
          mountPath: /etc/clickhouse-server/users.d/logging.xml
          subPath: '{{ .Release.Name }}/clickhouse/clickhouse-user-config.xml'
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/clickhouse"

          [ -e "$D/clickhouse/clickhouse-config.xml" ] || cp /seed/f0 "$D/clickhouse/clickhouse-config.xml"

          mkdir -p "$D/clickhouse"

          [ -e "$D/clickhouse/clickhouse-user-config.xml" ] || cp /seed/f1 "$D/clickhouse/clickhouse-user-config.xml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
