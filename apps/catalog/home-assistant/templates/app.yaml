{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.config.node }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.config.node | quote }}
      {{- else }}
      {{- end }}
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      
      - name: seed-config
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -e
            mkdir -p /config
            if [ ! -f /config/configuration.yaml ]; then
              cat > /config/configuration.yaml <<'EOF'
            default_config:
            http:
              use_x_forwarded_for: true
              trusted_proxies:
                - 127.0.0.1
                - ::1
            EOF
              echo "wrote initial configuration.yaml"
            fi
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ printf "%s/home-assistant" .Release.Name | quote }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4
        imagePullPolicy: IfNotPresent
        readinessProbe:
          tcpSocket:
            port: 8123
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ printf "%s/home-assistant" .Release.Name | quote }}
          - name: data
            mountPath: /media
            subPath: {{ printf "%s/home-assistant/media" .Release.Name | quote }}
          - name: dev
            mountPath: /dev
          - name: dbus
            mountPath: /run/dbus
            readOnly: true
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: dev
        hostPath:
          path: /dev
      - name: dbus
        hostPath:
          path: /run/dbus
