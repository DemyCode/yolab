{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: server
        image: linuxserver/lidarr:3.1.0@sha256:f2a186ce04ec5adb133f92a08dd3efbc918fc71b33077426ef099d94350dfa1b
        imagePullPolicy: IfNotPresent
        env:
        - name: ('PUID', '1000')
          value: ''
        - name: ('PGID', '1000')
          value: ''
        ports:
        - containerPort: 8686
        readinessProbe:
          tcpSocket:
            port: 8686
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: '{{ .Release.Name }}/data/config'
        - name: data
          mountPath: /downloads
          subPath: '{{ .Release.Name }}/storage/downloads'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mac
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mac
  template:
    metadata:
      labels:
        app: mac
    spec:
      containers:
      - name: mac
        image: getumbrel/media-app-configurator:v1.3.2@sha256:9ff34bda1e36ffe5a028d2463f4aaa9f20b93e8bec4392da077137c56bea3c34
        imagePullPolicy: IfNotPresent
        env:
        - name: ('APP_ID', 'lidarr')
          value: ''
        - name: ('APP_URL', 'http://lidarr_server_1:8686')
          value: ''
        - name: ('TRANSMISSION_HOST', 'transmission_server_1')
          value: ''
        - name: ('TRANSMISSION_PORT', 9091)
          value: ''
        - name: ('ROOT_FOLDER', '/downloads/music')
          value: ''
        - name: ('QBITTORRENT_INSTALLED', '${APP_LIDARR_QBITTORRENT_INSTALLED:-"false"}')
          value: ''
        - name: ('QBITTORRENT_HOST', 'qbittorrent_server_1')
          value: ''
        - name: ('QBITTORRENT_PORT', 8080)
          value: ''
        - name: ('SABNZBD_INSTALLED', '${APP_LIDARR_SABNZBD_INSTALLED:-"false"}')
          value: ''
        - name: ('SABNZBD_HOST', 'sabnzbd_web_1')
          value: ''
        - name: ('SABNZBD_PORT', 8080)
          value: ''
        - name: ('SABNZBD_API_KEY', '${APP_LIDARR_SABNZBD_API_KEY:-""}')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: '{{ .Release.Name }}/data/config'
        - name: data
          mountPath: /downloads
          subPath: '{{ .Release.Name }}/storage/downloads'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
