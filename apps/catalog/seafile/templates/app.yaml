{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:10.11.6@sha256:e846701e66dcc95a3f90d161cc3dfc2e4ff96f0699ee4fb93b0bfdab94158570
        imagePullPolicy: IfNotPresent
        env:
        - name: ('MYSQL_ROOT_PASSWORD', 'db_dev')
          value: ''
        - name: ('MYSQL_LOG_CONSOLE', 'true')
          value: ''
        - name: ('MARIADB_AUTO_UPGRADE', '1')
          value: ''
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memcached
  template:
    metadata:
      labels:
        app: memcached
    spec:
      containers:
      - name: memcached
        image: memcached:1.6.42@sha256:26983a43c9181d37d0f9b0d2cf49c3ccf02e5b816afb1f8ffff7f825e65bcdad
        imagePullPolicy: IfNotPresent
        command:
        - memcached
        - -m
        - '256'
        ports:
        - containerPort: 11211
        readinessProbe:
          tcpSocket:
            port: 11211
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: memcached
  ports:
  - port: 11211
    targetPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      containers:
      - name: seafile
        image: seafileltd/seafile-mc:13.0.28@sha256:b0c90832126bf432db908449f1bb450211e6bbf75a2193bab3399e2a9636eccf
        imagePullPolicy: IfNotPresent
        env:
        - name: ('DB_HOST', 'seafile-mysql')
          value: ''
        - name: ('DB_ROOT_PASSWD', 'db_dev')
          value: ''
        - name: ('SEAFILE_MYSQL_DB_HOST', 'seafile-mysql')
          value: ''
        - name: ('SEAFILE_MYSQL_DB_PORT', '3306')
          value: ''
        - name: ('SEAFILE_MYSQL_DB_USER', 'root')
          value: ''
        - name: ('SEAFILE_MYSQL_DB_PASSWORD', 'db_dev')
          value: ''
        - name: ('INIT_SEAFILE_MYSQL_ROOT_PASSWORD', 'db_dev')
          value: ''
        - name: ('SEAFILE_MYSQL_DB_CCNET_DB_NAME', 'ccnet_db')
          value: ''
        - name: ('SEAFILE_MYSQL_DB_SEAFILE_DB_NAME', 'seafile_db')
          value: ''
        - name: ('SEAFILE_MYSQL_DB_SEAHUB_DB_NAME', 'seahub_db')
          value: ''
        - name: ('JWT_PRIVATE_KEY', '${APP_SEED}')
          value: ''
        - name: ('INIT_SEAFILE_ADMIN_EMAIL', 'umbrel')
          value: ''
        - name: ('INIT_SEAFILE_ADMIN_PASSWORD', '${APP_PASSWORD}')
          value: ''
        - name: ('SEAFILE_SERVER_LETSENCRYPT', 'false')
          value: ''
        - name: ('SEAFILE_SERVER_HOSTNAME', '${DEVICE_DOMAIN_NAME}:8920')
          value: ''
        - name: ('SEAFILE_SERVER_PROTOCOL', 'http')
          value: ''
        - name: ('SITE_ROOT', '/')
          value: ''
        - name: ('ENABLE_SEADOC', 'true')
          value: ''
        - name: ('SEADOC_SERVER_URL', 'http://${DEVICE_DOMAIN_NAME}:8921')
          value: ''
        - name: ('CACHE_PROVIDER', 'memcached')
          value: ''
        - name: ('MEMCACHED_HOST', 'memcached')
          value: ''
        - name: ('MEMCACHED_PORT', '11211')
          value: ''
        volumeMounts:
        - name: data
          mountPath: /shared
          subPath: '{{ .Release.Name }}/data/seafile-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seadoc
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seadoc
  template:
    metadata:
      labels:
        app: seadoc
    spec:
      containers:
      - name: seadoc
        image: seafileltd/sdoc-server:2.0.9@sha256:5b1bf5a8bfdb8bc5db957e7faee2220111fd6eff00795eaaf172e2f80bb999a5
        imagePullPolicy: IfNotPresent
        env:
        - name: ('DB_HOST', 'seafile-mysql')
          value: ''
        - name: ('DB_USER', 'root')
          value: ''
        - name: ('DB_PASSWORD', 'db_dev')
          value: ''
        - name: ('DB_NAME', 'seahub_db')
          value: ''
        - name: ('JWT_PRIVATE_KEY', '${APP_SEED}')
          value: ''
        - name: ('SEAHUB_SERVICE_URL', 'http://seafile')
          value: ''
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /shared
          subPath: '{{ .Release.Name }}/data/seadoc-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: seadoc
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: seadoc
  ports:
  - port: 80
    targetPort: 80
