{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:10.11.6@sha256:e846701e66dcc95a3f90d161cc3dfc2e4ff96f0699ee4fb93b0bfdab94158570
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: db_dev
        - name: MYSQL_LOG_CONSOLE
          value: 'true'
        - name: MARIADB_AUTO_UPGRADE
          value: '1'
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memcached
  template:
    metadata:
      labels:
        app: memcached
    spec:
      containers:
      - name: memcached
        image: memcached:1.6.42@sha256:26983a43c9181d37d0f9b0d2cf49c3ccf02e5b816afb1f8ffff7f825e65bcdad
        imagePullPolicy: IfNotPresent
        command:
        - memcached
        - -m
        - '256'
        ports:
        - containerPort: 11211
        readinessProbe:
          tcpSocket:
            port: 11211
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: memcached
  ports:
  - port: 11211
    targetPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      containers:
      - name: seafile
        image: seafileltd/seafile-mc:13.0.28@sha256:b0c90832126bf432db908449f1bb450211e6bbf75a2193bab3399e2a9636eccf
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: DB_HOST
          value: seafile-mysql
        - name: DB_ROOT_PASSWD
          value: db_dev
        - name: SEAFILE_MYSQL_DB_HOST
          value: seafile-mysql
        - name: SEAFILE_MYSQL_DB_PORT
          value: '3306'
        - name: SEAFILE_MYSQL_DB_USER
          value: root
        - name: SEAFILE_MYSQL_DB_PASSWORD
          value: db_dev
        - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
          value: db_dev
        - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
          value: ccnet_db
        - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
          value: seafile_db
        - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
          value: seahub_db
        - name: JWT_PRIVATE_KEY
          value: $(APP_SEED)
        - name: INIT_SEAFILE_ADMIN_EMAIL
          value: umbrel
        - name: INIT_SEAFILE_ADMIN_PASSWORD
          value: $(APP_PASSWORD)
        - name: SEAFILE_SERVER_LETSENCRYPT
          value: 'false'
        - name: SEAFILE_SERVER_HOSTNAME
          value: localhost:8920
        - name: SEAFILE_SERVER_PROTOCOL
          value: http
        - name: SITE_ROOT
          value: /
        - name: ENABLE_SEADOC
          value: 'true'
        - name: SEADOC_SERVER_URL
          value: http://localhost:8921
        - name: CACHE_PROVIDER
          value: memcached
        - name: MEMCACHED_HOST
          value: memcached
        - name: MEMCACHED_PORT
          value: '11211'
        volumeMounts:
        - name: data
          mountPath: /shared
          subPath: '{{ .Release.Name }}/data/seafile-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seadoc
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seadoc
  template:
    metadata:
      labels:
        app: seadoc
    spec:
      containers:
      - name: seadoc
        image: seafileltd/sdoc-server:2.0.9@sha256:5b1bf5a8bfdb8bc5db957e7faee2220111fd6eff00795eaaf172e2f80bb999a5
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: DB_HOST
          value: seafile-mysql
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: db_dev
        - name: DB_NAME
          value: seahub_db
        - name: JWT_PRIVATE_KEY
          value: $(APP_SEED)
        - name: SEAHUB_SERVICE_URL
          value: http://seafile
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /shared
          subPath: '{{ .Release.Name }}/data/seadoc-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: seadoc
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: seadoc
  ports:
  - port: 80
    targetPort: 80
