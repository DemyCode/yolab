{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:10.11.19@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: db_dev
        - name: MYSQL_LOG_CONSOLE
          value: 'true'
        - name: MARIADB_AUTO_UPGRADE
          value: '1'
        ports:
        - containerPort: 80
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: 'data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memcached
  template:
    metadata:
      labels:
        app: memcached
    spec:
      containers:
      - name: memcached
        image: memcached:1.6.45@sha256:a395a1bcf5e0e2b0fa4a0142e12b4e24a2320ba4b7c6ffa8655a1a86e8f29dee
        imagePullPolicy: IfNotPresent
        command:
        - memcached
        - -m
        - '256'
        ports:
        - containerPort: 11211
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 11211
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: memcached
  ports:
  - port: 11211
    targetPort: 11211
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      containers:
      - name: seafile
        image: seafileltd/seafile-mc:13.0.29@sha256:9506f49d5e5065082c134e6348498eed5a5866ddbd94bd5a3e479a6c285bc61a
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: DB_HOST
          value: seafile-mysql
        - name: DB_ROOT_PASSWD
          value: db_dev
        - name: SEAFILE_MYSQL_DB_HOST
          value: seafile-mysql
        - name: SEAFILE_MYSQL_DB_PORT
          value: '3306'
        - name: SEAFILE_MYSQL_DB_USER
          value: root
        - name: SEAFILE_MYSQL_DB_PASSWORD
          value: db_dev
        - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
          value: db_dev
        - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
          value: ccnet_db
        - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
          value: seafile_db
        - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
          value: seahub_db
        - name: JWT_PRIVATE_KEY
          value: $(APP_SEED)
        - name: INIT_SEAFILE_ADMIN_EMAIL
          value: umbrel
        - name: INIT_SEAFILE_ADMIN_PASSWORD
          value: $(APP_PASSWORD)
        - name: SEAFILE_SERVER_LETSENCRYPT
          value: 'false'
        - name: SEAFILE_SERVER_HOSTNAME
          value: localhost:8920
        - name: SEAFILE_SERVER_PROTOCOL
          value: http
        - name: SITE_ROOT
          value: /
        - name: ENABLE_SEADOC
          value: 'true'
        - name: SEADOC_SERVER_URL
          value: http://localhost:8921
        - name: CACHE_PROVIDER
          value: memcached
        - name: MEMCACHED_HOST
          value: memcached
        - name: MEMCACHED_PORT
          value: '11211'
        volumeMounts:
        - name: data
          mountPath: /shared
          subPath: 'data/seafile-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seadoc
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seadoc
  template:
    metadata:
      labels:
        app: seadoc
    spec:
      containers:
      - name: seadoc
        image: seafileltd/sdoc-server:2.0.11@sha256:ec9a7d0baa61835b903a8815baca00e63cebfc5a63577ab167181a37aa93c7c3
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: DB_HOST
          value: seafile-mysql
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: db_dev
        - name: DB_NAME
          value: seahub_db
        - name: JWT_PRIVATE_KEY
          value: $(APP_SEED)
        - name: SEAHUB_SERVICE_URL
          value: http://seafile
        ports:
        - containerPort: 80
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /shared
          subPath: 'data/seadoc-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: seadoc
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: seadoc
  ports:
  - port: 80
    targetPort: 80
