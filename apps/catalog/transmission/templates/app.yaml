{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
{{ include "yolab-common.files" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "yolab-common.filesDirs" (list . (list .Values.config.downloads_path)) | nindent 6 }}
      - name: settings
        image: linuxserver/transmission:4.1.3@sha256:d6caecad406774a18511be7bfa99ba5070c17a3bdd7a5d73091651841603273c
        imagePullPolicy: IfNotPresent
        env:
        - name: DOWNLOADS
          value: {{ include "yolab-common.files.path" (list . .Values.config.downloads_path) | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          f=/config/settings.json
          pw=/config/yolab-rpc-password
          if [ ! -f "$f" ]; then
            echo '{}' > "$f"
          fi
          if [ ! -s "$pw" ]; then
            tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > "$pw"
          fi
          jq --arg d "$DOWNLOADS" '.["download-dir"] = $d | .["incomplete-dir"] = ($d + "/.incomplete") | .["rpc-port"] = 9095' "$f" > "$f.new"
          mv "$f.new" "$f"
          chown 1000:1000 "$f" "$pw"
          chmod 600 "$pw"
          echo "YOLAB_OUTPUT rpc_username yolab"
          echo "YOLAB_OUTPUT rpc_password $(cat "$pw")"
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: 'data/config'
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: server
        image: linuxserver/transmission:4.1.3@sha256:d6caecad406774a18511be7bfa99ba5070c17a3bdd7a5d73091651841603273c
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          PASS=$(cat /config/yolab-rpc-password)
          if [ -z "$PASS" ]; then
            echo "no Transmission password: refusing to start with RPC open" >&2
            exit 1
          fi
          export USER=yolab PASS
          exec /init
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        ports:
        - containerPort: 9095
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 9095
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: 'data/config'
        {{- include "yolab-common.filesMount" $ | nindent 8 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      {{- include "yolab-common.filesVolume" $ | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-server
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: widget-server
  template:
    metadata:
      labels:
        app: widget-server
    spec:
      containers:
      - name: widget-server
        image: getumbrel/umbrel-transmission-widget-server:v1.0.0@sha256:0ee30f1eecbf6f4f3f62e3f6d5c1626bd31d15ace7e97cacff5fc091836650cf
        imagePullPolicy: IfNotPresent
        env:
        - name: TRANSMISSION_URL
          value: http://server
        - name: TRANSMISSION_PORT
          value: '9095'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
