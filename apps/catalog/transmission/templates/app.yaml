{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
{{ include "yolab-common.files" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.filesDirs" (list . (list .Values.config.downloads_path)) | nindent 6 }}
      - name: download-dir
        image: {{ include "yolab-common.image.wgRegister" . }}
        imagePullPolicy: IfNotPresent
        env:
        - name: DOWNLOADS
          value: {{ include "yolab-common.files.path" (list . .Values.config.downloads_path) | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          f=/config/settings.json
          if [ -f "$f" ]; then
            sed -i -E "s#(\"download-dir\": *)\"[^\"]*\"#\1\"$DOWNLOADS\"#; s#(\"incomplete-dir\": *)\"[^\"]*\"#\1\"$DOWNLOADS/.incomplete\"#" "$f"
          else
            printf '{\n    "download-dir": "%s",\n    "incomplete-dir": "%s/.incomplete"\n}\n' "$DOWNLOADS" "$DOWNLOADS" > "$f"
          fi
          chown 1000:1000 "$f"
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: 'data/config'
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: server
        image: linuxserver/transmission:4.1.3@sha256:d6caecad406774a18511be7bfa99ba5070c17a3bdd7a5d73091651841603273c
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        ports:
        - containerPort: 9091
        readinessProbe:
          tcpSocket:
            port: 9091
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: 'data/config'
        {{- include "yolab-common.filesMount" $ | nindent 8 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      {{- include "yolab-common.filesVolume" $ | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: widget-server
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: widget-server
  template:
    metadata:
      labels:
        app: widget-server
    spec:
      containers:
      - name: widget-server
        image: getumbrel/umbrel-transmission-widget-server:v1.0.0@sha256:0ee30f1eecbf6f4f3f62e3f6d5c1626bd31d15ace7e97cacff5fc091836650cf
        imagePullPolicy: IfNotPresent
        env:
        - name: TRANSMISSION_URL
          value: http://server
        - name: TRANSMISSION_PORT
          value: '9091'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
