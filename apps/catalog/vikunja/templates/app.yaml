{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1000
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "app_secret" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "app_secret") "admin_password" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "admin_password"))) | nindent 6 }}
      - name: shell
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        imagePullPolicy: IfNotPresent
        command:
        - cp
        - /bin/busybox
        - /shell/busybox
        volumeMounts:
        - name: shell
          mountPath: /shell
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: vikunja
        image: vikunja/vikunja:latest@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
        imagePullPolicy: IfNotPresent
        command:
          - /shell/busybox
          - sh
          - -c
          - |
            . /yolab/env
            set -eu
            export VIKUNJA_SERVICE_PUBLICURL="$YOLAB_URL"
            if [ ! -e /db/yolab-admin-created ]; then
              /app/vikunja/vikunja user create -u admin -e admin@vikunja.invalid -p "$ADMIN_PASSWORD"
              /shell/busybox touch /db/yolab-admin-created
            fi
            exec /app/vikunja/vikunja
        env:
          - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
            value: "false"
          - name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: admin_password
          - name: VIKUNJA_DATABASE_TYPE
            value: "sqlite"
          - name: VIKUNJA_DATABASE_PATH
            value: "/db/vikunja.db"
          - name: VIKUNJA_FILES_BASEPATH
            value: "/files"
          - name: VIKUNJA_SERVICE_JWTSECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: app_secret
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 3456
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /db
            subPath: vikunja/db
          - name: data
            mountPath: /files
            subPath: vikunja/files
          - name: yolab
            mountPath: /yolab
          - name: shell
            mountPath: /shell
      volumes:
      - name: shell
        emptyDir: {}
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
