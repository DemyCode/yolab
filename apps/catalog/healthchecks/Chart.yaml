apiVersion: v2
name: healthchecks
description: "Watches the jobs that are supposed to run, and tells you when one silently stops"
home: https://healthchecks.io
type: application
version: 0.1.0

dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/outputs: |
    [
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
  yolab.io/display-name: "Healthchecks"
  yolab.io/icon: "🫀"
  yolab.io/category: "monitoring"
  yolab.io/uischema: |
    {
      "subdomain": { "ui:widget": "TunnelWidget" },
      "admin_password": { "ui:widget": "password" }
    }
