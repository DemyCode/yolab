{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: gitlab
        image: gitlab/gitlab-ce:19.5.3-ce.0@sha256:6863d156a1a477bd6f69fc674b671d0163cd8b06bf63bb17cc4a4a803b78b27c
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: GITLAB_OMNIBUS_CONFIG
          value: '# Add any other gitlab.rb configuration here, each on its own line

            gitlab_rails[''initial_root_password''] = ''$(APP_PASSWORD)''

            gitlab_rails[''gitlab_shell_ssh_port''] = 2424

            nginx[''listen_port''] = 8929

            nginx[''listen_https''] = false

            '
        ports:
        - containerPort: 8929
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8929
        volumeMounts:
        - name: data
          mountPath: /etc/gitlab
          subPath: 'data/config'
        - name: data
          mountPath: /var/log/gitlab
          subPath: 'data/logs'
        - name: data
          mountPath: /var/opt/gitlab
          subPath: 'data/data'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
