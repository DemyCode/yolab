{{- $engine := include "ollama.engine" . | fromJson }}
{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.apiKeyInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      {{- if or $engine.machine $engine.x86Only }}
      nodeSelector:
        {{- if $engine.machine }}
        kubernetes.io/hostname: {{ $engine.machine | quote }}
        {{- end }}
        {{- if $engine.x86Only }}
        kubernetes.io/arch: amd64
        {{- end }}
      {{- end }}
      containers:
      - name: ollama
        image: {{ $engine.image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_HOST
          value: "[::]:11434"
        - name: OLLAMA_ORIGINS
          value: '*'
        - name: OLLAMA_CONTEXT_LENGTH
          value: '8192'
        - name: OLLAMA_IGPU_ENABLE
          value: '1'
        ports:
        - containerPort: 11434
        readinessProbe:
          tcpSocket:
            port: 11434
        {{- if $engine.device }}
        resources:
          limits:
            {{ $engine.device }}: "1"
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
          subPath: '{{ .Release.Name }}/data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ollama
  ports:
  - name: http
    port: 11434
    targetPort: 11434
