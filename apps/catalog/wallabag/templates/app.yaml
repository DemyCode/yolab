{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
{{- /* Listens on 80, which Caddy already binds in the gateway pod — containers
       in a pod share one network namespace, so this cannot live beside it. Running
       here instead means it has no access to the gateway's /yolab/env emptyDir, so
       yolabEnvInit reconstructs the same file from the shared PVC. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
    spec:
      initContainers:
      {{- include "yolab-common.yolabEnvInit" . | nindent 6 }}
      containers:
      - name: wallabag
        image: wallabag/wallabag:latest@sha256:4a527e027e0d59e87c14225ef11e005af3d4890374202ad319ce5e63dfc66709
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            . /yolab/env
            export SYMFONY__ENV__DOMAIN_NAME="$YOLAB_URL"
            exec /entrypoint.sh wallabag
        env:
          - name: SYMFONY__ENV__DATABASE_DRIVER
            value: "pdo_sqlite"
          - name: SYMFONY__ENV__DATABASE_PATH
            value: "/var/www/wallabag/data/db/wallabag.sqlite"
          - name: SYMFONY__ENV__FOSUSER_REGISTRATION
            value: "false"
          - name: SYMFONY__ENV__MAILER_DSN
            value: "smtp://127.0.0.1"
          - name: SYMFONY__ENV__FROM_EMAIL
            value: "wallabag@example.com"
          - name: SYMFONY__ENV__SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: app_secret
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
          - name: data
            mountPath: /var/www/wallabag/data
            subPath: {{ .Release.Name }}/wallabag/data
          - name: data
            mountPath: /var/www/wallabag/web/assets/images
            subPath: {{ .Release.Name }}/wallabag/images
          - name: yolab
            mountPath: /yolab
      volumes:
      {{- include "yolab-common.yolabEnvVolumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: wallabag
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: wallabag
  ports:
    - port: 80
      targetPort: 80
