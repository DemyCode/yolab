{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "authelia.embed.service" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "authelia.oidc.clientInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "app_secret" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "app_secret"))) | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      - name: karakeep
        image: ghcr.io/karakeep-app/karakeep:release@sha256:151cdd6b5f2e21635645983e126f411675bfa35becb02c028c1a727f45f899c6
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            . /yolab/env
            export NEXTAUTH_URL="$YOLAB_URL"
            {{- if eq (include "authelia.embed.oidc" .) "true" }}
            . /yolab/oidc.env
            export OAUTH_WELLKNOWN_URL="$OIDC_DISCOVERY_URL"
            export OAUTH_CLIENT_ID="$OIDC_CLIENT_ID"
            export OAUTH_CLIENT_SECRET="$OIDC_CLIENT_SECRET"
            export OAUTH_PROVIDER_NAME="$OIDC_PROVIDER_NAME"
            export OAUTH_SCOPE="openid email profile"
            {{- end }}
            exec /init
        env:
          - name: DATA_DIR
            value: "/data"
          - name: DISABLE_NEW_RELEASE_CHECK
            value: "true"
          - name: NEXTAUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: app_secret
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /data
            subPath: karakeep
          - name: yolab
            mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
