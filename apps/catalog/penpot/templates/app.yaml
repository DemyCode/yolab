{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: penpot-frontend
        image: penpotapp/frontend:2.18.2@sha256:3619f48cbdd0c9197ad23bd3db1c9b4391d7c9c3137e22e806cd7f9c945c1c8e
        imagePullPolicy: IfNotPresent
        env:
        - name: ('PENPOT_FLAGS', 'enable-registration enable-login-with-password')
          value: ''
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
        volumeMounts:
        - name: data
          mountPath: /opt/data/assets
          subPath: '{{ .Release.Name }}/data/assets'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-backend
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: penpot-backend
  template:
    metadata:
      labels:
        app: penpot-backend
    spec:
      containers:
      - name: penpot-backend
        image: penpotapp/backend:2.18.2@sha256:5f362bda5b8df6684a5710c4c273f7c8aadb759ba6ebcd0cde18a348ad9b9828
        imagePullPolicy: IfNotPresent
        env:
        - name: ('PENPOT_FLAGS', 'enable-registration enable-login-with-password disable-email-verification
            disable-smtp enable-prepl-server disable-secure-session-cookies')
          value: ''
        - name: ('PENPOT_SECRET_KEY', '${APP_SEED}')
          value: ''
        - name: ('PENPOT_DATABASE_URI', 'postgresql://penpot-postgres/penpot')
          value: ''
        - name: ('PENPOT_DATABASE_USERNAME', 'penpot')
          value: ''
        - name: ('PENPOT_DATABASE_PASSWORD', 'penpot')
          value: ''
        - name: ('PENPOT_REDIS_URI', 'redis://penpot_penpot-valkey_1/0')
          value: ''
        - name: ('PENPOT_OBJECTS_STORAGE_BACKEND', 'fs')
          value: ''
        - name: ('PENPOT_OBJECTS_STORAGE_FS_DIRECTORY', '/opt/data/assets')
          value: ''
        - name: ('PENPOT_TELEMETRY_ENABLED', 'false')
          value: ''
        - name: ('PENPOT_PUBLIC_URI', 'http://${DEVICE_DOMAIN_NAME}:${APP_PENPOT_UI_PORT}')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /opt/data/assets
          subPath: '{{ .Release.Name }}/data/assets'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-exporter
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: penpot-exporter
  template:
    metadata:
      labels:
        app: penpot-exporter
    spec:
      containers:
      - name: penpot-exporter
        image: penpotapp/exporter:2.18.2@sha256:4329b95d4b334b6ff95e80642fa634872a3111d6264f20e6262e43db4129ee58
        imagePullPolicy: IfNotPresent
        env:
        - name: ('PENPOT_SECRET_KEY', '${APP_SEED}')
          value: ''
        - name: ('PENPOT_PUBLIC_URI', 'http://${DEVICE_DOMAIN_NAME}:${APP_PENPOT_UI_PORT}')
          value: ''
        - name: ('PENPOT_INTERNAL_URI', 'http://penpot-frontend:8080')
          value: ''
        - name: ('PENPOT_REDIS_URI', 'redis://penpot_penpot-valkey_1/0')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-mcp
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: penpot-mcp
  template:
    metadata:
      labels:
        app: penpot-mcp
    spec:
      containers:
      - name: penpot-mcp
        image: penpotapp/mcp:2.18.2@sha256:f9f3faf5bad722b96178d705822c59b46bcf252da31f56dad6edff9409936517
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-postgres
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: penpot-postgres
  template:
    metadata:
      labels:
        app: penpot-postgres
    spec:
      containers:
      - name: penpot-postgres
        image: postgres:15@sha256:546445ad21cb5893c0997080b831ee45945e798c4359270e16413c8bd93575db
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_INITDB_ARGS', '--data-checksums')
          value: ''
        - name: ('POSTGRES_DB', 'penpot')
          value: ''
        - name: ('POSTGRES_USER', 'penpot')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'penpot')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          tcpSocket:
            port: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/postgres'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-postgres
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: penpot-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-valkey
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: penpot-valkey
  template:
    metadata:
      labels:
        app: penpot-valkey
    spec:
      containers:
      - name: penpot-valkey
        image: valkey/valkey:8.1.3@sha256:facc1d2c3462975c34e10fccb167bfa92b0e0dbd992fc282c29a61c3243afb11
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - valkey-cli ping | grep PONG
          initialDelaySeconds: 3
          periodSeconds: 1
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-valkey
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: penpot-valkey
  ports:
  - port: 6379
    targetPort: 6379
