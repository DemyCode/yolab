apiVersion: v2
name: emulatorjs
description: "Play your retro game collection in the browser"
home: https://emulatorjs.org
type: application
# Chart version — bump on any packaging change. A backup records this, and a restore
# pins to it, so "which version wrote this data" stops being a guess.
version: 0.1.0

dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "EmulatorJS"
  yolab.io/icon: "🕹️"
  yolab.io/category: "media"
  yolab.io/uischema: |
    {
      "subdomain": {
        "ui:widget": "TunnelWidget"
      }
    }
