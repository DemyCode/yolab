{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: ghcr.io/maybe-finance/maybe:0.6.0@sha256:1e791e88ecc4d124d05142d943bcec5b5a172e889f648c97d334363133384f01
        imagePullPolicy: IfNotPresent
        env:
        - name: ('SELF_HOSTING_ENABLED', 'true')
          value: ''
        - name: ('PORT', 3063)
          value: ''
        - name: ('DATABASE_URL', 'postgresql://maybe:maybe@maybe%5Fdb%5F1:5432/maybe')
          value: ''
        - name: ('RAILS_FORCE_SSL', 'false')
          value: ''
        - name: ('RAILS_ASSUME_SSL', 'false')
          value: ''
        - name: ('POSTGRES_DB', 'maybe')
          value: ''
        - name: ('POSTGRES_USER', 'maybe')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'maybe')
          value: ''
        - name: ('GOOD_JOB_EXECUTION_MODE', 'async')
          value: ''
        - name: ('SECRET_KEY_BASE', '$APP_SEED')
          value: ''
        - name: ('REDIS_URL', 'redis://maybe_redis_1:6379/1')
          value: ''
        ports:
        - containerPort: 3063
        readinessProbe:
          tcpSocket:
            port: 3063
        volumeMounts:
        - name: data
          mountPath: /rails/storage
          subPath: '{{ .Release.Name }}/data/rails'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/maybe-finance/maybe:0.6.0@sha256:1e791e88ecc4d124d05142d943bcec5b5a172e889f648c97d334363133384f01
        imagePullPolicy: IfNotPresent
        args:
        - bundle
        - exec
        - sidekiq
        env:
        - name: ('SELF_HOSTING_ENABLED', 'true')
          value: ''
        - name: ('PORT', 3063)
          value: ''
        - name: ('DATABASE_URL', 'postgresql://maybe:maybe@maybe%5Fdb%5F1:5432/maybe')
          value: ''
        - name: ('RAILS_FORCE_SSL', 'false')
          value: ''
        - name: ('RAILS_ASSUME_SSL', 'false')
          value: ''
        - name: ('POSTGRES_DB', 'maybe')
          value: ''
        - name: ('POSTGRES_USER', 'maybe')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'maybe')
          value: ''
        - name: ('GOOD_JOB_EXECUTION_MODE', 'async')
          value: ''
        - name: ('SECRET_KEY_BASE', '$APP_SEED')
          value: ''
        - name: ('REDIS_URL', 'redis://maybe_redis_1:6379/1')
          value: ''
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:16@sha256:1bf73ccae25238fa555100080042f0b2f9be08eb757e200fe6afc1fc413a1b3c
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_DB', 'maybe')
          value: ''
        - name: ('POSTGRES_USER', 'maybe')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'maybe')
          value: ''
        - name: ('PGDATA', '/var/lib/postgresql/data/pgdata')
          value: ''
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U maybe
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/postgres'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/redis'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
