        - name: DB_SSLMODE
          value: require
        - name: DB_DATABASE
          value: solidtime
        - name: DB_USERNAME
          value: solidtime
        - name: DB_PASSWORD
          value: solidtime
        - name: MAIL_MAILER
          value: smtp
        - name: MAIL_HOST
          value: ''
        - name: MAIL_PORT
          value: ''
        - name: MAIL_ENCRYPTION
          value: tls
        - name: MAIL_FROM_ADDRESS
          value: no-reply@your-domain.com
        - name: MAIL_FROM_NAME
          value: solidtime
        - name: MAIL_USERNAME
          value: ''
        - name: MAIL_PASSWORD
          value: ''
        - name: QUEUE_CONNECTION
          value: database
        - name: FILESYSTEM_DISK
          value: local
        - name: PUBLIC_FILESYSTEM_DISK
          value: public
        - name: GOTENBERG_URL
