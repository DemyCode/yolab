{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: ''
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          [ -e "$D/keys.env" ] || cp /seed/f0 "$D/keys.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: app
        image: solidtime/solidtime:0.21.0@sha256:30ab1ede2a28d782c1cc2f5407bb3e20798d717b3e9acc7a8d734fdc8258cb9e
        imagePullPolicy: IfNotPresent
        env:
        - name: CONTAINER_MODE
          value: http
        - name: AUTO_DB_MIGRATE
          value: 'true'
        - name: APP_NAME
          value: solidtime
        - name: VITE_APP_NAME
          value: solidtime
        - name: APP_ENV
          value: production
        - name: APP_DEBUG
          value: 'false'
        - name: APP_URL
          value: http://localhost:8770
        - name: APP_FORCE_HTTPS
          value: 'false'
        - name: TRUSTED_PROXIES
          value: 0.0.0.0/0,2000:0:0:0:0:0:0:0/3
        - name: TRUSTED_HOSTS
          value: localhost,localhost,localhost,localhost,$(APP_SOLIDTIME_LOCAL_IPS)
        - name: SUPER_ADMINS
          value: umbrel@umbrel.local
        - name: LOG_CHANNEL
          value: stderr_daily
        - name: LOG_LEVEL
          value: debug
        - name: DB_CONNECTION
          value: pgsql
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: '5432'
        - name: DB_SSLMODE
          value: require
        - name: DB_DATABASE
          value: solidtime
        - name: DB_USERNAME
          value: solidtime
        - name: DB_PASSWORD
          value: solidtime
        - name: MAIL_MAILER
          value: smtp
        - name: MAIL_HOST
          value: ''
        - name: MAIL_PORT
          value: ''
        - name: MAIL_ENCRYPTION
          value: tls
        - name: MAIL_FROM_ADDRESS
          value: no-reply@your-domain.com
        - name: MAIL_FROM_NAME
          value: solidtime
        - name: MAIL_USERNAME
          value: ''
        - name: MAIL_PASSWORD
          value: ''
        - name: QUEUE_CONNECTION
          value: database
        - name: FILESYSTEM_DISK
          value: local
        - name: PUBLIC_FILESYSTEM_DISK
          value: public
        - name: GOTENBERG_URL
          value: http://gotenberg:3000
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 8000
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - curl --fail http://localhost:8000/health-check/up || exit 1
        volumeMounts:
        - name: data
          mountPath: /var/www/html/storage
          subPath: '{{ .Release.Name }}/data/app'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
