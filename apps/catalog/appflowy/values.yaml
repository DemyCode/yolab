# `config` is user-facing: exactly what the install form edits, and the subtree
# local-api serves to the UI as its JSON Schema. `yolab` is injected at install
# time by local-api and is not the user's business.
config:
  subdomain: appflowy
  admin_email: admin@example.com
  admin_password: ''
yolab:
  platformApiUrl: ''
  accountToken: ''
  serviceName: ''
  gateway:
    # AppFlowy is four services behind one hostname, so it needs a full Caddyfile
    # rather than a single upstream. The Tera-to-Helm conversion collapsed this to
    # `upstream`, which both dropped the /gotrue, /minio-api, /ws and /api routes and
    # truncated the hostname at the space inside the old `{{ instance_name }}`
    # expression — leaving the gateway proxying everything to a host that does not
    # resolve.
    #
    # Short Service names are enough: Caddy runs in this release's namespace, so
    # `cloud:8000` resolves to the same place the old fully-qualified name did, and
    # unlike the FQDN it needs no templating (values are not re-rendered by Helm).
    caddyfile: |-
      {$YOLAB_FQDN} {
        handle /gotrue/* {
          # gotrue serves its API at the root (/token, /signup, …), so the prefix
          # has to come off before forwarding — upstream's nginx does the same with
          # a trailing-slash proxy_pass. Without this every auth call 404s. gotrue
          # still advertises itself *with* the prefix, via API_EXTERNAL_URL.
          uri strip_prefix /gotrue
          reverse_proxy gotrue:9999
        }
        handle /minio-api/* {
          uri strip_prefix /minio-api
          reverse_proxy minio:9000
        }
        handle /ws/* {
          reverse_proxy cloud:8000
        }
        handle /api/* {
          reverse_proxy cloud:8000
        }
        handle {
          reverse_proxy localhost:3000
        }
      }
