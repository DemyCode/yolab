apiVersion: v2
name: appflowy
description: "Open-source alternative to Notion. Docs, wikis, and projects in one place."
type: application
# Chart version — bump on any packaging change. A backup records this, and a restore
# pins to it, so "which version wrote this data" stops being a guess.
version: 0.1.0

dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"

# YoLab metadata Helm has no field for. Chart.yaml's own `icon` wants a URL, so the
# emoji lives in an annotation alongside the rest.
annotations:
  yolab.io/display-name: "AppFlowy"
  yolab.io/icon: "https://raw.githubusercontent.com/AppFlowy-IO/AppFlowy/main/frontend/resources/flowy_icons/ic_appflowy.png"
  yolab.io/category: "productivity"
  # RJSF layout hints; the form's schema itself is values.schema.json properties.config.
  yolab.io/uischema: |
    {
      "subdomain": {
        "ui:widget": "TunnelWidget"
      },
      "admin_password": {
        "ui:widget": "PasswordWidget"
      }
    }
  # Values scraped from pod logs after install (regex, capture group 1).
  yolab.io/outputs: |
    [{"key": "url", "label": "Web URL", "type": "url", "pattern": "YOLAB_OUTPUT url (\\S+)"}]
