{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "admin_password" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "admin_password"))) | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'APPFLOWY_JWT_SECRET=%s\\n' \"$(tr -dc a-f0-9 </dev/urandom | head -c 64)\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\nchmod 644 \"$SECRETS\"\ncp \"$SECRETS\" /yolab/secrets.env\nif [ -f /state/wg-state.json ]; then\n  FQDN=$(awk -F'\"' '/\"fqdn\"/{print $4; exit}' /state/wg-state.json)\n  [ -n \"$FQDN\" ] && printf 'APPFLOWY_WEB_URL=https://%s\\n' \"$FQDN\" > /state/app-env.sh\nfi\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: app
        image: appflowyinc/appflowy_web:latest@sha256:e71d5d314b9a7972cf6c765460f6dbca6b6183709ec2425dc8cb6d19610c7acb
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        - . /yolab/env && export APPFLOWY_BASE_URL="$YOLAB_URL" && exec node /app/server.js
        volumeMounts:
        - name: yolab
          mountPath: /yolab
        ports:
        - containerPort: 3000
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloud
  template:
    metadata:
      labels:
        app: cloud
    spec:
      initContainers:
      
      - name: prepare-database
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          # Cloud migration 20241126175909 declares a `vector` column, so the
          # extension has to exist before migrations run. Postgres only executes
          # docker-entrypoint-initdb.d on a brand new data directory, which is no
          # help on an existing volume — doing it here is idempotent and works
          # either way.
          until psql "$DATABASE_URL" -c "create extension if not exists vector" 2>/dev/null; do
            echo "waiting for postgres..."
            sleep 3
          done
          until psql "$DATABASE_URL" -tAc \
            "select 1 from information_schema.schemata where schema_name = 'auth'" \
            2>/dev/null | grep -q 1; do
            echo "waiting for gotrue to create the auth schema..."
            sleep 3
          done
          echo "vector extension and auth schema present — migrations can run"
        env:
        - name: DATABASE_URL
          value: postgres://appflowy:appflowy@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/appflowy
      containers:
      - name: cloud
        image: appflowyinc/appflowy_cloud:latest@sha256:2a29e56a611d6e00162226129d5bd16c3e0b36e24eb4cf409db2c8a6fc3a9b08
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        - 'until [ -f /state/secrets.env ]; do sleep 2; done

          . /state/secrets.env

          export APPFLOWY_GOTRUE_JWT_SECRET="$APPFLOWY_JWT_SECRET"

          [ -f /state/app-env.sh ] && . /state/app-env.sh && export APPFLOWY_WEB_URL

          exec appflowy_cloud

          '
        env:
        - name: RUST_LOG
          value: info
        - name: APPFLOWY_DATABASE_URL
          value: postgres://appflowy:appflowy@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/appflowy
        - name: APPFLOWY_REDIS_URI
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: APPFLOWY_GOTRUE_JWT_EXP
          value: '7200'
        - name: APPFLOWY_GOTRUE_BASE_URL
          value: http://gotrue.{{ .Release.Namespace }}.svc.cluster.local:9999
        - name: APPFLOWY_S3_USE_MINIO
          value: 'true'
        - name: APPFLOWY_S3_MINIO_URL
          value: http://minio.{{ .Release.Namespace }}.svc.cluster.local:9000
        - name: APPFLOWY_S3_ACCESS_KEY
          value: minioadmin
        - name: APPFLOWY_S3_SECRET_KEY
          value: minioadmin
        - name: APPFLOWY_S3_BUCKET
          value: appflowy
        - name: APPFLOWY_S3_REGION
          value: us-east-1
        - name: APPFLOWY_ACCESS_CONTROL
          value: 'true'
        - name: APPFLOWY_WEBSOCKET_MAILBOX_SIZE
          value: '6000'
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: cloud
        - name: data
          mountPath: /state
          subPath: yolab-state
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: cloud
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: cloud
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: appflowyinc/appflowy_worker:latest@sha256:06d4f95b5c25e3a070686266fff9345c1897b53ea2ac2b61f2564f1e5f0c715e
        imagePullPolicy: IfNotPresent
        env:
        - name: RUST_LOG
          value: info
        - name: APPFLOWY_WORKER_DATABASE_URL
          value: postgres://appflowy:appflowy@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/appflowy
        - name: APPFLOWY_WORKER_DATABASE_NAME
          value: appflowy
        - name: APPFLOWY_WORKER_REDIS_URL
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: APPFLOWY_S3_USE_MINIO
          value: 'true'
        - name: APPFLOWY_S3_MINIO_URL
          value: http://minio.{{ .Release.Namespace }}.svc.cluster.local:9000
        - name: APPFLOWY_S3_ACCESS_KEY
          value: minioadmin
        - name: APPFLOWY_S3_SECRET_KEY
          value: minioadmin
        - name: APPFLOWY_S3_BUCKET
          value: appflowy
        - name: APPFLOWY_S3_REGION
          value: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotrue
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotrue
  template:
    metadata:
      labels:
        app: gotrue
    spec:
      initContainers:
      
      {{- include "yolab-common.yolabEnvInit" . | nindent 6 }}
      containers:
      - name: gotrue
        image: appflowyinc/gotrue:latest@sha256:93a657d44bc886899a0bd09e693e423c7be232c76315e4467d88bd86095297d5
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /health
            port: 9999
          initialDelaySeconds: 10
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        - |
          until [ -f /state/secrets.env ]; do sleep 2; done
          . /state/secrets.env
          . /yolab/env
          export GOTRUE_JWT_SECRET="$APPFLOWY_JWT_SECRET"
          # gotrue refuses to start without this ("required key API_EXTERNAL_URL
          # missing value"), which is what kept this chart from ever working. The
          # /gotrue prefix matches the Caddy route, and gotrue builds its own
          # advertised endpoints from it, so it has to include the prefix even
          # though Caddy strips it before forwarding.
          export API_EXTERNAL_URL="$YOLAB_URL/gotrue"
          exec /start.sh
        env:
        
        - name: GOTRUE_API_PORT
          value: '9999'
        - name: GOTRUE_SITE_URL
          value: appflowy-flutter://
        - name: URI_ALLOW_LIST
          value: '*'
        - name: GOTRUE_JWT_EXP
          value: '7200'
        - name: GOTRUE_DB_DRIVER
          value: postgres
        
        - name: DATABASE_URL
          value: postgres://appflowy:appflowy@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/appflowy?search_path=auth
        - name: GOTRUE_SMTP_ADMIN_EMAIL
          value: {{ .Values.config.admin_email }}
        - name: GOTRUE_MAILER_AUTOCONFIRM
          value: 'true'
        - name: GOTRUE_ADMIN_EMAIL
          value: {{ .Values.config.admin_email }}
        
        - name: GOTRUE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: admin_password
        - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
          value: 'true'
        - name: GOTRUE_RATE_LIMIT_EMAIL_SENT
          value: '100'
        - name: GOTRUE_LOG_LEVEL
          value: info
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: yolab-state
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.yolabEnvVolumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gotrue
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gotrue
  ports:
  - port: 9999
    targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: cgr.dev/chainguard/minio:latest@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
        command:
        - minio
        - server
        - /data
        - --console-address
        - :9001
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: minio
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - pg_isready
            - -U
            - appflowy
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: POSTGRES_USER
          value: appflowy
        - name: POSTGRES_PASSWORD
          value: appflowy
        - name: POSTGRES_DB
          value: appflowy
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: redis
        image: redis:7.4-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        command:
        - redis-server
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: redis
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
