{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'APPFLOWY_JWT_SECRET=%s\\n' \"$(tr -dc a-f0-9 </dev/urandom | head -c 64)\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\nchmod 644 \"$SECRETS\"\ncp \"$SECRETS\" /yolab/secrets.env\nif [ -f /state/wg-state.json ]; then\n  FQDN=$(awk -F'\"' '/\"fqdn\"/{print $4; exit}' /state/wg-state.json)\n  [ -n \"$FQDN\" ] && printf 'APPFLOWY_WEB_URL=https://%s\\n' \"$FQDN\" > /state/app-env.sh\nfi\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: app
        image: appflowyinc/appflowy_web:latest@sha256:67852883fa09c4494207755a2c73722362d8b831e8894cbb0c7df65de1ed695f
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        command:
        - /bin/sh
        - -c
        - . /yolab/env && export APPFLOWY_BASE_URL="$YOLAB_URL" && exec node /app/server.js
        volumeMounts:
        - name: yolab
          mountPath: /yolab
        ports:
        - containerPort: 3000
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloud
  template:
    metadata:
      labels:
        app: cloud
    spec:
      containers:
      - name: cloud
        image: appflowyinc/appflowy_cloud:latest@sha256:92821ef7b9057c5a0c4878df21ed550be38a389b2cd16ad9ac1a349f352274dd
        imagePullPolicy: IfNotPresent
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        command:
        - /bin/sh
        - -c
        - 'until [ -f /state/secrets.env ]; do sleep 2; done

          . /state/secrets.env

          export APPFLOWY_GOTRUE_JWT_SECRET="$APPFLOWY_JWT_SECRET"

          [ -f /state/app-env.sh ] && . /state/app-env.sh && export APPFLOWY_WEB_URL

          exec appflowy_cloud

          '
        env:
        - name: RUST_LOG
          value: info
        - name: APPFLOWY_DATABASE_URL
          value: postgres://appflowy:appflowy@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/appflowy
        - name: APPFLOWY_REDIS_URI
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: APPFLOWY_GOTRUE_JWT_EXP
          value: '7200'
        - name: APPFLOWY_GOTRUE_BASE_URL
          value: http://gotrue.{{ .Release.Namespace }}.svc.cluster.local:9999
        - name: APPFLOWY_S3_USE_MINIO
          value: 'true'
        - name: APPFLOWY_S3_MINIO_URL
          value: http://minio.{{ .Release.Namespace }}.svc.cluster.local:9000
        - name: APPFLOWY_S3_ACCESS_KEY
          value: minioadmin
        - name: APPFLOWY_S3_SECRET_KEY
          value: minioadmin
        - name: APPFLOWY_S3_BUCKET
          value: appflowy
        - name: APPFLOWY_S3_REGION
          value: us-east-1
        - name: APPFLOWY_ACCESS_CONTROL
          value: 'true'
        - name: APPFLOWY_WEBSOCKET_MAILBOX_SIZE
          value: '6000'
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: {{ .Release.Name }}/cloud
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: cloud
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: cloud
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: appflowyinc/appflowy_worker:latest@sha256:badc04dcd007b3b3f94d2982dc512c5c9a1fb16cdb6f87103cd5a967a05a676a
        imagePullPolicy: IfNotPresent
        env:
        - name: RUST_LOG
          value: info
        - name: APPFLOWY_WORKER_DATABASE_URL
          value: postgres://appflowy:appflowy@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/appflowy
        - name: APPFLOWY_WORKER_DATABASE_NAME
          value: appflowy
        - name: APPFLOWY_WORKER_REDIS_URL
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: APPFLOWY_S3_USE_MINIO
          value: 'true'
        - name: APPFLOWY_S3_MINIO_URL
          value: http://minio.{{ .Release.Namespace }}.svc.cluster.local:9000
        - name: APPFLOWY_S3_ACCESS_KEY
          value: minioadmin
        - name: APPFLOWY_S3_SECRET_KEY
          value: minioadmin
        - name: APPFLOWY_S3_BUCKET
          value: appflowy
        - name: APPFLOWY_S3_REGION
          value: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotrue
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotrue
  template:
    metadata:
      labels:
        app: gotrue
    spec:
      containers:
      - name: gotrue
        image: appflowyinc/gotrue:latest@sha256:87149e0003af9462824548d47f9ecc3e2b5e3c85501f4c8eb37b5efb55abc6a7
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /health
            port: 9999
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9999
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        command:
        - /bin/sh
        - -c
        - 'until [ -f /state/secrets.env ]; do sleep 2; done

          . /state/secrets.env

          export GOTRUE_JWT_SECRET="$APPFLOWY_JWT_SECRET"

          exec /start.sh

          '
        env:
        - name: GOTRUE_SITE_URL
          value: appflowy-flutter://
        - name: URI_ALLOW_LIST
          value: '*'
        - name: GOTRUE_JWT_EXP
          value: '7200'
        - name: GOTRUE_DB_DRIVER
          value: postgres
        - name: DATABASE_URL
          value: postgres://appflowy:appflowy@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/appflowy
        - name: GOTRUE_SMTP_ADMIN_EMAIL
          value: {{ .Values.config.admin_email }}
        - name: GOTRUE_MAILER_AUTOCONFIRM
          value: 'true'
        - name: GOTRUE_ADMIN_EMAIL
          value: {{ .Values.config.admin_email }}
        - name: GOTRUE_ADMIN_PASSWORD
          value: {{ .Values.config.admin_password }}
        - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
          value: 'true'
        - name: GOTRUE_RATE_LIMIT_EMAIL_SENT
          value: '100'
        - name: GOTRUE_LOG_LEVEL
          value: info
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: gotrue
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gotrue
  ports:
  - port: 9999
    targetPort: 9999
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
        command:
        - minio
        - server
        - /data
        - --console-address
        - :9001
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: {{ .Release.Name }}/minio
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        imagePullPolicy: IfNotPresent
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - appflowy
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - appflowy
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        env:
        - name: POSTGRES_USER
          value: appflowy
        - name: POSTGRES_PASSWORD
          value: appflowy
        - name: POSTGRES_DB
          value: appflowy
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: {{ .Release.Name }}/postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        imagePullPolicy: IfNotPresent
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        command:
        - redis-server
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: {{ .Release.Name }}/redis
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
