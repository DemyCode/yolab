apiVersion: v2
name: music
description: Navidrome to listen, Lidarr to find albums, Prowlarr to search and qBittorrent to download, sharing one music space and set up to work together.
type: application
version: 0.2.8

dependencies:
  - name: yolab-stack
    version: "0.1.1"
    repository: "oci://ghcr.io/demycode/charts"
  - name: navidrome
    version: "0.2.7"
    repository: "oci://ghcr.io/demycode/charts"
  - name: qbittorrent
    version: "0.2.7"
    repository: "oci://ghcr.io/demycode/charts"
  - name: prowlarr
    version: "0.2.7"
    repository: "oci://ghcr.io/demycode/charts"
  - name: lidarr
    version: "0.2.8"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "Music"
  yolab.io/icon: "🎧"
  yolab.io/category: "media"
  yolab.io/tagline: "Your own music library on every device"
  yolab.io/collections: "watch-and-listen"
