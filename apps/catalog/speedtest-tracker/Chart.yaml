apiVersion: v2
name: speedtest-tracker
description: "Measures your internet speed on a schedule and keeps the history"
home: https://speedtest-tracker.dev
type: application
version: 0.1.0
dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"
annotations:
  yolab.io/outputs: |
    [
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
  yolab.io/display-name: "Speedtest Tracker"
  yolab.io/icon: "📶"
  yolab.io/category: "monitoring"
  yolab.io/uischema: |
    { "subdomain": { "ui:widget": "TunnelWidget" } }
