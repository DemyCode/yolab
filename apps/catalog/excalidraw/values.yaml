# Everything under `config` is user-facing: it is exactly what the install form
# edits, and its schema (values.schema.json -> properties.config) is what local-api
# serves to the UI. Everything under `yolab` is injected by local-api at install
# time and is not the user's business.

config:
  subdomain: excalidraw
  storage_size: 1Gi
  # Excalidraw ships no authentication at all, so without this the only thing
  # between it and the internet is an unguessable subdomain.
  auth_enabled: false
  # A list of {username, password}. Hashed by an init container before Authelia
  # ever reads them; only the hashes reach the users file.
  auth_users: []

yolab:
  platformApiUrl: ""
  accountToken: ""
  # The tunnel subdomain actually requested — local-api resolves this from whichever
  # config field is marked `format: tunnel` in the schema.
  serviceName: ""
  gateway:
    # Caddy proxies to the app, which runs in its own pod.
    upstream: excalidraw:80
