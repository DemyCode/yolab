{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.config.node }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.config.node | quote }}
      {{- else }}
      {{- end }}
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: setup
        image: python:3.12-alpine@sha256:236173eb74001afe2f60862de935b74fcbd00adfca247b2c27051a70a6a39a2d
        imagePullPolicy: IfNotPresent
        args:
        - python3
        - /app/server.py
        env:
        - name: SETUP_PORT
          value: '7586'
        - name: OTBR_WEB_PORT
          value: '7587'
        - name: OTBR_REST_PORT
          value: '8083'
        ports:
        - containerPort: 7586
        readinessProbe:
          tcpSocket:
            port: 7586
        volumeMounts:
        - name: data
          mountPath: /app/server.py
          subPath: '{{ .Release.Name }}/server.py'
          readOnly: true
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data'
        - name: host-dev
          mountPath: /dev
          readOnly: true
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: host-dev
        hostPath:
          path: /dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: ghcr.io/ownbee/hass-otbr-docker:v0.3.0@sha256:5ca7008462e94d4c937aca8c1c9a60e709d6d300625363c161b946683032d5b1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - "set -uo pipefail\nSETTINGS=/data/settings.env\nload_settings() {\n  CONFIGURED=0;\
          \ DEVICE=\"\"; BAUDRATE=\"\"; FLOW_CONTROL=\"\"; BACKBONE_IF=\"\"\n  FIREWALL=\"\
          \"; NAT64=\"\"; AUTOFLASH_FIRMWARE=\"\"\n  [ -f \"$$SETTINGS\" ] || return\n\
          \  while IFS='=' read -r key val; do\n    case \"$$key\" in\n      DEVICE|BAUDRATE|FLOW_CONTROL|BACKBONE_IF|FIREWALL|NAT64|AUTOFLASH_FIRMWARE|CONFIGURED)\n\
          \        export \"$$key=$$val\" ;;\n    esac\n  done < \"$$SETTINGS\"\n\
          }\necho \"[otbr] waiting for first-run setup to complete (open the app to\
          \ configure)...\"\nwhile true; do\n  load_settings\n  if [ \"$${CONFIGURED:-0}\"\
          \ = \"1\" ] && [ -n \"$${DEVICE:-}\" ] && [ -e \"$${DEVICE:-/nonexistent}\"\
          \ ]; then\n    break\n  fi\n  echo \"[otbr] not configured yet \u2014 retrying\
          \ in 5s\"\n  sleep 5\ndone\necho \"[otbr] configured (DEVICE=$$DEVICE BACKBONE_IF=$${BACKBONE_IF:-})\
          \ \u2014 starting border router\"\n# Record the settings we are launching\
          \ with so the wizard can tell when\n# the live border router matches the\
          \ saved config (vs. a pending restart).\ncat \"$$SETTINGS\" > /data/.applied\
          \ 2>/dev/null || true\nfind / -type f -name app.js -path '*frontend/res/js/*'\
          \ 2>/dev/null \\\n  | xargs -r sed -i \"s/restServerPort = '8081'/restServerPort\
          \ = '$${OTBR_REST_PORT:-8081}'/\"\n# s6-overlay must run as PID 1, so exec\
          \ it. A background watcher restarts\n# the container when settings change:\
          \ it asks s6 to shut down with a\n# non-zero exit code (via s6's container-results\
          \ file), which restart:\n# on-failure then brings back up to re-read the\
          \ new settings. A normal\n# Umbrel stop exits 0, so it is not restarted.\n\
          (\n  ref=\"$$(cat \"$$SETTINGS\" 2>/dev/null)\"\n  while sleep 5; do\n \
          \   if [ \"$$(cat \"$$SETTINGS\" 2>/dev/null)\" != \"$$ref\" ]; then\n \
          \     echo \"[otbr] settings changed \u2014 restarting to apply\"\n    \
          \  echo 1 > /run/s6-linux-init-container-results/exitcode 2>/dev/null ||\
          \ true\n      kill -TERM 1 2>/dev/null || true\n      exit 0\n    fi\n \
          \ done\n) &\nexec /init\n"
        env:
        - name: OTBR_WEB_PORT
          value: '7587'
        - name: OTBR_REST_PORT
          value: '8083'
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data'
        - name: host-dev
          mountPath: /dev
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: host-dev
        hostPath:
          path: /dev
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
