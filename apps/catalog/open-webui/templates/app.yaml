{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 50Gi
{{- $onGpu := include "open-webui.onGpu" . }}
{{- $external := .Values.config.ollama_url | default "" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: ollama-connections
        image: ghcr.io/open-webui/open-webui:main@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -c
        - |
          import json, os, sqlite3
          db = "/app/backend/data/webui.db"
          if os.path.exists(db):
              c = sqlite3.connect(db)
              cols = [r[1] for r in c.execute("PRAGMA table_info(config)")]
              if "key" in cols:
                  c.execute("DELETE FROM config WHERE key IN ('ollama.base_urls', 'ollama.api_configs')")
              elif "data" in cols:
                  for rid, data in c.execute("SELECT id, data FROM config").fetchall():
                      d = json.loads(data)
                      (d.get("ollama") or {}).pop("base_urls", None)
                      (d.get("ollama") or {}).pop("api_configs", None)
                      c.execute("UPDATE config SET data = ? WHERE id = ?", (json.dumps(d), rid))
              c.commit()
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
          subPath: {{ .Release.Name }}/open-webui
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      {{- if and (not $external) (not $onGpu) }}
      - name: ollama
        image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: {{ .Values.config.unload_after | default "5m" | quote }}
        readinessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
          subPath: {{ .Release.Name }}/ollama
      {{- end }}
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        env:
        - name: OLLAMA_BASE_URL
          value: {{ if $external }}{{ $external | quote }}{{ else if $onGpu }}http://ollama:11434{{ else }}http://localhost:11434{{ end }}
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
          subPath: {{ .Release.Name }}/open-webui
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
{{- if and (not $external) $onGpu }}
{{- range (include "open-webui.engines" . | fromJsonArray) }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama-{{ .vendor }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: ollama
      engine: {{ .vendor }}
  template:
    metadata:
      labels:
        app: ollama
        engine: {{ .vendor }}
    spec:
      nodeSelector:
        yolab.io/accelerator: {{ .vendor }}
        {{- if .x86Only }}
        kubernetes.io/arch: amd64
        {{- end }}
      containers:
      - name: ollama
        image: {{ .image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_NOPRUNE
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: {{ $.Values.config.unload_after | default "5m" | quote }}
        readinessProbe:
          tcpSocket:
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            {{ .device }}: "1"
        volumeMounts:
        - name: data
          mountPath: /root/.ollama
          subPath: {{ $.Release.Name }}/ollama
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "yolab-common.gateway.pvcName" $ }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ollama
  ports:
  - name: http
    port: 11434
    targetPort: 11434
{{- end }}
