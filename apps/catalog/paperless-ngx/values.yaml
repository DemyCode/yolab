
config:
  oidc_enabled: false
  subdomain: paperless-ngx
  admin_user: "admin"
  ocr_language: "eng"
  office_documents: true
  admin_password: ""
  app_secret: ""

yolab:
  auth:
    oidc:
      method: client_secret_basic
      scopes: [openid, profile, email]
      redirects:
        - /accounts/oidc/authelia/login/callback/
  platformApiUrl: ""
  accountToken: ""
  serviceName: ""
  gateway:
    upstream: localhost:8000

authelia:
  embedded: true
