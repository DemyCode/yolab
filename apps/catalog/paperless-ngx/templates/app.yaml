{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "authelia.embed.service" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "authelia.oidc.clientInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "admin_password" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "admin_password") "app_secret" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "app_secret"))) | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      - name: paperless-ngx
        image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            . /yolab/env
            export PAPERLESS_URL="$YOLAB_URL"
            {{- if eq (include "authelia.embed.oidc" .) "true" }}
            . /yolab/oidc.env
            export PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
            export PAPERLESS_SOCIAL_AUTO_SIGNUP=true
            export PAPERLESS_SOCIALACCOUNT_PROVIDERS="{\"openid_connect\":{\"OAUTH_PKCE_ENABLED\":true,\"APPS\":[{\"provider_id\":\"authelia\",\"name\":\"${OIDC_PROVIDER_NAME}\",\"client_id\":\"${OIDC_CLIENT_ID}\",\"secret\":\"${OIDC_CLIENT_SECRET}\",\"settings\":{\"server_url\":\"${OIDC_ISSUER}\",\"token_auth_method\":\"client_secret_basic\"}}]}}"
            {{- end }}
            exec /init
        env:
          - name: PAPERLESS_REDIS
            value: "redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          - name: PAPERLESS_DBHOST
            value: "postgres.{{ .Release.Namespace }}.svc.cluster.local"
          - name: PAPERLESS_DBNAME
            value: "paperless"
          - name: PAPERLESS_DBUSER
            value: "paperless"
          - name: PAPERLESS_DBPASS
            value: "paperless"
          - name: PAPERLESS_ADMIN_USER
            value: {{ .Values.config.admin_user | quote }}
          - name: PAPERLESS_OCR_LANGUAGE
            value: {{ .Values.config.ocr_language | quote }}
          - name: PAPERLESS_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: admin_password
          - name: PAPERLESS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: app_secret
          {{- if .Values.config.office_documents }}
          - name: PAPERLESS_TIKA_ENABLED
            value: "1"
          - name: PAPERLESS_TIKA_ENDPOINT
            value: "http://tika.{{ .Release.Namespace }}.svc.cluster.local:9998"
          - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
            value: "http://gotenberg.{{ .Release.Namespace }}.svc.cluster.local:3000"
          {{- end }}
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /usr/src/paperless/data
            subPath: paperless/data
          - name: data
            mountPath: /usr/src/paperless/media
            subPath: paperless/media
          - name: data
            mountPath: /usr/src/paperless/consume
            subPath: paperless/consume
          - name: data
            mountPath: /usr/src/paperless/export
            subPath: paperless/export
          - name: yolab
            mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "paperless"
            - name: POSTGRES_PASSWORD
              value: "paperless"
            - name: POSTGRES_DB
              value: "paperless"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command: ["pg_isready", "-U", "paperless"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: redis
          image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
          imagePullPolicy: IfNotPresent
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: redis
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
{{- if .Values.config.office_documents }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      containers:
        - name: tika
          image: apache/tika:3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
          imagePullPolicy: IfNotPresent
          readinessProbe:
            timeoutSeconds: 5
            tcpSocket:
              port: 9998
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: tika
  ports:
    - port: 9998
      targetPort: 9998
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
          imagePullPolicy: IfNotPresent
          args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command:
                - curl
                - --silent
                - --fail
                - http://localhost:3000/health
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gotenberg
  ports:
    - port: 3000
      targetPort: 3000
{{- end }}
