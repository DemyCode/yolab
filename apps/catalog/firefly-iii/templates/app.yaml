{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_key: {{ required "config.app_key is required" .Values.config.app_key | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        fsGroup: 33
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "app_key" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "app_key"))) | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: firefly-iii
        image: fireflyiii/core:latest@sha256:d51ab6a3a7b91a5c892441578e0da7f2935f84f36bd1151fc3833acc6e060871
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            . /yolab/env
            export APP_URL="$YOLAB_URL"
            exec docker-php-serversideup-entrypoint /init
        env:
          - name: DB_CONNECTION
            value: "pgsql"
          - name: DB_HOST
            value: "postgres.{{ .Release.Namespace }}.svc.cluster.local"
          - name: DB_PORT
            value: "5432"
          - name: DB_DATABASE
            value: "firefly"
          - name: DB_USERNAME
            value: "firefly"
          - name: DB_PASSWORD
            value: "firefly"
          - name: APP_ENV
            value: "production"
          - name: TRUSTED_PROXIES
            value: "**"
          - name: APP_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: app_key
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /var/www/html/storage/upload
            subPath: firefly
          - name: yolab
            mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "firefly"
            - name: POSTGRES_PASSWORD
              value: "firefly"
            - name: POSTGRES_DB
              value: "firefly"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command: ["pg_isready", "-U", "firefly"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-iii
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
