{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: vabene1111/recipes:2.6.15@sha256:2e759dd1478a2ed119ee474e28522079fb1cfa50b3fd25cba89f6b9a67abad72
        imagePullPolicy: IfNotPresent
        env:
        - name: ('SECRET_KEY', '${APP_TANDOOR_SECRET_KEY}')
          value: ''
        - name: ('TZ', 'Etc/UTC')
          value: ''
        - name: ('TANDOOR_PORT', 80)
          value: ''
        - name: ('ALLOWED_HOSTS', '*')
          value: ''
        - name: ('CSRF_TRUSTED_ORIGINS', 'http://${DEVICE_DOMAIN_NAME}:${APP_TANDOOR_PORT},http://${DEVICE_HOSTNAME}:${APP_TANDOOR_PORT},http://*.ts.net:${APP_TANDOOR_PORT},https://*.ts.net:${APP_TANDOOR_PORT},${APP_TANDOOR_LOCAL_URLS}')
          value: ''
        - name: ('ENABLE_SIGNUP', '0')
          value: ''
        - name: ('DB_ENGINE', 'django.db.backends.postgresql')
          value: ''
        - name: ('POSTGRES_HOST', 'tandoor_db_1')
          value: ''
        - name: ('POSTGRES_PORT', 5432)
          value: ''
        - name: ('POSTGRES_DB', 'tandoor')
          value: ''
        - name: ('POSTGRES_USER', 'tandoor')
          value: ''
        - name: ('POSTGRES_PASSWORD', '${APP_TANDOOR_DB_PASSWORD}')
          value: ''
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /opt/recipes/mediafiles
          subPath: '{{ .Release.Name }}/data/mediafiles'
        - name: data
          mountPath: /opt/recipes/staticfiles
          subPath: '{{ .Release.Name }}/data/staticfiles'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_DB', 'tandoor')
          value: ''
        - name: ('POSTGRES_USER', 'tandoor')
          value: ''
        - name: ('POSTGRES_PASSWORD', '${APP_TANDOOR_DB_PASSWORD}')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
          initialDelaySeconds: 45
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/postgres'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
