config:
  subdomain: grist
  auth_enabled: true
  auth_mode: own
  auth_users: []
yolab:
  platformApiUrl: ''
  accountToken: ''
  serviceName: ''
  gateway:
    caddyfile: |
      {$YOLAB_FQDN} {
        handle /authelia/* {
          reverse_proxy localhost:9091
        }
        handle {
          forward_auth localhost:9091 {
            uri /authelia/api/authz/forward-auth
            copy_headers Remote-User Remote-Groups Remote-Email Remote-Name
          }
          handle_path /widgets/* {
            reverse_proxy localhost:8485
          }
          handle {
            reverse_proxy localhost:8484 {
              header_up X-Grist-Email {http.request.header.Remote-User}@yolab.local
            }
          }
        }
      }
authelia:
  embedded: true
