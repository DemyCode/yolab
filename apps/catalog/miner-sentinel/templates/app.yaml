{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:17.7@sha256:2006493727bd5277eece187319af1ef82b4cf82cf4fc1ed00da0775b646ac2a4
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_USER', 'minersentinel')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'minersentinel')
          value: ''
        - name: ('POSTGRES_DB', 'minersentinel')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U minersentinel
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: dcbert/minersentinel-backend:v1.2.0@sha256:d2bb7fd12bf2b06705ead137f56f9101e6bfc761bc9bdce2e5fac83e93e9a49e
        imagePullPolicy: IfNotPresent
        args:
        - /bin/sh
        - -c
        - "sh -c \"\n  python manage.py migrate &&\n  python manage.py collectstatic\
          \ --noinput &&\n  (python manage.py createsuperuser --no-input ||\n  echo\
          \ 'Superuser already exists or created \u2014 winning!') &&\n  gunicorn\
          \ minersentinel.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout\
          \ 120\n\"\n"
        env:
        - name: ('POSTGRES_HOST', 'miner-sentinel_db_1')
          value: ''
        - name: ('POSTGRES_PORT', 5432)
          value: ''
        - name: ('POSTGRES_DB', 'minersentinel')
          value: ''
        - name: ('POSTGRES_USER', 'minersentinel')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'minersentinel')
          value: ''
        - name: ('DJANGO_SECRET_KEY', '${APP_SEED}')
          value: ''
        - name: ('DJANGO_DEBUG', 'False')
          value: ''
        - name: ('ALLOWED_HOSTS', '*')
          value: ''
        - name: ('CORS_ALLOWED_ORIGINS', 'http://${DEVICE_DOMAIN_NAME}:3082,http://*.ts.net:3082')
          value: ''
        - name: ('CSRF_TRUSTED_ORIGINS', 'http://${DEVICE_DOMAIN_NAME}:3082,http://*.ts.net:3082')
          value: ''
        - name: ('DJANGO_SUPERUSER_USERNAME', 'admin')
          value: ''
        - name: ('DJANGO_SUPERUSER_PASSWORD', '$APP_PASSWORD')
          value: ''
        - name: ('DJANGO_SUPERUSER_EMAIL', 'admin@umbrel.local')
          value: ''
        - name: ('API_BASE_URL', 'http://${DEVICE_DOMAIN_NAME}:3082')
          value: ''
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: dcbert/minersentinel-frontend:v1.2.0@sha256:f98ece2ebc2fea9fe9cf0b8363fc1e917783c4185cdb3498bbd6a1c495fed074
        imagePullPolicy: IfNotPresent
        env:
        - name: ('VITE_API_URL', 'http://${DEVICE_DOMAIN_NAME}:3082')
          value: ''
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      containers:
      - name: data-service
        image: dcbert/minersentinel-data-service:v1.2.0@sha256:9fab2cce9d5b0591ca7f14b7b1af078e84cae4edd261d0d4d86d19444e4bf623
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_HOST', 'miner-sentinel_db_1')
          value: ''
        - name: ('POSTGRES_PORT', 5432)
          value: ''
        - name: ('POSTGRES_DB', 'minersentinel')
          value: ''
        - name: ('POSTGRES_USER', 'minersentinel')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'minersentinel')
          value: ''
        - name: ('BACKEND_URL', 'http://miner-sentinel_backend_1:8000')
          value: ''
        - name: ('BITAXE_POLL_INTERVAL', 60)
          value: ''
        - name: ('AVALON_POLL_INTERVAL', 60)
          value: ''
        - name: ('POOL_POLL_INTERVAL', 300)
          value: ''
        - name: ('TELEGRAM_BOT_TOKEN', '')
          value: ''
        - name: ('TELEGRAM_CHAT_ID', '')
          value: ''
        - name: ('DISCORD_WEBHOOK_URL', '')
          value: ''
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
