config:
  subdomain: i2p
  auth_enabled: true
  auth_mode: own
  auth_users: []
  bandwidth_kbps: 512
  share_percent: 80
  memory: 512m
yolab:
  platformApiUrl: ''
  accountToken: ''
  serviceName: ''
  gateway:
    caddyfile: |
      {$YOLAB_FQDN} {
        handle /authelia/* {
          reverse_proxy localhost:9091
        }
        handle {
          forward_auth localhost:9091 {
            uri /authelia/api/authz/forward-auth
            copy_headers Remote-User Remote-Groups Remote-Email Remote-Name
          }
          reverse_proxy localhost:7657
        }
      }
authelia:
  embedded: true
