{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: proxy
        image: reallibrephotos/librephotos-proxy:2026w14@sha256:c88c0a65b50ba7e4f65ccc9aa7d5002df9827cb79edb1f88a3a4c130d0b03be4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/photos'
        - name: data
          mountPath: /protected_media
          subPath: '{{ .Release.Name }}/data/protected_media'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: proxy
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: pgautoupgrade/pgautoupgrade:17-alpine3.22@sha256:2ec008ae5f0a2e5dd8f4d2475df41cf3ccc9562acf49bd668fcc0c061944b9bf
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_USER', 'librephotos')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'librephotos')
          value: ''
        - name: ('POSTGRES_DB', 'librephotos')
          value: ''
        readinessProbe:
          exec:
            command:
            - psql
            - -U
            - librephotos
            - -d
            - librephotos
            - -c
            - SELECT 1;
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: frontend
        image: reallibrephotos/librephotos-frontend:2026w14@sha256:e2fb909607b1d9552c033a9432446eadb6b693289af2b4b016da55d50724afcb
        imagePullPolicy: IfNotPresent
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: backend
        image: reallibrephotos/librephotos:2026w14@sha256:3f4d6fa163bf41f2cd496aca342307fec8b827fe4a7ced1e7773a050ef7a5dca
        imagePullPolicy: IfNotPresent
        env:
        - name: ('SECRET_KEY', '${APP_SEED}')
          value: ''
        - name: ('BACKEND_HOST', 'backend')
          value: ''
        - name: ('ADMIN_EMAIL', 'admin@admin.com')
          value: ''
        - name: ('ADMIN_USERNAME', 'admin')
          value: ''
        - name: ('ADMIN_PASSWORD', '${APP_PASSWORD}')
          value: ''
        - name: ('DB_BACKEND', 'postgresql')
          value: ''
        - name: ('DB_NAME', 'librephotos')
          value: ''
        - name: ('DB_USER', 'librephotos')
          value: ''
        - name: ('DB_PASS', 'librephotos')
          value: ''
        - name: ('DB_HOST', 'librephotos_db_1')
          value: ''
        - name: ('DB_PORT', 5432)
          value: ''
        - name: ('MAPBOX_API_KEY', '')
          value: ''
        - name: ('WEB_CONCURRENCY', 2)
          value: ''
        - name: ('HEAVYWEIGHT_PROCESS', 1)
          value: ''
        - name: ('FIXPERMISSIONS', 'true')
          value: ''
        - name: ('SKIP_PATTERNS', '')
          value: ''
        - name: ('ALLOW_UPLOAD', 'true')
          value: ''
        - name: ('CSRF_TRUSTED_ORIGINS', '')
          value: ''
        - name: ('DEBUG', '0')
          value: ''
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/photos'
        - name: data
          mountPath: /protected_media
          subPath: '{{ .Release.Name }}/data/protected_media'
        - name: data
          mountPath: /logs
          subPath: '{{ .Release.Name }}/data/logs'
        - name: data
          mountPath: /root/.cache
          subPath: '{{ .Release.Name }}/data/cache'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
