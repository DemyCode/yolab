apiVersion: apps/v1
kind: Deployment
metadata:
  name: powersync
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: powersync
  template:
    metadata:
      labels:
        app: powersync
    spec:
      containers:
      - name: powersync
        image: journeyapps/powersync-service:1.26.1@sha256:413a0c813e96935ebe7203b5759f8a594a7b7cd8aa42134713e63af637e0f079
        imagePullPolicy: IfNotPresent
        args:
        - start
        - -r
        - unified
        env:
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: POWERSYNC_CONFIG_PATH
          value: /config/powersync.yaml
        - name: PS_JWKS_URL
          value: http://web:8000/api/v2/powersync-keys
        - name: PS_DATABASE_URI
          value: postgres://wger:wger@db:5432/wger
        - name: PS_STORAGE_PG_URI
          value: postgres://powersync_storage:$(APP_SEED)@db:5432/wger
        - name: PS_PORT
          value: '8080'
        volumeMounts:
        - name: data
          mountPath: /config/powersync.yaml
          subPath: '{{ .Release.Name }}/powersync.yaml'
          readOnly: true
        - name: data
          mountPath: /config/sync_rules.yaml
          subPath: '{{ .Release.Name }}/sync_rules.yaml'
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          mkdir -p "$D/config"

          [ -e "$D/config/prod.env" ] || cp /seed/f1 "$D/config/prod.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine3.22@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command:
            - wget
            - --quiet
            - --tries=1
            - --spider
            - http://127.0.0.1:80/
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: '{{ .Release.Name }}/config/nginx.conf'
          readOnly: true
        - name: data
          mountPath: /wger/static
          subPath: '{{ .Release.Name }}/data/static'
          readOnly: true
        - name: data
          mountPath: /wger/media
          subPath: '{{ .Release.Name }}/data/media'
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          mkdir -p "$D/config"

          [ -e "$D/config/prod.env" ] || cp /seed/f1 "$D/config/prod.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        imagePullPolicy: IfNotPresent
        args:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - shared_buffers=256MB
        - -c
        - effective_cache_size=768MB
        - -c
        - work_mem=8MB
        - -c
        - random_page_cost=1.1
        - -c
        - max_connections=30
        env:
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: POSTGRES_USER
          value: wger
        - name: POSTGRES_PASSWORD
          value: wger
        - name: POSTGRES_DB
          value: wger
        - name: TZ
          value: Europe/Berlin
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U wger
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data/
          subPath: '{{ .Release.Name }}/data/postgres-data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          mkdir -p "$D/config"

          [ -e "$D/config/prod.env" ] || cp /seed/f1 "$D/config/prod.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
