{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
  f1: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          mkdir -p "$D/config"

          [ -e "$D/config/prod.env" ] || cp /seed/f1 "$D/config/prod.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: wger/server:2.7@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: TIME_ZONE
          value: Europe/Berlin
        - name: TZ
          value: Europe/Berlin
        - name: WGER_INSTANCE
          value: https://wger.de
        - name: ALLOW_REGISTRATION
          value: 'True'
        - name: ALLOW_GUEST_USERS
          value: 'True'
        - name: ALLOW_UPLOAD_VIDEOS
          value: 'True'
        - name: MIN_ACCOUNT_AGE_TO_TRUST
          value: '21'
        - name: SYNC_EXERCISES_CELERY
          value: 'True'
        - name: SYNC_EXERCISE_IMAGES_CELERY
          value: 'True'
        - name: SYNC_EXERCISE_VIDEOS_CELERY
          value: 'True'
        - name: SYNC_INGREDIENTS_CELERY
          value: 'True'
        - name: SYNC_INGREDIENTS_DUMP_URL
          value: https://wger.de/media/ingredients/ingredients.jsonl.gz
        - name: DOWNLOAD_INGREDIENTS_FROM
          value: WGER
        - name: CACHE_API_EXERCISES_CELERY
          value: 'True'
        - name: CACHE_API_EXERCISES_CELERY_FORCE_UPDATE
          value: 'True'
        - name: USE_CELERY
          value: 'True'
        - name: CELERY_BROKER
          value: redis://cache:6379/2
        - name: CELERY_BACKEND
          value: redis://cache:6379/2
        - name: CELERY_FLOWER_PASSWORD
          value: adminadmin
        - name: DJANGO_DB_ENGINE
          value: django.db.backends.postgresql
        - name: DJANGO_DB_DATABASE
          value: wger
        - name: DJANGO_DB_USER
          value: wger
        - name: DJANGO_DB_PASSWORD
          value: wger
        - name: DJANGO_DB_HOST
          value: db
        - name: DJANGO_DB_PORT
          value: '5432'
        - name: DJANGO_PERFORM_MIGRATIONS
          value: 'True'
        - name: DJANGO_CACHE_BACKEND
          value: django_redis.cache.RedisCache
        - name: DJANGO_CACHE_LOCATION
          value: redis://cache:6379/1
        - name: DJANGO_CACHE_TIMEOUT
          value: '1296000'
        - name: DJANGO_CACHE_CLIENT_CLASS
          value: django_redis.client.DefaultClient
        - name: AXES_ENABLED
          value: 'True'
        - name: AXES_FAILURE_LIMIT
          value: '10'
        - name: AXES_COOLOFF_TIME
          value: '30'
        - name: AXES_HANDLER
          value: axes.handlers.cache.AxesCacheHandler
        - name: AXES_LOCKOUT_PARAMETERS
          value: ip_address
        - name: AXES_IPWARE_PROXY_COUNT
          value: '1'
        - name: AXES_IPWARE_META_PRECEDENCE_ORDER
          value: HTTP_X_FORWARDED_FOR,REMOTE_ADDR
        - name: DJANGO_DEBUG
          value: 'False'
        - name: WGER_USE_GUNICORN
          value: 'True'
        - name: EXERCISE_CACHE_TTL
          value: '18000'
        - name: ACCESS_TOKEN_LIFETIME
          value: '10'
        - name: REFRESH_TOKEN_LIFETIME
          value: '24'
        - name: AUTH_PROXY_HEADER
          value: ''
        - name: AUTH_PROXY_TRUSTED_IPS
          value: ''
        - name: AUTH_PROXY_CREATE_UNKNOWN_USER
          value: 'False'
        - name: AUTH_PROXY_USER_EMAIL_HEADER
          value: ''
        - name: AUTH_PROXY_USER_NAME_HEADER
          value: ''
        - name: LOG_LEVEL_PYTHON
          value: INFO
        - name: USE_RECAPTCHA
          value: 'False'
        - name: DJANGO_CLEAR_STATIC_FIRST
          value: 'False'
        - name: FROM_EMAIL
          value: wger Workout Manager <wger@example.com>
        - name: NUMBER_OF_PROXIES
          value: '1'
        - name: GUNICORN_CMD_ARGS
          value: --workers 3 --threads 2 --worker-class gthread --timeout 240
        - name: SECRET_KEY
          value: $(APP_SEED)
        - name: CSRF_TRUSTED_ORIGINS
          value: http://localhost:APP_WGER_PORT,http://localhost:APP_WGER_PORT,$(APP_WGER_LOCAL_URLS)
        - name: SITE_URL
          value: http://localhost:APP_WGER_PORT
        - name: MEDIA_URL
          value: http://localhost:APP_WGER_PORT/media/
        - name: PS_DATABASE_URI
          value: postgres://wger:wger@db:5432/wger
        - name: PS_STORAGE_PG_URI
          value: postgres://powersync_storage:$(APP_SEED)@db:5432/wger
        - name: POWERSYNC_URL_PATH
          value: ps
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        readinessProbe:
          exec:
            command:
            - wget
            - --no-verbose
            - --tries=1
            - -O
            - /dev/null
            - http://localhost:8000/api/v2/version/
          initialDelaySeconds: 300
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /home/wger/static
          subPath: '{{ .Release.Name }}/data/static'
        - name: data
          mountPath: /home/wger/media
          subPath: '{{ .Release.Name }}/data/media'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          mkdir -p "$D/config"

          [ -e "$D/config/prod.env" ] || cp /seed/f1 "$D/config/prod.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      nodeSelector:
        kubernetes.io/arch: amd64
---
