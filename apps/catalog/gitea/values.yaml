config:
  oidc_enabled: false
  subdomain: gitea
yolab:
  auth:
    portalSelector:
      app: gitea
    oidc:
      method: client_secret_basic
      scopes: [openid, profile, email, groups]
      redirects:
        - /user/oauth2/authelia/callback
  platformApiUrl: ''
  accountToken: ''
  serviceName: ''
  gateway:
    upstream: localhost:3001

authelia:
  embedded: true
