{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'REGISTRATION_SHARED_SECRET=%s\\n' \"$(tr -dc a-f0-9 </dev/urandom | head -c 64)\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\ncp \"$SECRETS\" /yolab/secrets.env\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: synapse
        image: matrixdotorg/synapse:latest@sha256:1909bcc07d4180945464712a7f4d4bb6f644c4c1774d026d77cdadc196b91eb8
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /_matrix/client/versions
            port: 8008
          initialDelaySeconds: 20
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        args:
        - "set -e\n. /yolab/env\n. /yolab/secrets.env\nSYNAPSE_DATA=/data/synapse\nmkdir -p \"$SYNAPSE_DATA\"\nif [ ! -f \"$SYNAPSE_DATA/homeserver.yaml\" ]; then\n  python -m synapse.app.homeserver \\\n    --server-name \"${YOLAB_HOST:-$YOLAB_FQDN}\" \\\n    --config-path \"$SYNAPSE_DATA/homeserver.yaml\" \\\n    --generate-config \\\n    --report-stats=no\n  sed -i \"s|database:|database:\\n  name: psycopg2\\n  args:\\n    user: synapse\\n    password: synapse\\n    database: synapse\\n    host: postgres.{{ .Release.Namespace }}.svc.cluster.local\\n    cp_min: 5\\n    cp_max: 10\\n#|\" \"$SYNAPSE_DATA/homeserver.yaml\"\n  echo \"registration_shared_secret: $REGISTRATION_SHARED_SECRET\" >> \"$SYNAPSE_DATA/homeserver.yaml\"\n  echo \"suppress_key_server_warning: true\" >> \"$SYNAPSE_DATA/homeserver.yaml\"\n  echo \"public_baseurl: https://${YOLAB_HOST:-$YOLAB_FQDN}/\" >> \"$SYNAPSE_DATA/homeserver.yaml\"\n  echo \"serve_server_wellknown: true\" >> \"$SYNAPSE_DATA/homeserver.yaml\"\nfi\nexec python -m synapse.app.homeserver \\\n  --config-path \"$SYNAPSE_DATA/homeserver.yaml\"\n"
        env:
        - name: SYNAPSE_REPORT_STATS
          value: 'no'
        volumeMounts:
        - name: data
          mountPath: /data
        - name: yolab
          mountPath: /yolab
      - name: element
        image: vectorim/element-web:latest@sha256:b0aa4b5a4fc1afaaff62e2dbd0c92d57e2b20724f3ccb2fef53aae949088c3d2
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        args:
        - ". /yolab/env\ncat > /app/config.json <<EOF\n{\n  \"default_server_config\": {\n    \"m.homeserver\": {\n      \"base_url\": \"https://${YOLAB_HOST:-$YOLAB_FQDN}\",\n      \"server_name\": \"${YOLAB_HOST:-$YOLAB_FQDN}\"\n    }\n  },\n  \"brand\": \"Element\",\n  \"integrations_ui_url\": \"\",\n  \"integrations_rest_url\": \"\",\n  \"integrations_widgets_urls\": [],\n  \"bug_report_endpoint_url\": \"\",\n  \"showLabsSettings\": false\n}\nEOF\nexec nginx -g 'daemon off;'\n"
        volumeMounts:
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - pg_isready
            - -U
            - synapse
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: POSTGRES_USER
          value: synapse
        - name: POSTGRES_PASSWORD
          value: synapse
        - name: POSTGRES_DB
          value: synapse
        - name: POSTGRES_INITDB_ARGS
          value: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
