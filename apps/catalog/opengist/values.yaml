config:
  oidc_enabled: false
  subdomain: opengist
yolab:
  auth:
    oidc:
      method: client_secret_basic
      scopes: [openid, profile, email, groups]
      redirects:
        - /oauth/openid-connect/callback
  platformApiUrl: ''
  accountToken: ''
  serviceName: ''
  gateway:
    upstream: localhost:6157

authelia:
  embedded: true
