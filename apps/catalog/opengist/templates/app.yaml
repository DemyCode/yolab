{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "authelia.embed.service" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "authelia.oidc.clientInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: server
        image: ghcr.io/thomiceli/opengist:1.15.3@sha256:f5dd39cc9409b4006f8b090e5f9ed042cdb736d28a06b4f985c674dacafc94d5
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          . /yolab/env
          if [ -n "${YOLAB_URL:-}" ]; then
            export OG_EXTERNAL_URL="$YOLAB_URL"
          fi
          {{- if eq (include "authelia.embed.oidc" .) "true" }}
          . /yolab/oidc.env
          export OG_OIDC_PROVIDER_NAME="$OIDC_PROVIDER_NAME"
          export OG_OIDC_CLIENT_KEY="$OIDC_CLIENT_ID"
          export OG_OIDC_SECRET="$OIDC_CLIENT_SECRET"
          export OG_OIDC_DISCOVERY_URL="$OIDC_DISCOVERY_URL"
          export OG_OIDC_GROUP_CLAIM_NAME=groups
          {{- end }}
          cd /app/opengist
          exec ./docker/entrypoint.sh
        env:
        - name: OG_SSH_PORT
          value: '2224'
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6157
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 6157
        volumeMounts:
        - name: data
          mountPath: /opengist
          subPath: 'data'
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
