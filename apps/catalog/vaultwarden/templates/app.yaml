{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
      - name: vaultwarden
        image: vaultwarden/server:latest@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: ROCKET_ADDRESS
          value: '::'
        - name: SIGNUPS_ALLOWED
          value: "false"
        - name: INVITATIONS_ALLOWED
          value: "false"
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-admin
              key: admin_password
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: {{ .Release.Name }}/vaultwarden
      - name: invite-admin
        image: {{ include "yolab-common.image.wgRegister" . }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu
          until curl -sf -o /dev/null http://localhost:80/alive; do sleep 2; done
          if [ ! -f /data/yolab-admin-invited ]; then
            code=$(curl -s -o /dev/null -D /tmp/login -w '%{http_code}' --data-urlencode "token=$ADMIN_TOKEN" http://localhost:80/admin)
            if [ "$code" != 200 ]; then
              echo "the admin page refused the admin password: HTTP $code" >&2
              exit 1
            fi
            session=$(sed -n 's/^[Ss]et-[Cc]ookie: VW_ADMIN=\([^;]*\).*/\1/p' /tmp/login | tr -d '\r')
            if [ -z "$session" ]; then
              echo "the admin page opened no session" >&2
              exit 1
            fi
            body=$(jq -n --arg email "$ADMIN_EMAIL" '{email: $email}')
            code=$(curl -s -o /tmp/invite -w '%{http_code}' -H "Cookie: VW_ADMIN=$session" -H 'Content-Type: application/json' -d "$body" http://localhost:80/admin/invite)
            case "$code" in
              200|409) touch /data/yolab-admin-invited ;;
              *)
                echo "inviting $ADMIN_EMAIL failed: HTTP $code $(cat /tmp/invite)" >&2
                exit 1
                ;;
            esac
          fi
          printf 'YOLAB_OUTPUT admin_email %s\nYOLAB_OUTPUT admin_password %s\n' "$ADMIN_EMAIL" "$ADMIN_TOKEN"
          exec sleep infinity
        env:
        - name: ADMIN_EMAIL
          value: {{ required "config.admin_email is required" .Values.config.admin_email | quote }}
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-admin
              key: admin_password
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: {{ .Release.Name }}/vaultwarden
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: vaultwarden
  ports:
  - port: 80
    targetPort: 80
