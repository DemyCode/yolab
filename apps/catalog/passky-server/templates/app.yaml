{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: rabbitcompany/passky-server:8.1.8@sha256:e9bf7b9ecdf4904f1e3893b5968e98cbb61d4984bca1482081df2f59df05fca6
        imagePullPolicy: IfNotPresent
        env:
        - name: ('SERVER_LOCATION', 'US')
          value: ''
        - name: ('SERVER_CORES', 1)
          value: ''
        - name: ('ADMIN_USERNAME', 'admin')
          value: ''
        - name: ('ADMIN_PASSWORD', '${APP_PASSWORD}')
          value: ''
        - name: ('CF_TURNSTILE_SITE_KEY', '1x00000000000000000000AA')
          value: ''
        - name: ('CF_TURNSTILE_SECRET_KEY', '1x0000000000000000000000000000000AA')
          value: ''
        - name: ('DATABASE_ENGINE', 'sqlite')
          value: ''
        - name: ('DATABASE_FILE', 'passky')
          value: ''
        - name: ('MYSQL_HOST', '')
          value: ''
        - name: ('MYSQL_PORT', 3306)
          value: ''
        - name: ('MYSQL_DATABASE', 'passky')
          value: ''
        - name: ('MYSQL_USER', 'passky')
          value: ''
        - name: ('MYSQL_PASSWORD', '')
          value: ''
        - name: ('MYSQL_SSL', 'false')
          value: ''
        - name: ('MYSQL_SSL_CA', '/etc/ssl/certs/ca-certificates.crt')
          value: ''
        - name: ('MYSQL_CACHE_MODE', 0)
          value: ''
        - name: ('REDIS_HOST', '127.0.0.1')
          value: ''
        - name: ('REDIS_PORT', 6379)
          value: ''
        - name: ('REDIS_PASSWORD', '')
          value: ''
        - name: ('REDIS_LOCAL_HOST', '127.0.0.1')
          value: ''
        - name: ('REDIS_LOCAL_PORT', 6379)
          value: ''
        - name: ('REDIS_LOCAL_PASSWORD', '')
          value: ''
        - name: ('MAIL_ENABLED', 'false')
          value: ''
        - name: ('ACCOUNT_MAX', 100)
          value: ''
        - name: ('ACCOUNT_MAX_PASSWORDS', 1000)
          value: ''
        - name: ('ACCOUNT_PREMIUM', -1)
          value: ''
        - name: ('YUBI_CLOUD', 'https://api.yubico.com/wsapi/2.0/verify')
          value: ''
        - name: ('YUBI_ID', 67857)
          value: ''
        - name: ('LIMITER_ENABLED', 'true')
          value: ''
        - name: ('LIMITER_GET_INFO', -1)
          value: ''
        - name: ('LIMITER_GET_STATS', -1)
          value: ''
        - name: ('LIMITER_GET_TOKEN', 3)
          value: ''
        - name: ('LIMITER_GET_PASSWORDS', 2)
          value: ''
        - name: ('LIMITER_SAVE_PASSWORD', 2)
          value: ''
        - name: ('LIMITER_EDIT_PASSWORD', 2)
          value: ''
        - name: ('LIMITER_DELETE_PASSWORD', 2)
          value: ''
        - name: ('LIMITER_DELETE_PASSWORDS', 10)
          value: ''
        - name: ('LIMITER_CREATE_ACCOUNT', 10)
          value: ''
        - name: ('LIMITER_DELETE_ACCOUNT', 10)
          value: ''
        - name: ('LIMITER_IMPORT_PASSWORDS', 10)
          value: ''
        - name: ('LIMITER_FORGOT_USERNAME', 60)
          value: ''
        - name: ('LIMITER_ENABLE_2FA', 10)
          value: ''
        - name: ('LIMITER_DISABLE_2FA', 10)
          value: ''
        - name: ('LIMITER_ADD_YUBIKEY', 10)
          value: ''
        - name: ('LIMITER_REMOVE_YUBIKEY', 10)
          value: ''
        - name: ('LIMITER_UPGRADE_ACCOUNT', 10)
          value: ''
        - name: ('LIMITER_GET_REPORT', -1)
          value: ''
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/www/html/databases
          subPath: '{{ .Release.Name }}/data/passky'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: server
  ports:
  - port: 80
    targetPort: 80
