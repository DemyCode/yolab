{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: ghcr.io/activepieces/activepieces:0.92.1@sha256:d22e3f36f78d70264a020d309aa4535c161ba9ee25eeb783759cde3308cd803a
        imagePullPolicy: IfNotPresent
        env:
        - name: ('AP_ENGINE_EXECUTABLE_PATH', 'dist/packages/engine/main.js')
          value: ''
        - name: ('AP_API_KEY', '${APP_PASSWORD}')
          value: ''
        - name: ('AP_ENCRYPTION_KEY', '${APP_AP_ENCRYPTION_KEY}')
          value: ''
        - name: ('AP_JWT_SECRET', '${APP_PASSWORD}')
          value: ''
        - name: ('AP_ENVIRONMENT', 'prod')
          value: ''
        - name: ('AP_FRONTEND_URL', 'http://${DEVICE_DOMAIN_NAME}:8146')
          value: ''
        - name: ('AP_WEBHOOK_TIMEOUT_SECONDS', 30)
          value: ''
        - name: ('AP_TRIGGER_DEFAULT_POLL_INTERVAL', 5)
          value: ''
        - name: ('AP_POSTGRES_DATABASE', 'activepieces')
          value: ''
        - name: ('AP_POSTGRES_HOST', 'activepieces_db_1')
          value: ''
        - name: ('AP_POSTGRES_PORT', 5432)
          value: ''
        - name: ('AP_POSTGRES_USERNAME', 'activepieces')
          value: ''
        - name: ('AP_POSTGRES_PASSWORD', 'activepieces')
          value: ''
        - name: ('AP_EXECUTION_MODE', 'UNSANDBOXED')
          value: ''
        - name: ('AP_REDIS_HOST', 'activepieces_redis_1')
          value: ''
        - name: ('AP_REDIS_PORT', 6379)
          value: ''
        - name: ('AP_FLOW_TIMEOUT_SECONDS', 600)
          value: ''
        - name: ('AP_TELEMETRY_ENABLED', 'true')
          value: ''
        - name: ('AP_TEMPLATES_SOURCE_URL', 'https://cloud.activepieces.com/api/v1/flow-templates')
          value: ''
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /usr/src/app/cache
          subPath: '{{ .Release.Name }}/data/app/cache'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:17.4@sha256:4aed4b0525233308fc5de1b8d47f92326460d598dc5f004d14b41f183360b4e9
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POSTGRES_DB', 'activepieces')
          value: ''
        - name: ('POSTGRES_PASSWORD', 'activepieces')
          value: ''
        - name: ('POSTGRES_USER', 'activepieces')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U activepieces
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.3@sha256:ee8ec723c831b815c3e2f2c6fbd1c145c68d1c04ba284f044ec1434fbca0fee8
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/redis'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
