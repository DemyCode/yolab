apiVersion: v2
name: syncthing
description: "Continuous file synchronization between your devices"
home: https://syncthing.net
type: application
# Chart version — bump on any packaging change. A backup records this, and a restore
# pins to it, so "which version wrote this data" stops being a guess.
version: 0.1.0

dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"

# YoLab metadata Helm has no field for. Chart.yaml's own `icon` wants a URL, so the
# emoji lives in an annotation alongside the rest.
annotations:
  yolab.io/display-name: "Syncthing"
  yolab.io/icon: "🔄"
  yolab.io/category: "utilities"
  # RJSF layout hints; the form's schema itself is values.schema.json properties.config.
  yolab.io/uischema: |
    {"subdomain": {"ui:autofocus": true}, "storage_size": {"ui:widget": "select"}}
  # Values scraped from pod logs after install (regex, capture group 1).
  yolab.io/outputs: |
    [
      { "key": "url", "label": "Web UI", "type": "url", "pattern": "YOLAB_OUTPUT url (\\S+)" },
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
