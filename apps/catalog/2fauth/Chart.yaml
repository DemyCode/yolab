apiVersion: v2
name: 2fauth
description: "Web app for managing two-factor authentication codes"
home: https://docs.2fauth.app
type: application
version: 0.1.1

dependencies:
  - name: yolab-common
    version: "0.1.1"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "2FAuth"
  yolab.io/icon: "🔑"
  yolab.io/category: "security"
  yolab.io/uischema: |
    {"subdomain": {"ui:autofocus": true}}
  yolab.io/outputs: |
    [
      { "key": "url", "label": "Web URL", "type": "url", "pattern": "YOLAB_OUTPUT url (\\S+)" },
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
