{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'APP_KEY=base64:%s\\n' \"$(dd if=/dev/urandom bs=24 count=1 2>/dev/null | base64 | tr -d '\\n')\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\ncp \"$SECRETS\" /yolab/secrets.env\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: 2fauth
        image: 2fauth/2fauth:latest@sha256:9cd2d70937980c77d34f03b2f57a2b8f626adeb8f35b6b5c8ecc0525c073ae57
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: APP_ENV
          value: production
        - name: DB_CONNECTION
          value: pgsql
        - name: DB_HOST
          value: postgres.{{ .Release.Namespace }}.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_DATABASE
          value: 2fauth
        - name: DB_USERNAME
          value: 2fauth
        - name: DB_PASSWORD
          value: 2fauth
        - name: CACHE_DRIVER
          value: file
        - name: SESSION_DRIVER
          value: file
        command:
        - /bin/sh
        - -c
        - '. /yolab/env

          . /yolab/secrets.env

          export APP_URL="https://$YOLAB_FQDN"

          exec /entrypoint.sh

          '
        volumeMounts:
        - name: data
          mountPath: /2fauth
          subPath: 2fauth
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - pg_isready
            - -U
            - 2fauth
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: POSTGRES_USER
          value: 2fauth
        - name: POSTGRES_PASSWORD
          value: 2fauth
        - name: POSTGRES_DB
          value: 2fauth
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
