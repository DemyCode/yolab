{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'APP_KEY=base64:%s\\n' \"$(dd if=/dev/urandom bs=24 count=1 2>/dev/null | base64 | tr -d '\\n')\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\ncp \"$SECRETS\" /yolab/secrets.env\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: 2fauth
        image: 2fauth/2fauth:latest@sha256:4a1f329e42b9bdfb625db3094bd6f79a2f44640b6259d4cdb9f336c676bf120e
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        env:
        - name: APP_ENV
          value: production
        - name: DB_CONNECTION
          value: pgsql
        - name: DB_HOST
          value: postgres.{{ .Release.Namespace }}.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_DATABASE
          value: 2fauth
        - name: DB_USERNAME
          value: 2fauth
        - name: DB_PASSWORD
          value: 2fauth
        - name: CACHE_DRIVER
          value: file
        - name: SESSION_DRIVER
          value: file
        command:
        - /bin/sh
        - -c
        - '. /yolab/env

          . /yolab/secrets.env

          export APP_URL="https://$YOLAB_FQDN"

          exec /entrypoint.sh

          '
        volumeMounts:
        - name: data
          mountPath: /2fauth
          subPath: {{ .Release.Name }}/2fauth
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        imagePullPolicy: IfNotPresent
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - 2fauth
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - 2fauth
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        env:
        - name: POSTGRES_USER
          value: 2fauth
        - name: POSTGRES_PASSWORD
          value: 2fauth
        - name: POSTGRES_DB
          value: 2fauth
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: {{ .Release.Name }}/postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
