{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memos-config
  namespace: {{ .Release.Namespace }}
data:
  signup.json: |
{{ include "memos.signup" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      annotations:
        checksum/memos-config: {{ include "memos.signup" . | sha256sum }}
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: memos
        image: ghcr.io/usememos/memos:stable@sha256:5dcd6e6b973a55b964f2fe2ccdaa33319463ab448a23404ebb5d2acbd19299ba
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 5230
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /var/opt/memos
            subPath: memos
          - name: memos-config
            mountPath: /etc/memos/config
            readOnly: true
      volumes:
      - name: memos-config
        configMap:
          name: memos-config
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
