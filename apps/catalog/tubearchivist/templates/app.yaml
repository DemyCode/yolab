{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: server
        image: bbilly1/tubearchivist:v0.5.12@sha256:ba1c846ddd0c6fdd0f040727129d2466e03b7a0c26499223839d450c7586ac09
        imagePullPolicy: IfNotPresent
        env:
        - name: ('ES_URL', 'http://tubearchivist_elasticsearch_1:9200')
          value: ''
        - name: ('REDIS_CON', 'redis://tubearchivist_redis_1:6379')
          value: ''
        - name: ('HOST_UID', '1000')
          value: ''
        - name: ('HOST_GID', '1000')
          value: ''
        - name: ('TA_HOST', 'http://${DEVICE_DOMAIN_NAME}:8079')
          value: ''
        - name: ('TA_USERNAME', 'admin')
          value: ''
        - name: ('TA_PASSWORD', '${APP_PASSWORD}')
          value: ''
        - name: ('ELASTIC_PASSWORD', 'verysecret')
          value: ''
        - name: ('TZ', 'UTC')
          value: ''
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
        volumeMounts:
        - name: data
          mountPath: /youtube
          subPath: '{{ .Release.Name }}/data/media'
        - name: data
          mountPath: /cache
          subPath: '{{ .Release.Name }}/data/cache'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: redis
        image: redis:8.2.2-bookworm@sha256:4521b581dbddea6e7d81f8fe95ede93f5648aaa66a9dacd581611bf6fe7527bd
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/redis'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: elasticsearch:8.19.6@sha256:e2d7e20893ad820bcad241bf47b89958787f6b38225478dfe100b66937840b0f
        imagePullPolicy: IfNotPresent
        env:
        - name: ('ELASTIC_PASSWORD', 'verysecret')
          value: ''
        - name: ('ES_JAVA_OPTS', '-Xms1g -Xmx1g')
          value: ''
        - name: ('xpack.security.enabled', 'true')
          value: ''
        - name: ('discovery.type', 'single-node')
          value: ''
        - name: ('path.repo', '/usr/share/elasticsearch/data/snapshot')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 9200
        readinessProbe:
          tcpSocket:
            port: 9200
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
          subPath: '{{ .Release.Name }}/data/elasticsearch'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: elasticsearch
  ports:
  - port: 9200
    targetPort: 9200
