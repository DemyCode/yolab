{{- if not .Values.embedded }}
{{- $config := .Values.config | default dict }}
{{- $policy := $config.policy | default "one_factor" }}
{{- if not (has $policy (list "one_factor" "two_factor")) }}
{{- fail (printf "config.policy is %q, not one_factor or two_factor" $policy) }}
{{- end }}
{{- $password := required "config.admin_password is required: it signs in to the users page and to every service" $config.admin_password }}
{{- range $config.rules | default list }}
{{- if not (regexMatch "^[a-z0-9*][a-z0-9*.-]*$" (.subdomain | default "")) }}
{{- fail (printf "config.rules: %q is not an address: lowercase letters, digits, dots, dashes and *" (.subdomain | default "")) }}
{{- end }}
{{- if not (has (.policy | default "one_factor") (list "one_factor" "two_factor" "deny")) }}
{{- fail (printf "config.rules: %s has policy %q, not one_factor, two_factor or deny" .subdomain .policy) }}
{{- end }}
{{- range .groups | default list }}
{{- if not (regexMatch "^[A-Za-z0-9_.-]+$" .) }}
{{- fail (printf "config.rules: group %q may only hold letters, digits, dots, dashes and underscores" .) }}
{{- end }}
{{- end }}
{{- end }}
{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-authelia
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_password: {{ $password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        yolab.io/access: {{ toJson (list $policy $config.rules $password) | sha256sum | trunc 16 | quote }}
        yolab.io/registrar: {{ .Files.Get "files/register.cgi" | sha256sum | trunc 16 | quote }}
    spec:
      enableServiceLinks: false
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      - name: authelia-config
        image: {{ include "authelia.image" . }}
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            . /yolab/env
            if [ -z "${YOLAB_FQDN:-}" ] || [ -z "${USERS_FQDN:-}" ]; then
              echo "no YOLAB_FQDN or USERS_FQDN: refusing to configure Authelia against a blank host" >&2
              exit 1
            fi
            mkdir -p /data/secrets
            for s in jwt session storage lldap-jwt lldap-key-seed oidc-hmac registrar-key; do
              if [ ! -s "/data/secrets/$s" ]; then
                tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 64 > "/data/secrets/$s.new"
                mv "/data/secrets/$s.new" "/data/secrets/$s"
              fi
            done
            if [ ! -s /data/secrets/oidc/private.pem ]; then
              rm -rf /data/secrets/oidc.new
              mkdir -p /data/secrets/oidc.new
              authelia crypto pair rsa generate --bits 2048 --directory /data/secrets/oidc.new
              rm -rf /data/secrets/oidc
              mv /data/secrets/oidc.new /data/secrets/oidc
            fi
            mkdir -p /data/clients
            JWT=$(cat /data/secrets/jwt)
            SESSION=$(cat /data/secrets/session)
            STORAGE=$(cat /data/secrets/storage)
            COOKIE_DOMAIN="${YOLAB_FQDN#*.}"
            cat > /authelia-config/base.yml <<EOF
            theme: auto
            server:
              address: 'tcp://:9091/'
            log:
              level: info
            authentication_backend:
              password_reset:
                disable: true
              ldap:
                implementation: lldap
                address: 'ldap://127.0.0.1:3890'
                base_dn: 'dc=yolab,dc=local'
                user: 'uid=admin,ou=people,dc=yolab,dc=local'
            access_control:
              default_policy: deny
              rules:
                - domain: '${USERS_FQDN}'
                  subject: 'group:lldap_admin'
                  policy: {{ $policy }}
                - domain: '${USERS_FQDN}'
                  policy: deny
            {{- range $config.rules | default list }}
            {{- $domain := ternary .subdomain (printf "%s.${COOKIE_DOMAIN}" .subdomain) (contains "." .subdomain) }}
            {{- $groups := .groups | default list }}
            {{- if $groups }}
                - domain: '{{ $domain }}'
                  subject:
                  {{- range $groups }}
                    - 'group:{{ . }}'
                  {{- end }}
                  policy: {{ .policy | default "one_factor" }}
                - domain: '{{ $domain }}'
                  policy: deny
            {{- else }}
                - domain: '{{ $domain }}'
                  policy: {{ .policy | default "one_factor" }}
            {{- end }}
            {{- end }}
                - domain: '*.${COOKIE_DOMAIN}'
                  policy: {{ $policy }}
            session:
              name: {{ include "authelia.cookieName" . }}
              secret: '${SESSION}'
              cookies:
                - domain: '${COOKIE_DOMAIN}'
                  authelia_url: 'https://${YOLAB_FQDN}'
              redis:
                host: 127.0.0.1
                port: 6379
            regulation:
              max_retries: 5
              find_time: 2m
              ban_time: 10m
            storage:
              encryption_key: '${STORAGE}'
              local:
                path: /data/db.sqlite3
            notifier:
              filesystem:
                filename: /data/notification.txt
            identity_validation:
              reset_password:
                jwt_secret: '${JWT}'
            totp:
              issuer: '${YOLAB_FQDN}'
            webauthn:
              display_name: '${YOLAB_FQDN}'
            EOF
            echo "configured Authelia for every service under ${COOKIE_DOMAIN}"
        volumeMounts:
          - name: yolab
            mountPath: /yolab
          - name: authelia-config
            mountPath: /authelia-config
          - name: data
            mountPath: /data
            subPath: authelia
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: lldap
        image: {{ include "authelia.image.lldap" . }}
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            . /yolab/env
            export LLDAP_HTTP_URL="https://$USERS_FQDN"
            LLDAP_KEY_SEED=$(cat /state/lldap-key-seed)
            export LLDAP_KEY_SEED
            exec /docker-entrypoint.sh run --config-file /data/lldap_config.toml
        env:
          - name: LLDAP_LDAP_HOST
            value: 127.0.0.1
          - name: LLDAP_HTTP_HOST
            value: 127.0.0.1
          - name: LLDAP_LDAP_BASE_DN
            value: dc=yolab,dc=local
          - name: LLDAP_LDAP_USER_DN
            value: admin
          - name: LLDAP_LDAP_USER_PASS_FILE
            value: /secret/admin_password
          - name: LLDAP_FORCE_LDAP_USER_PASS_RESET
            value: always
          - name: LLDAP_JWT_SECRET_FILE
            value: /state/lldap-jwt
          - name: LLDAP_DATABASE_URL
            value: sqlite:///data/users.db?mode=rwc
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
              - nc
              - -z
              - 127.0.0.1
              - "3890"
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
          - name: yolab
            mountPath: /yolab
          - name: data
            mountPath: /data
            subPath: lldap
          - name: data
            mountPath: /state
            subPath: authelia/secrets
            readOnly: true
          - name: admin
            mountPath: /secret
            readOnly: true
      - name: authelia
        image: {{ include "authelia.image" . }}
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            until nc -w 2 127.0.0.1 3890 </dev/null; do
              echo "waiting for the user directory on 127.0.0.1:3890"
              sleep 2
            done
            {{- include "authelia.oidc.provider" . | nindent 12 }}
            clients() {
              cat /data/clients/*.yml 2>/dev/null | md5sum | cut -d' ' -f1
            }
            compose() {
              {
                cat /authelia-config/base.yml
                if ls /data/clients/*.yml >/dev/null 2>&1; then
                  oidc_provider /data/secrets
                  cat /data/clients/*.yml
                fi
              } > /tmp/configuration.yml.new
              mv /tmp/configuration.yml.new /tmp/configuration.yml
            }
            while true; do
              now=$(clients)
              compose
              authelia --config /tmp/configuration.yml &
              pid=$!
              until wget -q -O /dev/null http://127.0.0.1:9091/api/health; do
                if ! kill -0 "$pid" 2>/dev/null; then
                  wait "$pid" && rc=0 || rc=$?
                  echo "Authelia stopped before it was healthy (exit $rc)" >&2
                  exit 1
                fi
                sleep 1
              done
              echo "$now" > /data/clients.live
              while kill -0 "$pid" 2>/dev/null && [ "$(clients)" = "$now" ]; do
                sleep 2
              done
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" && rc=0 || rc=$?
                echo "Authelia exited on its own (exit $rc)" >&2
                exit 1
              fi
              echo "the OpenID services changed: restarting Authelia with them"
              kill "$pid"
              wait "$pid" && rc=0 || rc=$?
              echo "Authelia stopped (exit $rc)"
            done
        env:
          - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
            value: /secret/admin_password
        ports:
          - containerPort: 9091
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /api/health
            port: 9091
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: authelia-config
            mountPath: /authelia-config
          - name: data
            mountPath: /data
            subPath: authelia
          - name: admin
            mountPath: /secret
            readOnly: true
      - name: codes
        image: {{ include "authelia.image" . }}
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            . /yolab/env
            echo "YOLAB_OUTPUT url https://$YOLAB_FQDN"
            echo "YOLAB_OUTPUT users_url https://$USERS_FQDN"
            echo "YOLAB_OUTPUT internal_url http://$(cat /data/secrets/registrar-key)@authelia.{{ .Release.Namespace }}.svc.cluster.local:9091"
            echo "YOLAB_OUTPUT admin_username admin"
            echo "YOLAB_OUTPUT admin_password $(cat /secret/admin_password)"
            echo "YOLAB_OUTPUT confirmation_code NONE"
            seen=""
            while true; do
              if [ -s /data/notification.txt ]; then
                now=$(md5sum /data/notification.txt | cut -d' ' -f1)
                if [ "$now" != "$seen" ]; then
                  seen="$now"
                  code=$(awk '/ONE-TIME CODE/ { otc = 1 } /^Hi .*,[ \t\r]*$/ && !who { who = substr($0, 4); sub(/,[ \t\r]*$/, "", who) } otc && after && code == "" { line = $0; gsub(/^[ \t\r]+|[ \t\r]+$/, "", line); if (line != "") code = line; next } otc && /^-----+[ \t\r]*$/ { after = 1 } END { if (code != "") print code " for " who }' /data/notification.txt)
                  if [ -n "$code" ]; then
                    echo "YOLAB_OUTPUT confirmation_code $code (asked $(date -u +'%Y-%m-%d %H:%M') UTC)"
                  fi
                fi
              fi
              sleep 3
            done
        volumeMounts:
          - name: yolab
            mountPath: /yolab
          - name: data
            mountPath: /data
            subPath: authelia
            readOnly: true
          - name: admin
            mountPath: /secret
            readOnly: true
      - name: sessions
        image: {{ include "authelia.image.redis" . }}
        imagePullPolicy: IfNotPresent
        args: ["--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no"]
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command: ["redis-cli", "-h", "127.0.0.1", "ping"]
          initialDelaySeconds: 3
          periodSeconds: 10
      - name: registrar
        image: {{ include "authelia.image.busybox" . }}
        imagePullPolicy: IfNotPresent
        env:
          - name: POLICY
            value: {{ $policy | quote }}
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            . /yolab/env
            mkdir -p /run/registrar
            {
              printf 'PARENT=%s\n' "${YOLAB_FQDN#*.}"
              printf 'ISSUER=https://%s\n' "$YOLAB_FQDN"
              printf 'POLICY=%s\n' "$POLICY"
            } > /run/registrar/env
            echo "services under ${YOLAB_FQDN#*.} can sign up for OpenID on :9092"
            exec httpd -f -v -p 9092 -h /www
        ports:
          - containerPort: 9092
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 9092
          periodSeconds: 10
        volumeMounts:
          - name: yolab
            mountPath: /yolab
          - name: registrar
            mountPath: /www/cgi-bin
            readOnly: true
          - name: data
            mountPath: /state
            subPath: authelia
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      - name: authelia-config
        emptyDir: {}
      - name: admin
        secret:
          secretName: {{ .Release.Name }}-authelia
      - name: registrar
        configMap:
          name: {{ .Release.Name }}-registrar
          defaultMode: 0555
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-registrar
  namespace: {{ .Release.Namespace }}
data:
  register: |
{{ .Files.Get "files/register.cgi" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gateway
  ports:
    - name: authelia
      port: 9091
      targetPort: 9091
    - name: https
      port: 443
      targetPort: 443
    - name: registrar
      port: 9092
      targetPort: 9092
{{- end }}
