{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallos
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wallos
  template:
    metadata:
      labels:
        app: wallos
    spec:
      containers:
      - name: wallos
        image: ghcr.io/ellite/wallos:latest@sha256:de82c41215a761d33a38a3672526b3ce47d0fe7acb84f5c2a4cb2342c710cf4c
        imagePullPolicy: IfNotPresent
        env:
          - name: TZ
            value: Etc/UTC
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /var/www/html/db
            subPath: wallos/db
          - name: data
            mountPath: /var/www/html/images/uploads/logos
            subPath: wallos/logos
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: wallos
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: wallos
  ports:
    - port: 80
      targetPort: 80
