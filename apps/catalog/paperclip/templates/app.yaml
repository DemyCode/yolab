{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: server
        image: ghcr.io/paperclipai/paperclip:2026.1001.0@sha256:08dbadebd4d40550eb336c25c3691f582322a88bae3f1cca101c5dd096bdc9d3
        imagePullPolicy: IfNotPresent
        env:
        - name: ('HOST', '0.0.0.0')
          value: ''
        - name: ('PAPERCLIP_HOME', '/paperclip')
          value: ''
        - name: ('PAPERCLIP_PUBLIC_URL', 'http://${DEVICE_DOMAIN_NAME}:8860')
          value: ''
        - name: ('PAPERCLIP_API_URL', 'http://127.0.0.1:3100')
          value: ''
        - name: ('PAPERCLIP_ALLOWED_HOSTNAMES', '${DEVICE_DOMAIN_NAME},${DEVICE_DOMAIN_NAME}:8860,${DEVICE_HOSTNAME},${DEVICE_HOSTNAME}:8860,${APP_DOMAIN},${APP_DOMAIN}:8860,${APP_HIDDEN_SERVICE},${APP_PAPERCLIP_LOCAL_IPS},paperclip_server_1')
          value: ''
        - name: ('BETTER_AUTH_SECRET', '${APP_SEED}')
          value: ''
        - name: ('PAPERCLIP_DEPLOYMENT_MODE', 'authenticated')
          value: ''
        - name: ('PAPERCLIP_DEPLOYMENT_EXPOSURE', 'private')
          value: ''
        - name: ('PAPERCLIP_TELEMETRY_DISABLED', '1')
          value: ''
        - name: ('DO_NOT_TRACK', '1')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3100
        readinessProbe:
          tcpSocket:
            port: 3100
        volumeMounts:
        - name: data
          mountPath: /paperclip
          subPath: '{{ .Release.Name }}/data'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
