{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  gateway_token: {{ required "config.gateway_token is required" .Values.config.gateway_token | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      - name: fix-perms
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "chown -R 1000:1000 /home/node"]
        volumeMounts:
          - name: data
            mountPath: /home/node
            subPath: "openclaw"
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      - name: openclaw
        image: ghcr.io/openclaw/openclaw:latest@sha256:55294524dac01370288fb4beb16714b60f75cec0e96e07e662054cf29900965a
        imagePullPolicy: IfNotPresent
        env:
          # This chart never grants any Kubernetes permission beyond the pod's
          # own namespace, same as every other app here — OpenClaw's own
          # sandbox flag is on top of that, not instead of it.
          - name: OPENCLAW_SANDBOX
            value: "1"
          - name: OPENCLAW_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: gateway_token
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 18789
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /home/node
            subPath: "openclaw"
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
