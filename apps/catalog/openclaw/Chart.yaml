apiVersion: v2
name: openclaw
description: "Personal AI assistant that connects to WhatsApp, Telegram, Discord, and more"
type: application
version: 0.1.0
appVersion: "latest"

dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "OpenClaw"
  yolab.io/icon: "🦞"
  yolab.io/category: "personal"
  yolab.io/uischema: |
    {
      "subdomain": {
        "ui:widget": "TunnelWidget"
      }
    }
  yolab.io/outputs: |
    [
      {
        "key": "url",
        "label": "Web URL",
        "type": "url",
        "pattern": "YOLAB_OUTPUT url (\\S+)"
      }
    ]
