{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: ghcr.io/getumbrel/hermes-agent-umbrel:v2026.9.24@sha256:1cc27c346ccefe75c0cd52f281a231a47f864cab1c2cc26271ad8b8ad9531ad0
        imagePullPolicy: IfNotPresent
        args:
        - gateway
        - run
        env:
        - name: ('HERMES_UID', '1000')
          value: ''
        - name: ('HERMES_GID', '1000')
          value: ''
        - name: ('HERMES_DASHBOARD', '1')
          value: ''
        - name: ('HERMES_DASHBOARD_PORT', '18789')
          value: ''
        - name: ('HERMES_UMBREL_APP_PROXY_AUTH', '1')
          value: ''
        - name: ('HERMES_TUI_DIR', '/app/umbrel-tui')
          value: ''
        - name: ('HERMES_UPSTREAM_TUI_ENTRY', '/opt/hermes/ui-tui/dist/entry.js')
          value: ''
        - name: ('HERMES_GATEWAY_BOOTSTRAP_STATE', 'running')
          value: ''
        ports:
        - containerPort: 18789
        readinessProbe:
          tcpSocket:
            port: 18789
        volumeMounts:
        - name: data
          mountPath: /opt/data
          subPath: '{{ .Release.Name }}/data/hermes'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
