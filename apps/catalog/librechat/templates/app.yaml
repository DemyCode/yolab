{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/data/api"

          [ -e "$D/data/api/librechat.yaml" ] || cp /seed/f0 "$D/data/api/librechat.yaml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: api
        image: ghcr.io/danny-avila/librechat:v0.8.7@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
        imagePullPolicy: IfNotPresent
        args:
        - npm
        - run
        - backend
        env:
        - name: HOST
          value: 0.0.0.0
        - name: MONGO_URI
          value: mongodb://mongodb:27017/LibreChat
        - name: MEILI_HOST
          value: http://meilisearch:7700
        - name: RAG_PORT
          value: '8000'
        - name: RAG_API_URL
          value: http://rag_api:8000
        - name: OPENAI_API_KEY
          value: user_provided
        - name: GOOGLE_KEY
          value: user_provided
        - name: ANTHROPIC_API_KEY
          value: user_provided
        - name: ASSISTANTS_API_KEY
          value: user_provided
        - name: CREDS_KEY
          value: f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
        - name: CREDS_IV
          value: e2341419ec3dd3d19b13a1a87fafcbfb
        - name: JWT_SECRET
          value: 16f8c0ef4a5d391b26034086c628469d3f9f497f08163ab9b40137092f2909ef
        - name: JWT_REFRESH_SECRET
          value: eaa5191f2914e30b9387fd84e254e4ba6fc51b4654968a9b0803b456a54b8418
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3080
        readinessProbe:
          tcpSocket:
            port: 3080
        volumeMounts:
        - name: data
          mountPath: /app/librechat.yaml
          subPath: '{{ .Release.Name }}/data/api/librechat.yaml'
        - name: data
          mountPath: /app/client/public/images
          subPath: '{{ .Release.Name }}/data/api/images'
        - name: data
          mountPath: /app/uploads
          subPath: '{{ .Release.Name }}/data/api/uploads'
        - name: data
          mountPath: /app/api/logs
          subPath: '{{ .Release.Name }}/data/api/logs'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:8.3.11@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
        imagePullPolicy: IfNotPresent
        args:
        - mongod
        - --noauth
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 27017
        readinessProbe:
          tcpSocket:
            port: 27017
        volumeMounts:
        - name: data
          mountPath: /data/db
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/data/api"

          [ -e "$D/data/api/librechat.yaml" ] || cp /seed/f0 "$D/data/api/librechat.yaml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
        imagePullPolicy: IfNotPresent
        env:
        - name: MEILI_HOST
          value: http://meilisearch:7700
        - name: MEILI_NO_ANALYTICS
          value: 'true'
        - name: MEILI_MASTER_KEY
          value: DrhYf7zENyR6AlUCKmnz0eYASOQdl6zxH7s7MKFSfFCt
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /meili_data
          subPath: '{{ .Release.Name }}/data/meilisearch'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/data/api"

          [ -e "$D/data/api/librechat.yaml" ] || cp /seed/f0 "$D/data/api/librechat.yaml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectordb
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vectordb
  template:
    metadata:
      labels:
        app: vectordb
    spec:
      containers:
      - name: vectordb
        image: ankane/pgvector:v0.5.1@sha256:d3a9d8ac27bb7e05e333ef25b634d2625adaa85336ab729954b9e94859bf6fa7
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: mydatabase
        - name: POSTGRES_USER
          value: myuser
        - name: POSTGRES_PASSWORD
          value: mypassword
        ports:
        - containerPort: 5432
        readinessProbe:
          tcpSocket:
            port: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/vectordb'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/data/api"

          [ -e "$D/data/api/librechat.yaml" ] || cp /seed/f0 "$D/data/api/librechat.yaml"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: vectordb
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: vectordb
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag_api
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rag_api
  template:
    metadata:
      labels:
        app: rag_api
    spec:
      containers:
      - name: rag_api
        image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:v0.7.3@sha256:67dba8e1e5707a795f2188d1e345f23b8ebf3bf75365026395edec76474cefa6
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: vectordb
        - name: RAG_PORT
          value: '8000'
        - name: OPENAI_API_KEY
          value: user_provided
        - name: GOOGLE_KEY
          value: user_provided
        - name: ANTHROPIC_API_KEY
          value: user_provided
        - name: ASSISTANTS_API_KEY
          value: user_provided
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/data/api"

          [ -e "$D/data/api/librechat.yaml" ] || cp /seed/f0 "$D/data/api/librechat.yaml"

          '
        volumeMounts:
        - name: seed
