{{- $cfg := .Values.config -}}
{{- $folder := $cfg.media_folder -}}
{{- $keys := printf "%s-keys" .Release.Name -}}
{{- $sonarrKey := include "yolab-stack.secret" (list . $keys "sonarr") -}}
{{- $radarrKey := include "yolab-stack.secret" (list . $keys "radarr") -}}
{{- $prowlarrKey := include "yolab-stack.secret" (list . $keys "prowlarr") -}}
{{- $qbittorrentPassword := include "yolab-stack.secret" (list . $keys "qbittorrent") -}}
{{- $jellyfinPassword := include "yolab-stack.secret" (list . $keys "jellyfin") -}}
{{- $newClient := ne ($cfg.download_client | default "new") "existing" -}}
{{- $client := dict "internal_url" "http://qbittorrent:8080" "username" "admin" "password" $qbittorrentPassword -}}
{{- if not $newClient }}
{{- $client = $cfg.existing_client | default dict -}}
{{- end }}
{{- $sonarr := dict "internal_url" "http://sonarr:8989" "api_key" $sonarrKey -}}
{{- $radarr := dict "internal_url" "http://radarr:7878" "api_key" $radarrKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keys }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  sonarr: {{ $sonarrKey | quote }}
  radarr: {{ $radarrKey | quote }}
  prowlarr: {{ $prowlarrKey | quote }}
  qbittorrent: {{ $qbittorrentPassword | quote }}
  jellyfin: {{ $jellyfinPassword | quote }}
{{- with $folder }}
---
{{ include "yolab-stack.folderClaim" (list $ .) }}
{{- end }}
---
{{ include "yolab-stack.member" (list . "jellyfin" (dict
      "media_folder" $folder
      "yolab_enabled" $cfg.watch_anywhere
      "hardware_transcoding" $cfg.hardware_transcoding
      "admin_password" $jellyfinPassword
      "libraries" (list
        (dict "name" "Films" "kind" "movies" "path" "movies")
        (dict "name" "Shows" "kind" "tvshows" "path" "tv")))) }}
{{- if $newClient }}
---
{{ include "yolab-stack.member" (list . "qbittorrent" (dict
      "media_folder" $folder
      "yolab_enabled" $cfg.manage_anywhere
      "webui_password" $qbittorrentPassword
      "vpn_enabled" $cfg.vpn_enabled
      "vpn_private_key" $cfg.vpn_private_key
      "vpn_addresses" $cfg.vpn_addresses
      "vpn_server_countries" $cfg.vpn_server_countries)) }}
{{- end }}
---
{{ include "yolab-stack.member" (list . "sonarr" (dict
      "media_folder" $folder
      "yolab_enabled" $cfg.manage_anywhere
      "api_key" $sonarrKey
      "download_client" $client)) }}
---
{{ include "yolab-stack.member" (list . "radarr" (dict
      "media_folder" $folder
      "yolab_enabled" $cfg.manage_anywhere
      "api_key" $radarrKey
      "download_client" $client)) }}
---
{{ include "yolab-stack.member" (list . "prowlarr" (dict
      "yolab_enabled" $cfg.manage_anywhere
      "api_key" $prowlarrKey
      "sonarr" $sonarr
      "radarr" $radarr)) }}
{{- if $cfg.requests }}
---
{{ include "yolab-stack.member" (list . "jellyseerr" (dict
      "yolab_enabled" $cfg.watch_anywhere
      "media_server" (dict "internal_url" "http://jellyfin:8096" "username" "admin" "password" $jellyfinPassword)
      "sonarr" $sonarr
      "radarr" $radarr)) }}
{{- end }}
{{- if $cfg.subtitles }}
---
{{ include "yolab-stack.member" (list . "bazarr" (dict
      "media_folder" $folder
      "yolab_enabled" $cfg.manage_anywhere
      "subtitle_languages" $cfg.subtitle_languages
      "sonarr" $sonarr
      "radarr" $radarr)) }}
{{- end }}
