apiVersion: v2
name: movies-tv
description: Jellyfin to watch, Seerr to ask for films and shows, Sonarr and Radarr to find them, Prowlarr to search, qBittorrent to download and Bazarr for subtitles, sharing one folder and set up to work together.
type: application
version: 0.2.4

dependencies:
  - name: yolab-stack
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"
  - name: jellyfin
    version: "0.3.3"
    repository: "oci://ghcr.io/demycode/charts"
  - name: qbittorrent
    version: "0.2.2"
    repository: "oci://ghcr.io/demycode/charts"
  - name: prowlarr
    version: "0.2.3"
    repository: "oci://ghcr.io/demycode/charts"
  - name: sonarr
    version: "0.2.3"
    repository: "oci://ghcr.io/demycode/charts"
  - name: radarr
    version: "0.2.3"
    repository: "oci://ghcr.io/demycode/charts"
  - name: jellyseerr
    version: "0.2.3"
    repository: "oci://ghcr.io/demycode/charts"
  - name: bazarr
    version: "0.2.3"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "Movies & TV"
  yolab.io/icon: "🍿"
  yolab.io/category: "media"
  yolab.io/tagline: "Find, download and watch your films and shows"
  yolab.io/collections: "watch-and-listen"
