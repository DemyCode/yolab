type: application
version: 0.2.0

dependencies:
  - name: yolab-stack
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"
  - name: jellyfin
    version: "0.3.0"
    repository: "oci://ghcr.io/demycode/charts"
  - name: qbittorrent
    version: "0.2.0"
    repository: "oci://ghcr.io/demycode/charts"
  - name: prowlarr
    version: "0.2.0"
    repository: "oci://ghcr.io/demycode/charts"
  - name: sonarr
    version: "0.2.0"
    repository: "oci://ghcr.io/demycode/charts"
  - name: radarr
    version: "0.2.0"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/members: "jellyfin,qbittorrent,prowlarr,sonarr,radarr"
  yolab.io/display-name: "Movies & TV"
  yolab.io/icon: "🍿"
