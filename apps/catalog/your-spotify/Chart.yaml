apiVersion: v2
name: your-spotify
description: "Your own listening history and statistics, kept off Spotify's servers"
home: https://github.com/Yooooomi/your_spotify
type: application
version: 0.1.0
dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"
annotations:
  yolab.io/outputs: |
    [
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
  yolab.io/display-name: "Your Spotify"
  yolab.io/icon: "🎧"
  yolab.io/category: "media"
  yolab.io/uischema: |
    {
      "subdomain": { "ui:widget": "TunnelWidget" },
      "spotify_secret": { "ui:widget": "password" }
    }
