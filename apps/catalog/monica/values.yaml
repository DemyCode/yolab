# `config` is user-facing: exactly what the install form edits, and the subtree
# local-api serves to the UI as its JSON Schema. `yolab` is injected at install
# time by local-api and is not the user's business.
config:
  subdomain: monica
  # No default on purpose — values.schema.json marks it required, so installing
  # without one fails at render time instead of shipping a weak shared value.
  app_key: ""
  storage_size: 5Gi

yolab:
  platformApiUrl: ""
  accountToken: ""
  serviceName: ""
  gateway:
    # Caddy proxies to the app, which runs in its own pod.
    upstream: monica:80
