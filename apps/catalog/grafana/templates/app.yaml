{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "authelia.embed.service" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        fsGroup: 472
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "authelia.oidc.clientInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "admin_password" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "admin_password"))) | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: grafana
        image: grafana/grafana:latest@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            . /yolab/env
            if [ -n "${YOLAB_URL:-}" ]; then
              export GF_SERVER_ROOT_URL="$YOLAB_URL"
            fi
            {{- if eq (include "authelia.embed.oidc" .) "true" }}
            . /yolab/oidc.env
            export GF_AUTH_GENERIC_OAUTH_ENABLED=true
            export GF_AUTH_GENERIC_OAUTH_NAME="$OIDC_PROVIDER_NAME"
            export GF_AUTH_GENERIC_OAUTH_CLIENT_ID="$OIDC_CLIENT_ID"
            export GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET="$OIDC_CLIENT_SECRET"
            export GF_AUTH_GENERIC_OAUTH_SCOPES="openid profile email groups"
            export GF_AUTH_GENERIC_OAUTH_AUTH_URL="$OIDC_ISSUER/api/oidc/authorization"
            export GF_AUTH_GENERIC_OAUTH_TOKEN_URL="$OIDC_ISSUER/api/oidc/token"
            export GF_AUTH_GENERIC_OAUTH_API_URL="$OIDC_ISSUER/api/oidc/userinfo"
            export GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
            export GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
            export GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
            export GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
            export GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
            export GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH="contains(groups, 'admins') && 'Admin' || contains(groups, 'lldap_admin') && 'Admin' || 'Viewer'"
            {{- end }}
            exec /run.sh
        env:
          - name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: admin_password
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /var/lib/grafana
            subPath: grafana
          - name: yolab
            mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
