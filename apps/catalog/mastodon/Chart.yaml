apiVersion: v2
name: mastodon
description: "Your own corner of the fediverse — a social server you run"
home: https://joinmastodon.org
type: application
# Chart version — bump on any packaging change. A backup records this, and a restore
# pins to it, so "which version wrote this data" stops being a guess.
version: 0.1.0

dependencies:
  - name: yolab-common
    version: "0.1.0"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "Mastodon"
  yolab.io/icon: "🐘"
  yolab.io/category: "social"
  yolab.io/uischema: |
    {
      "subdomain": {
        "ui:widget": "TunnelWidget"
      },
      "smtp_password": {
        "ui:widget": "password"
      }
    }
  # The owner account is created on first boot and its password printed once. Without
  # this the app would be unreachable: Mastodon has no default login, and signing up
  # through the web form needs a confirmation email, which needs SMTP that a new
  # install may not have.
  yolab.io/outputs: |
    [{"key": "owner_user", "label": "Owner username", "type": "text", "pattern": "YOLAB_OUTPUT owner_user (\\S+)"},
     {"key": "owner_password", "label": "Owner password", "type": "text", "pattern": "YOLAB_OUTPUT owner_password (\\S+)"}]
