{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
        {{- include "yolab-common.wgRegisterInit" . | nindent 8 }}
      containers:
        
        {{- include "yolab-common.wireguardContainer" . | nindent 8 }}
        - name: minecraft
          image: itzg/minecraft-server:latest@sha256:e02138323fb1bd9bac652db8add563deb109cfb36c363cdbc948bdaf0a33df00
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 15
          env:
            - name: EULA
              value: "TRUE"
            - name: DIFFICULTY
              value: {{ .Values.config.difficulty | default "normal" | quote }}
            - name: MODE
              value: {{ .Values.config.gamemode | default "survival" | quote }}
            {{- with .Values.config.seed }}
            - name: SEED
              value: {{ . | quote }}
            {{- end }}
            - name: ENABLE_WHITELIST
              value: {{ if .Values.config.whitelist }}"true"{{ else }}"false"{{ end }}
            {{- with .Values.config.ops }}
            - name: OPS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.whitelist }}
            - name: WHITELIST
              value: {{ . | quote }}
            - name: EXISTING_WHITELIST_FILE
              value: "SYNCHRONIZE"
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: "minecraft"
      volumes:
        {{- include "yolab-common.tunnelVolumes" . | nindent 8 }}
