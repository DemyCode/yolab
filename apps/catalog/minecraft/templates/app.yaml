{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
        {{- include "yolab-common.wgRegisterInit" . | nindent 8 }}
      containers:
        {{- /* A game server exposes raw TCP through the tunnel — no Caddy, so this
               composes the WireGuard sidecar alone rather than the full gateway. */}}
        {{- include "yolab-common.wireguardContainer" . | nindent 8 }}
        - name: minecraft
          image: itzg/minecraft-server:latest@sha256:bb1cf73b342bdf6fa03b9d689b699bd1f8c6989f81ea07d520985eb2f18e6f30
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          {{- /* A STARTUP PROBE, because this server is slow to boot and the
                 liveness probe used to shoot it before it finished.

                 Observed on a live cluster (2026-09-07): container start at
                 14:21:24, the itzg image spent ~3 minutes on its own setup
                 before Minecraft's ServerMain even appeared at 14:24:33, and
                 the world was still loading off CephFS after that. Liveness
                 (120s delay + 3 x 30s) fires at ~210s, so it sent SIGTERM at
                 14:24:51 — mid-boot — and SIGKILL 30s later. Every restart
                 began the same slow load again, so it never once opened
                 :25565. Ten restarts, permanently 1/2 Running.

                 Inflating initialDelaySeconds is the wrong fix: it weakens
                 liveness for the entire life of the server to accommodate one
                 slow minute at the start. A startupProbe suspends liveness
                 until the port opens ONCE, then hands over to the tight
                 liveness timing below.

                 15 minutes of budget. Generous on purpose — world generation
                 on network storage on a small machine is legitimately slow,
                 and the cost of being wrong in this direction is a late
                 restart, while the cost of being wrong in the other is a
                 server that can never start at all. */}}
          startupProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 30
            failureThreshold: 3
          env:
            - name: EULA
              value: "TRUE"
            - name: DIFFICULTY
              value: {{ .Values.config.difficulty | default "normal" | quote }}
            - name: MODE
              value: {{ .Values.config.gamemode | default "survival" | quote }}
            {{- with .Values.config.seed }}
            - name: SEED
              value: {{ . | quote }}
            {{- end }}
            - name: ENABLE_WHITELIST
              value: {{ if .Values.config.whitelist }}"true"{{ else }}"false"{{ end }}
            {{- with .Values.config.ops }}
            - name: OPS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.whitelist }}
            - name: WHITELIST
              value: {{ . | quote }}
            - name: EXISTING_WHITELIST_FILE
              value: "SYNCHRONIZE"
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: {{ printf "%s/minecraft" .Release.Name | quote }}
      volumes:
        {{- include "yolab-common.tunnelVolumes" . | nindent 8 }}
