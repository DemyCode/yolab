{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "authelia.embed.service" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_email: {{ required "config.admin_email is required" .Values.config.admin_email | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "authelia.oidc.clientInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "admin_password" (dict "secret" (printf "%s-admin" .Release.Name) "key" "admin_password"))) | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'SECRET_KEY_BASE=%s\\n' \"$(tr -dc a-f0-9 </dev/urandom | head -c 128)\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\ncp \"$SECRETS\" /yolab/secrets.env\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      - name: app
        image: freikin/dawarich:latest@sha256:b8ee8d9fdff92a9d6ca570f98e0e875624f4bfb24b61363f8246bba124d5849d
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          httpGet:
            path: /api/v1/health
            port: 3000
            httpHeaders:
            - name: X-Forwarded-Proto
              value: https
          initialDelaySeconds: 20
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        args:
        - |
          . /yolab/env
          set -a
          . /yolab/secrets.env
          set +a
          export APPLICATION_HOSTS="localhost,$YOLAB_FQDN,127.0.0.1,::1"
          {{- if eq (include "authelia.embed.oidc" .) "true" }}
          . /yolab/oidc.env
          export OIDC_CLIENT_ID OIDC_CLIENT_SECRET OIDC_ISSUER OIDC_PROVIDER_NAME
          export OIDC_REDIRECT_URI="$YOLAB_URL/users/auth/openid_connect/callback"
          export OIDC_AUTO_REGISTER=true
          {{- end }}
          exec web-entrypoint.sh sh -c 'bin/rails runner "u = User.find_by(email: %q(demo@dawarich.app)); u.update!(email: ENV.fetch(%q(YOLAB_ADMIN_EMAIL)), password: ENV.fetch(%q(YOLAB_ADMIN_PASSWORD))) if u&.valid_password?(%q(safepassword))" && exec bin/rails server -p 3000 -b ::'
        env:
        - name: RAILS_ENV
          value: production
        - name: REDIS_URL
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: DATABASE_HOST
          value: postgres.{{ .Release.Namespace }}.svc.cluster.local
        - name: DATABASE_PORT
          value: '5432'
        - name: DATABASE_USERNAME
          value: dawarich
        - name: DATABASE_PASSWORD
          value: dawarich
        - name: DATABASE_NAME
          value: dawarich
        - name: APPLICATION_PROTOCOL
          value: https
        - name: TIME_ZONE
          value: {{ .Values.config.time_zone | default "UTC" }}
        - name: RAILS_LOG_TO_STDOUT
          value: 'true'
        - name: SELF_HOSTED
          value: 'true'
        - name: STORE_GEODATA
          value: 'true'
        - name: YOLAB_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-admin
              key: admin_email
        - name: YOLAB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-admin
              key: admin_password
        volumeMounts:
        - name: data
          mountPath: /var/app/public
          subPath: dawarich/public
        - name: data
          mountPath: /var/app/tmp/imports/watched
          subPath: dawarich/imports
        - name: data
          mountPath: /var/app/storage
          subPath: dawarich/storage
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sidekiq
  template:
    metadata:
      labels:
        app: sidekiq
    spec:
      containers:
      - name: sidekiq
        image: freikin/dawarich:latest@sha256:b8ee8d9fdff92a9d6ca570f98e0e875624f4bfb24b61363f8246bba124d5849d
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'until [ -f /state/secrets.env ]; do sleep 2; done

          set -a

          . /state/secrets.env

          set +a

          exec sidekiq-entrypoint.sh sidekiq

          '
        env:
        - name: RAILS_ENV
          value: production
        - name: REDIS_URL
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: DATABASE_HOST
          value: postgres.{{ .Release.Namespace }}.svc.cluster.local
        - name: DATABASE_PORT
          value: '5432'
        - name: DATABASE_USERNAME
          value: dawarich
        - name: DATABASE_PASSWORD
          value: dawarich
        - name: DATABASE_NAME
          value: dawarich
        - name: RAILS_LOG_TO_STDOUT
          value: 'true'
        - name: SELF_HOSTED
          value: 'true'
        - name: STORE_GEODATA
          value: 'true'
        - name: BACKGROUND_PROCESSING_CONCURRENCY
          value: '10'
        volumeMounts:
        - name: data
          mountPath: /var/app/public
          subPath: dawarich/public
        - name: data
          mountPath: /var/app/tmp/imports/watched
          subPath: dawarich/imports
        - name: data
          mountPath: /var/app/storage
          subPath: dawarich/storage
        - name: data
          mountPath: /state
          subPath: yolab-state
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: postgres
        image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - pg_isready
            - -U
            - dawarich
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: POSTGRES_USER
          value: dawarich
        - name: POSTGRES_PASSWORD
          value: dawarich
        - name: POSTGRES_DB
          value: dawarich
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: redis
        image: redis:7.4-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
        imagePullPolicy: IfNotPresent
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        command:
        - redis-server
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: redis
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
