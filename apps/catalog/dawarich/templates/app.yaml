{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_email: {{ required "config.admin_email is required" .Values.config.admin_email | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      - name: gen-secrets
        image: busybox:1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "SECRETS=/state/secrets.env\nif [ ! -f \"$SECRETS\" ]; then\n  TMP=$(mktemp \"${SECRETS}.XXXXXX\")\n  printf 'SECRET_KEY_BASE=%s\\n' \"$(tr -dc a-f0-9 </dev/urandom | head -c 128)\" > \"$TMP\"\n  mv \"$TMP\" \"$SECRETS\"\nfi\ncp \"$SECRETS\" /yolab/secrets.env\n"
        volumeMounts:
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
        - name: yolab
          mountPath: /yolab
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      - name: app
        image: freikin/dawarich:latest@sha256:589e3606b11b61c3fa2d9661832cb73645a9b93a9cc7d807a071e2bc6c584498
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
            httpHeaders:
            - name: X-Forwarded-Proto
              value: https
          initialDelaySeconds: 20
          periodSeconds: 10
        command:
        - /bin/sh
        - -c
        args:
        - |
          . /yolab/env
          set -a
          . /yolab/secrets.env
          set +a
          export APPLICATION_HOSTS="localhost,$YOLAB_FQDN,127.0.0.1,::1"
          exec web-entrypoint.sh sh -c 'bin/rails runner "u = User.find_by(email: %q(demo@dawarich.app)); u.update!(email: ENV.fetch(%q(YOLAB_ADMIN_EMAIL)), password: ENV.fetch(%q(YOLAB_ADMIN_PASSWORD))) if u&.valid_password?(%q(safepassword))" && exec bin/rails server -p 3000 -b ::'
        env:
        - name: RAILS_ENV
          value: production
        - name: REDIS_URL
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: DATABASE_HOST
          value: postgres.{{ .Release.Namespace }}.svc.cluster.local
        - name: DATABASE_PORT
          value: '5432'
        - name: DATABASE_USERNAME
          value: dawarich
        - name: DATABASE_PASSWORD
          value: dawarich
        - name: DATABASE_NAME
          value: dawarich
        - name: APPLICATION_PROTOCOL
          value: https
        - name: TIME_ZONE
          value: {{ .Values.config.time_zone | default "UTC" }}
        - name: RAILS_LOG_TO_STDOUT
          value: 'true'
        - name: SELF_HOSTED
          value: 'true'
        - name: STORE_GEODATA
          value: 'true'
        - name: YOLAB_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-admin
              key: admin_email
        - name: YOLAB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-admin
              key: admin_password
        volumeMounts:
        - name: data
          mountPath: /var/app/public
          subPath: {{ .Release.Name }}/dawarich/public
        - name: data
          mountPath: /var/app/tmp/imports/watched
          subPath: {{ .Release.Name }}/dawarich/imports
        - name: data
          mountPath: /var/app/storage
          subPath: {{ .Release.Name }}/dawarich/storage
        - name: yolab
          mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sidekiq
  template:
    metadata:
      labels:
        app: sidekiq
    spec:
      containers:
      - name: sidekiq
        image: freikin/dawarich:latest@sha256:589e3606b11b61c3fa2d9661832cb73645a9b93a9cc7d807a071e2bc6c584498
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'until [ -f /state/secrets.env ]; do sleep 2; done

          set -a

          . /state/secrets.env

          set +a

          exec sidekiq-entrypoint.sh sidekiq

          '
        env:
        - name: RAILS_ENV
          value: production
        - name: REDIS_URL
          value: redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        - name: DATABASE_HOST
          value: postgres.{{ .Release.Namespace }}.svc.cluster.local
        - name: DATABASE_PORT
          value: '5432'
        - name: DATABASE_USERNAME
          value: dawarich
        - name: DATABASE_PASSWORD
          value: dawarich
        - name: DATABASE_NAME
          value: dawarich
        - name: RAILS_LOG_TO_STDOUT
          value: 'true'
        - name: SELF_HOSTED
          value: 'true'
        - name: STORE_GEODATA
          value: 'true'
        - name: BACKGROUND_PROCESSING_CONCURRENCY
          value: '10'
        volumeMounts:
        - name: data
          mountPath: /var/app/public
          subPath: {{ .Release.Name }}/dawarich/public
        - name: data
          mountPath: /var/app/tmp/imports/watched
          subPath: {{ .Release.Name }}/dawarich/imports
        - name: data
          mountPath: /var/app/storage
          subPath: {{ .Release.Name }}/dawarich/storage
        - name: data
          mountPath: /state
          subPath: {{ .Release.Name }}/yolab-state
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: postgres
        image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
        imagePullPolicy: IfNotPresent
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - dawarich
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: POSTGRES_USER
          value: dawarich
        - name: POSTGRES_PASSWORD
          value: dawarich
        - name: POSTGRES_DB
          value: dawarich
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: {{ .Release.Name }}/postgres
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: redis
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        imagePullPolicy: IfNotPresent
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        command:
        - redis-server
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: {{ .Release.Name }}/redis
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
