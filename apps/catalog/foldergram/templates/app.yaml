{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: ghcr.io/foldergram/foldergram:1.3.1@sha256:c6098c97deb1e49d96fe7678459ccb533d13f697a2cbf8a734f02794d85d4fbb
        imagePullPolicy: IfNotPresent
        env:
        - name: IMAGE_DETAIL_SOURCE
          value: preview
        - name: DERIVATIVE_MODE
          value: eager
        ports:
        - containerPort: 4141
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 4141
        volumeMounts:
        - name: data
          mountPath: /app/data/gallery
          subPath: 'data/gallery'
        - name: data
          mountPath: /app/data/db
          subPath: 'data/db'
        - name: data
          mountPath: /app/data/thumbnails
          subPath: 'data/thumbnails'
        - name: data
          mountPath: /app/data/previews
          subPath: 'data/previews'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
