{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: ghcr.io/danielbrendel/hortusfox-web:v6.4@sha256:bea58ac1f2884d672277ad2444de372b0a5032ef827bdc51d2b368285dbdb4dd
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_ADMIN_EMAIL
          value: umbrel@umbrel.local
        - name: APP_ADMIN_PASSWORD
          value: $(APP_PASSWORD)
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: '3306'
        - name: DB_DATABASE
          value: hortusfox
        - name: DB_USERNAME
          value: user
        - name: DB_PASSWORD
          value: password
        - name: DB_CHARSET
          value: utf8mb4
        ports:
        - containerPort: 80
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/www/html/public/img
          subPath: 'data/images'
        - name: data
          mountPath: /var/www/html/public/attachments
          subPath: 'data/attachments'
        - name: data
          mountPath: /var/www/html/app/logs
          subPath: 'data/logs'
        - name: data
          mountPath: /var/www/html/public/backup
          subPath: 'data/backup'
        - name: data
          mountPath: /var/www/html/public/themes
          subPath: 'data/themes'
        - name: data
          mountPath: /var/www/html/app/migrations
          subPath: 'data/migrate'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:11.8.9@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: MYSQL_ROOT_PASSWORD
          value: my-secret-pw
        - name: MYSQL_DATABASE
          value: hortusfox
        - name: MYSQL_USER
          value: user
        - name: MYSQL_PASSWORD
          value: password
        ports:
        - containerPort: 3306
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: 'data/db_data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 3306
    targetPort: 3306
