{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: ghcr.io/danielbrendel/hortusfox-web:v6.3@sha256:a26d2333a4c0c0786c9d384c176d45c3f15bb748d327c1340a64ce636555a51e
        imagePullPolicy: IfNotPresent
        env:
        - name: ('APP_ADMIN_EMAIL', 'umbrel@umbrel.local')
          value: ''
        - name: ('APP_ADMIN_PASSWORD', '${APP_PASSWORD}')
          value: ''
        - name: ('DB_HOST', 'hortusfox_db_1')
          value: ''
        - name: ('DB_PORT', 3306)
          value: ''
        - name: ('DB_DATABASE', 'hortusfox')
          value: ''
        - name: ('DB_USERNAME', 'user')
          value: ''
        - name: ('DB_PASSWORD', 'password')
          value: ''
        - name: ('DB_CHARSET', 'utf8mb4')
          value: ''
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /var/www/html/public/img
          subPath: '{{ .Release.Name }}/data/images'
        - name: data
          mountPath: /var/www/html/public/attachments
          subPath: '{{ .Release.Name }}/data/attachments'
        - name: data
          mountPath: /var/www/html/app/logs
          subPath: '{{ .Release.Name }}/data/logs'
        - name: data
          mountPath: /var/www/html/public/backup
          subPath: '{{ .Release.Name }}/data/backup'
        - name: data
          mountPath: /var/www/html/public/themes
          subPath: '{{ .Release.Name }}/data/themes'
        - name: data
          mountPath: /var/www/html/app/migrations
          subPath: '{{ .Release.Name }}/data/migrate'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: mariadb:11.4.7@sha256:c5c82ddc074b9236fda87127934a1da726ecac68e9de083fd0e0d11a7bedc077
        imagePullPolicy: IfNotPresent
        env:
        - name: ('MYSQL_ROOT_PASSWORD', 'my-secret-pw')
          value: ''
        - name: ('MYSQL_DATABASE', 'hortusfox')
          value: ''
        - name: ('MYSQL_USER', 'user')
          value: ''
        - name: ('MYSQL_PASSWORD', 'password')
          value: ''
        ports:
        - containerPort: 3306
        readinessProbe:
          tcpSocket:
            port: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: '{{ .Release.Name }}/data/db_data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: db
  ports:
  - port: 3306
    targetPort: 3306
