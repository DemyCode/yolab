{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: flomp/wanderer-web:v0.21.0@sha256:af721ffac56fd33243043211fc49e4d5c5651f784551ae7b5b05d845c7c41147
        imagePullPolicy: IfNotPresent
        env:
        - name: ('ORIGIN', 'http://${DEVICE_DOMAIN_NAME}:3111')
          value: ''
        - name: ('BODY_SIZE_LIMIT', 'Infinity')
          value: ''
        - name: ('POCKETBASE_PROXY_SECRET', '${APP_SEED}')
          value: ''
        - name: ('PUBLIC_POCKETBASE_URL', 'http://wanderer_db_1:8090')
          value: ''
        - name: ('PUBLIC_DISABLE_SIGNUP', 'false')
          value: ''
        - name: ('UPLOAD_FOLDER', '/app/uploads')
          value: ''
        - name: ('UPLOAD_USER', 'admin')
          value: ''
        - name: ('UPLOAD_PASSWORD', '${APP_PASSWORD}')
          value: ''
        - name: ('VALHALLA_URL', 'https://valhalla1.openstreetmap.de')
          value: ''
        - name: ('NOMINATIM_URL', 'https://nominatim.openstreetmap.org')
          value: ''
        - name: ('OVERPASS_API_URL', 'https://overpass-api.de')
          value: ''
        - name: ('PUBLIC_MAP_MAX_POLYLINES', 100)
          value: ''
        - name: ('MEILI_URL', 'http://wanderer_search_1:7700')
          value: ''
        - name: ('MEILI_MASTER_KEY', '${APP_SEED}')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: 3000
        volumeMounts:
        - name: data
          mountPath: /app/uploads
          subPath: '{{ .Release.Name }}/data/uploads'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: search
        image: getmeili/meilisearch:v1.14.0@sha256:8cd411ba5d9ec2dfce02e241305208eebacce0fd74a72bece21cadd03dc566ce
        imagePullPolicy: IfNotPresent
        env:
        - name: ('MEILI_NO_ANALYTICS', 'true')
          value: ''
        - name: ('MEILI_URL', 'http://wanderer_search_1:7700')
          value: ''
        - name: ('MEILI_MASTER_KEY', '${APP_SEED}')
          value: ''
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - curl --fail http://localhost:7700/health || exit 1
          initialDelaySeconds: 20
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /meili_data/data.ms
          subPath: '{{ .Release.Name }}/data/data.ms'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: flomp/wanderer-db:v0.21.0@sha256:ba7bd45b8177fec7a31d297ecaf3c98e94aabb4fc043f167df35aeba8b93468c
        imagePullPolicy: IfNotPresent
        env:
        - name: ('POCKETBASE_ENCRYPTION_KEY', '${APP_WANDERER_ENCRYPTION_KEY}')
          value: ''
        - name: ('POCKETBASE_PROXY_SECRET', '${APP_SEED}')
          value: ''
        - name: ('MEILI_URL', 'http://wanderer_search_1:7700')
          value: ''
        - name: ('MEILI_MASTER_KEY', '${APP_SEED}')
          value: ''
        - name: ('ORIGIN', 'http://${DEVICE_DOMAIN_NAME}:3111')
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        readinessProbe:
          exec:
            command:
            - /curl
            - --fail
            - http://localhost:8090/health
          initialDelaySeconds: 20
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /pb_data
          subPath: '{{ .Release.Name }}/data/pb_data'
        - name: data
          mountPath: /data/plugins
          subPath: '{{ .Release.Name }}/data/plugins'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
