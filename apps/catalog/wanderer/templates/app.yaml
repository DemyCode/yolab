{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: flomp/wanderer-web:v0.21.2@sha256:849f63732d3e751f077c1567bda77aebc68c8b5691271cb418e10efbcf2f364f
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: ORIGIN
          value: http://localhost:3111
        - name: BODY_SIZE_LIMIT
          value: Infinity
        - name: POCKETBASE_PROXY_SECRET
          value: $(APP_SEED)
        - name: PUBLIC_POCKETBASE_URL
          value: http://db:8090
        - name: PUBLIC_DISABLE_SIGNUP
          value: 'false'
        - name: UPLOAD_FOLDER
          value: /app/uploads
        - name: UPLOAD_USER
          value: admin
        - name: UPLOAD_PASSWORD
          value: $(APP_PASSWORD)
        - name: VALHALLA_URL
          value: https://valhalla1.openstreetmap.de
        - name: NOMINATIM_URL
          value: https://nominatim.openstreetmap.org
        - name: OVERPASS_API_URL
          value: https://overpass-api.de
        - name: PUBLIC_MAP_MAX_POLYLINES
          value: '100'
        - name: MEILI_URL
          value: http://search:7700
        - name: MEILI_MASTER_KEY
          value: $(APP_SEED)
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 3000
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 3000
        volumeMounts:
        - name: data
          mountPath: /app/uploads
          subPath: 'data/uploads'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: search
        image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: MEILI_NO_ANALYTICS
          value: 'true'
        - name: MEILI_URL
          value: http://search:7700
        - name: MEILI_MASTER_KEY
          value: $(APP_SEED)
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - /bin/sh
            - -c
            - curl --fail http://localhost:7700/health || exit 1
          initialDelaySeconds: 20
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /meili_data/data.ms
          subPath: 'data/data.ms'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: flomp/wanderer-db:v0.21.2@sha256:2f8d7f29c2a473dce8e84b1a33ac3a692a21238c39b6757fa0e0162542d85865
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: POCKETBASE_ENCRYPTION_KEY
          value: $(APP_SEED)
        - name: POCKETBASE_PROXY_SECRET
          value: $(APP_SEED)
        - name: MEILI_URL
          value: http://search:7700
        - name: MEILI_MASTER_KEY
          value: $(APP_SEED)
        - name: ORIGIN
          value: http://localhost:3111
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - /curl
            - --fail
            - http://localhost:8090/health
          initialDelaySeconds: 20
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /pb_data
          subPath: 'data/pb_data'
        - name: data
          mountPath: /data/plugins
          subPath: 'data/plugins'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
