{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      - name: server
        image: quay.io/jupyter/base-notebook:lab-4.6.6@sha256:bee24ca0a6bea91a88951184582af54360e1d4ededf12d08817cbb49d8831781
        imagePullPolicy: IfNotPresent
        args:
        - /bin/sh
        - -c
        - start-notebook.py --IdentityProvider.token='' --ServerApp.ip=127.0.0.1 --ServerApp.root_dir=/home/jovyan/work
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 8888
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - python3
            - -c
            - import socket; socket.create_connection(("127.0.0.1", 8888), 4).close()
        volumeMounts:
        - name: data
          mountPath: /home/jovyan/work
          subPath: 'data'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
