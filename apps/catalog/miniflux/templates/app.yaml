{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "authelia.embed.service" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  admin_username: {{ .Values.config.admin_username | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "authelia.oidc.clientInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "admin_password" (dict "secret" (printf "%s-secrets" .Release.Name) "key" "admin_password"))) | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      - name: miniflux
        image: miniflux/miniflux:latest@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            . /yolab/env
            if [ -n "${YOLAB_URL:-}" ]; then
              export BASE_URL="$YOLAB_URL"
            fi
            {{- if eq (include "authelia.embed.oidc" .) "true" }}
            . /yolab/oidc.env
            export OAUTH2_PROVIDER=oidc
            export OAUTH2_CLIENT_ID="$OIDC_CLIENT_ID"
            export OAUTH2_CLIENT_SECRET="$OIDC_CLIENT_SECRET"
            export OAUTH2_OIDC_DISCOVERY_ENDPOINT="$OIDC_ISSUER"
            export OAUTH2_OIDC_PROVIDER_NAME="$OIDC_PROVIDER_NAME"
            export OAUTH2_REDIRECT_URL="$YOLAB_URL/oauth2/oidc/callback"
            export OAUTH2_USER_CREATION=1
            {{- end }}
            exec /usr/bin/miniflux
        env:
          - name: DATABASE_URL
            value: "postgres://miniflux:miniflux@postgres.{{ .Release.Namespace }}.svc.cluster.local/miniflux?sslmode=disable"
          - name: RUN_MIGRATIONS
            value: "1"
          - name: CREATE_ADMIN
            value: "1"
          - name: ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: admin_username
          - name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: admin_password
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: yolab
            mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: miniflux
            - name: POSTGRES_PASSWORD
              value: miniflux
            - name: POSTGRES_DB
              value: miniflux
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command: ["pg_isready", "-U", "miniflux"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
