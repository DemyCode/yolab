{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
  f1: V0VCX1VSTD1jaGFuZ2VtZQpBUElfQkFTRV9VUkw9Y2hhbmdlbWUKQVBQX0RPTUFJTj1jaGFuZ2VtZQpBTExPV0VEX0hPU1RTPWNoYW5nZW1lCkNPUlNfQUxMT1dFRF9PUklHSU5TPWNoYW5nZW1lCkNTUkZfVFJVU1RFRF9PUklHSU5TPWNoYW5nZW1lCk5HSU5YX0hPU1Q9Y2hhbmdlbWUKQVBQX1BST1RPQ09MPWh0dHAKRU5BQkxFX1NJR05VUD0wCkRFQlVHPTAK
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          [ -e "$D/settings.env" ] || cp /seed/f1 "$D/settings.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: nginx
        image: nginx:alpine3.23@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8762
        readinessProbe:
          tcpSocket:
            port: 8762
        volumeMounts:
        - name: data
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: '{{ .Release.Name }}/config/nginx.conf'
          readOnly: true
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:17.9-alpine@sha256:778d0b486d6daa02b77434d0358ec57a1b21fd8b6d22ac2eef56a33e816928f6
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: WEB_URL
          value: changeme
        - name: API_BASE_URL
          value: changeme
        - name: APP_DOMAIN
          value: changeme
        - name: ALLOWED_HOSTS
          value: changeme
        - name: CORS_ALLOWED_ORIGINS
          value: changeme
        - name: CSRF_TRUSTED_ORIGINS
          value: changeme
        - name: NGINX_HOST
          value: changeme
        - name: APP_PROTOCOL
          value: http
        - name: ENABLE_SIGNUP
          value: '0'
        - name: DEBUG
          value: '0'
        - name: NGINX_PORT
          value: '8762'
        - name: LISTEN_HTTP_PORT
          value: '8762'
        - name: BUCKET_NAME
          value: uploads
        - name: GUNICORN_WORKERS
          value: '2'
        - name: POSTGRES_DB
          value: plane
        - name: POSTGRES_USER
          value: plane
        - name: POSTGRES_PASSWORD
          value: umbrelplane
        - name: DATABASE_URL
          value: postgresql://plane:umbrelplane@db:5432/plane
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: RABBITMQ_DEFAULT_USER
          value: plane
        - name: RABBITMQ_DEFAULT_PASS
          value: umbrelplane
        - name: RABBITMQ_DEFAULT_VHOST
          value: plane
        - name: CELERY_BROKER_URL
          value: amqp://plane:umbrelplane@rabbitmq:5672/plane
        - name: USE_MINIO
          value: '1'
        - name: AWS_ACCESS_KEY_ID
          value: umbrel
        - name: AWS_SECRET_ACCESS_KEY
          value: $(APP_PASSWORD)
        - name: AWS_S3_ENDPOINT_URL
          value: http://plane-minio-1:9000
        - name: AWS_S3_BUCKET_NAME
          value: uploads
        - name: FILE_SIZE_LIMIT
          value: '52428800'
        - name: MINIO_ENDPOINT_SSL
          value: '0'
        - name: MINIO_ROOT_USER
          value: umbrel
        - name: MINIO_ROOT_PASSWORD
          value: $(APP_PASSWORD)
        - name: SECRET_KEY
          value: $(APP_SEED)
        - name: LIVE_SERVER_SECRET_KEY
          value: $(APP_SEED)
        - name: USE_X_FORWARDED_HOST
          value: '1'
        - name: SECURE_SSL_REDIRECT
          value: '0'
        - name: SESSION_COOKIE_SECURE
          value: '0'
        - name: CSRF_COOKIE_SECURE
          value: '0'
        - name: WEBHOOK_ALLOWED_IPS
          value: ''
        - name: WEBHOOK_ALLOWED_HOSTS
          value: ''
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          subPath: '{{ .Release.Name }}/data/db'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          mkdir -p "$D/config"

          [ -e "$D/config/nginx.conf" ] || cp /seed/f0 "$D/config/nginx.conf"

          [ -e "$D/settings.env" ] || cp /seed/f1 "$D/settings.env"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
