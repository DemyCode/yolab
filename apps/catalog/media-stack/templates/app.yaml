{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.autheliaSecret" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-vpn
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  private-key: {{ .Values.config.vpn_private_key | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "1Ti" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: downloads
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: downloads
  ports:
    - name: qbittorrent
      port: 8080
    - name: prowlarr
      port: 9696
    - name: sonarr
      port: 8989
    - name: radarr
      port: 7878
    - name: lidarr
      port: 8686
    - name: lazylibrarian
      port: 5299
    - name: flaresolverr
      port: 8191
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.autheliaInit" . | nindent 6 }}
      - name: links
        image: {{ include "yolab-common.image.wgRegister" . }}
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            . /yolab/env
            echo "YOLAB_OUTPUT requests_url https://$REQUESTS_FQDN"
            echo "YOLAB_OUTPUT sonarr_url https://$SONARR_FQDN"
            echo "YOLAB_OUTPUT radarr_url https://$RADARR_FQDN"
            echo "YOLAB_OUTPUT lidarr_url https://$LIDARR_FQDN"
            echo "YOLAB_OUTPUT books_url https://$BOOKS_FQDN"
            echo "YOLAB_OUTPUT prowlarr_url https://$PROWLARR_FQDN"
            echo "YOLAB_OUTPUT bazarr_url https://$BAZARR_FQDN"
            echo "YOLAB_OUTPUT cleanuparr_url https://$CLEANUPARR_FQDN"
            echo "YOLAB_OUTPUT torrents_url https://$TORRENTS_FQDN"
            echo "YOLAB_OUTPUT wiring Library in /data/media, downloads in /data/torrents. Sonarr, Radarr, Lidarr, LazyLibrarian and Prowlarr share one host: qBittorrent is localhost:8080, Prowlarr localhost:9696, FlareSolverr http://localhost:8191, Sonarr localhost:8989, Radarr localhost:7878, Lidarr localhost:8686. From Seerr, Bazarr and Cleanuparr: Jellyfin is http://localhost:8096 and the same tools are at downloads:<port>, e.g. http://downloads:8989."
        volumeMounts:
          - name: yolab
            mountPath: /yolab
      - name: seerr-config-owner
        image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command:
          - chown
          - -R
          - 1000:1000
          - /app/config
        volumeMounts:
          - name: data
            mountPath: /app/config
            subPath: {{ .Release.Name }}/config/jellyseerr
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.autheliaContainer" . | nindent 6 }}
      - name: jellyfin
        image: lscr.io/linuxserver/jellyfin:latest@sha256:1bb4f88d822a0510bb3604b68aacb80d77c1d2a30181e500090c65111b98723b
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            . /yolab/env
            export JELLYFIN_PublishedServerUrl="https://$YOLAB_FQDN"
            exec /init
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/jellyfin
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
            readOnly: true
          - name: yolab
            mountPath: /yolab
      - name: seerr
        image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
        imagePullPolicy: IfNotPresent
        env:
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 5055
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /app/config
            subPath: {{ .Release.Name }}/config/jellyseerr
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:v1.6.2-ls366@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 6767
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/bazarr
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      - name: cleanuparr
        image: ghcr.io/cleanuparr/cleanuparr:2.10.9@sha256:cfada3e5721451403a878ef67afb317692bb3afe277328b28ce4470bfba915d0
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 11011
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/cleanuparr
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.autheliaVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: downloads
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: downloads
  template:
    metadata:
      labels:
        app: downloads
    spec:
      initContainers:
      - name: library-folders
        image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls42@sha256:044d616beb43c5e7810991242c6a9c42b93ff238c8c0850684939634ea751208
        imagePullPolicy: IfNotPresent
        env:
          - name: VPN_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-vpn
                key: private-key
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            if [ -z "${VPN_PRIVATE_KEY:-}" ]; then
              echo "no Mullvad key: refusing to start the downloaders without the VPN" >&2
              exit 1
            fi
            for d in torrents/tv torrents/movies torrents/music torrents/books media/tv media/movies media/music media/books; do
              mkdir -p "/data/$d"
            done
            chown 1000:1000 /data /data/torrents /data/media
            for d in torrents/tv torrents/movies torrents/music torrents/books media/tv media/movies media/music media/books; do
              chown 1000:1000 "/data/$d"
            done
        volumeMounts:
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:v3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        imagePullPolicy: IfNotPresent
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        env:
          - name: VPN_SERVICE_PROVIDER
            value: mullvad
          - name: VPN_TYPE
            value: wireguard
          - name: WIREGUARD_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-vpn
                key: private-key
          - name: WIREGUARD_ADDRESSES
            value: {{ .Values.config.vpn_addresses | quote }}
          {{- with .Values.config.vpn_server_countries }}
          - name: SERVER_COUNTRIES
            value: {{ . | quote }}
          {{- end }}
          - name: FIREWALL_INPUT_PORTS
            value: "8080,9696,8989,7878,8686,5299,8191"
          - name: FIREWALL_OUTBOUND_SUBNETS
            value: "10.42.0.0/16,10.43.0.0/16,fd00:42::/56,fd00:43::/112"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
      - name: qbittorrent
        image: ghcr.io/linuxserver/qbittorrent:latest@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
          - name: WEBUI_PORT
            value: "8080"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/qbittorrent
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      - name: prowlarr
        image: linuxserver/prowlarr:version-2.5.2.5491@sha256:aaa16ba7d66e413db6d0358d3b6c68d833578ba7f176f24a51807181e7637fce
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 9696
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/prowlarr
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
        imagePullPolicy: IfNotPresent
        env:
          - name: LOG_LEVEL
            value: info
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 8191
          initialDelaySeconds: 15
          periodSeconds: 10
      - name: sonarr
        image: linuxserver/sonarr:version-4.0.19.2979@sha256:82172b363f9eddc02aca544f880a044f2ceb9aaf190bc87e4454e2f705eb91d0
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/sonarr
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      - name: radarr
        image: linuxserver/radarr:version-6.3.0.10514@sha256:fe051413dfd91b383ba04910552e83fb0306895fefee275c48dafe7bb90807dc
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 7878
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/radarr
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      - name: lidarr
        image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls42@sha256:044d616beb43c5e7810991242c6a9c42b93ff238c8c0850684939634ea751208
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 8686
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/lidarr
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      - name: lazylibrarian
        image: lscr.io/linuxserver/lazylibrarian:9af8fbd8-ls360@sha256:451e73343d76ae09614b737dfaf90cdcd66d2168c599bb842aab3cd565a9a1d0
        imagePullPolicy: IfNotPresent
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: {{ .Values.config.timezone | default "Etc/UTC" | quote }}
        readinessProbe:
          tcpSocket:
            port: 5299
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /config
            subPath: {{ .Release.Name }}/config/lazylibrarian
          - name: data
            mountPath: /data
            subPath: {{ .Release.Name }}/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
