config:
  subdomain: media
  timezone: Etc/UTC
  vpn_private_key: ""
  vpn_addresses: ""
  vpn_server_countries: ""
  auth_enabled: true
  auth_mode: own
  auth_users: []

yolab:
  platformApiUrl: ""
  accountToken: ""
  serviceName: ""
  auth:
    sharedSession: true
  gateway:
    aliases:
      REQUESTS_FQDN: requests
      SONARR_FQDN: sonarr
      RADARR_FQDN: radarr
      LIDARR_FQDN: lidarr
      PROWLARR_FQDN: prowlarr
      BAZARR_FQDN: bazarr
      BOOKS_FQDN: books
      TORRENTS_FQDN: torrents
      CLEANUPARR_FQDN: cleanuparr
    caddyfile: |
      (signed_in) {
        forward_auth localhost:9091 {
          uri /authelia/api/authz/forward-auth
          copy_headers Remote-User Remote-Groups Remote-Email Remote-Name
        }
      }

      (app_key) {
        @app_key_header header X-Api-Key {args[0]}
        @app_key_query query apikey={args[0]}
        handle @app_key_header {
          reverse_proxy {args[1]}
        }
        handle @app_key_query {
          reverse_proxy {args[1]}
        }
      }

      {$YOLAB_FQDN} {
        handle /authelia/* {
          reverse_proxy localhost:9091
        }
        handle {
          reverse_proxy localhost:8096
        }
      }

      {$REQUESTS_FQDN} {
        reverse_proxy localhost:5055
      }

      {$SONARR_FQDN} {
        import app_key {$SONARR_API_KEY} downloads:8989
        handle {
          import signed_in
          reverse_proxy downloads:8989
        }
      }

      {$RADARR_FQDN} {
        import app_key {$RADARR_API_KEY} downloads:7878
        handle {
          import signed_in
          reverse_proxy downloads:7878
        }
      }

      {$LIDARR_FQDN} {
        import app_key {$LIDARR_API_KEY} downloads:8686
        handle {
          import signed_in
          reverse_proxy downloads:8686
        }
      }

      {$PROWLARR_FQDN} {
        import app_key {$PROWLARR_API_KEY} downloads:9696
        handle {
          import signed_in
          reverse_proxy downloads:9696
        }
      }

      {$BOOKS_FQDN} {
        import signed_in
        reverse_proxy downloads:5299
      }

      {$TORRENTS_FQDN} {
        handle /api/v2/* {
          reverse_proxy downloads:8080
        }
        handle {
          import signed_in
          reverse_proxy downloads:8080
        }
      }

      {$BAZARR_FQDN} {
        import signed_in
        reverse_proxy localhost:6767
      }

      {$CLEANUPARR_FQDN} {
        import signed_in
        reverse_proxy localhost:11011
      }
authelia:
  embedded: true
