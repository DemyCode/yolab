{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
  f1: 
  f2: 
  f3: 
  f4: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}/data

          mkdir -p "$D/config"

          [ -e "$D/config/mosquitto.conf" ] || cp /seed/f0 "$D/config/mosquitto.conf"

          mkdir -p "$D/nginx"

          [ -e "$D/nginx/default.conf" ] || cp /seed/f1 "$D/nginx/default.conf"

          mkdir -p "$D/www"

          [ -e "$D/www/favicon.png" ] || cp /seed/f2 "$D/www/favicon.png"

          mkdir -p "$D/www"

          [ -e "$D/www/index.html" ] || cp /seed/f3 "$D/www/index.html"

          mkdir -p "$D/www"

          [ -e "$D/www/logo.png" ] || cp /seed/f4 "$D/www/logo.png"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
      - name: broker
        image: eclipse-mosquitto:2.1.2-alpine@sha256:9cfdd46ad59f3e3e5f592f6baf57ab23e1ad00605509d0f5c1e9b179c5314d87
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 1883
        readinessProbe:
          tcpSocket:
            port: 1883
        volumeMounts:
        - name: data
          mountPath: /mosquitto/config
          subPath: '{{ .Release.Name }}/data/config'
        - name: data
          mountPath: /mosquitto/data
          subPath: '{{ .Release.Name }}/data/mosquitto'
        - name: data
          mountPath: /mosquitto/log
          subPath: '{{ .Release.Name }}/data/log'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}/data

          mkdir -p "$D/config"

          [ -e "$D/config/mosquitto.conf" ] || cp /seed/f0 "$D/config/mosquitto.conf"

          mkdir -p "$D/nginx"

          [ -e "$D/nginx/default.conf" ] || cp /seed/f1 "$D/nginx/default.conf"

          mkdir -p "$D/www"

          [ -e "$D/www/favicon.png" ] || cp /seed/f2 "$D/www/favicon.png"

          mkdir -p "$D/www"

          [ -e "$D/www/index.html" ] || cp /seed/f3 "$D/www/index.html"

          mkdir -p "$D/www"

          [ -e "$D/www/logo.png" ] || cp /seed/f4 "$D/www/logo.png"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: broker
  ports:
  - port: 1883
    targetPort: 1883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.27@sha256:124b44bfc9ccd1f3cedf4b592d4d1e8bddb78b51ec2ed5056c52d3692baebc19
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
          subPath: '{{ .Release.Name }}/data/www'
          readOnly: true
        - name: data
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: '{{ .Release.Name }}/data/nginx/default.conf'
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}/data

          mkdir -p "$D/config"

          [ -e "$D/config/mosquitto.conf" ] || cp /seed/f0 "$D/config/mosquitto.conf"

          mkdir -p "$D/nginx"

          [ -e "$D/nginx/default.conf" ] || cp /seed/f1 "$D/nginx/default.conf"

          mkdir -p "$D/www"

          [ -e "$D/www/favicon.png" ] || cp /seed/f2 "$D/www/favicon.png"

          mkdir -p "$D/www"

          [ -e "$D/www/index.html" ] || cp /seed/f3 "$D/www/index.html"

          mkdir -p "$D/www"

          [ -e "$D/www/logo.png" ] || cp /seed/f4 "$D/www/logo.png"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
