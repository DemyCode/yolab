{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-seed'
  namespace: '{{ .Release.Namespace }}'
binaryData:
  f0: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      {{- if .Values.config.node }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.config.node | quote }}
        kubernetes.io/arch: amd64
      {{- else }}
      nodeSelector:
        kubernetes.io/arch: amd64
      {{- end }}
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          [ -e "$D/entrypoint.sh" ] || cp /seed/f0 "$D/entrypoint.sh"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: ghcr.io/openhands/openhands:1.10.0@sha256:1e5c81b0ccfc4fd33a3524ba2a561f594879e238117c024a1b60edfee0412dc8
        imagePullPolicy: IfNotPresent
        env:
        - name: ('AGENT_SERVER_IMAGE_REPOSITORY', 'ghcr.io/openhands/agent-server')
          value: ''
        - name: ('AGENT_SERVER_IMAGE_TAG', '1.33.0-python')
          value: ''
        - name: ('SANDBOX_HOST_PORT', '3994')
          value: ''
        - name: ('SANDBOX_CONTAINER_URL_PATTERN', 'http://localhost:{port}')
          value: ''
        - name: ('WORKSPACE_MOUNT_PATH', '/opt/workspace_base')
          value: ''
        - name: ('LOG_ALL_EVENTS', 'true')
          value: ''
        ports:
        - containerPort: 3000
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
          initialDelaySeconds: 90
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/run
          subPath: '{{ .Release.Name }}/data/docker'
        - name: data
          mountPath: /.openhands
          subPath: '{{ .Release.Name }}/data/openhands'
        - name: data
          mountPath: /opt/workspace_base
          subPath: '{{ .Release.Name }}/data/workspace'
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: docker
  template:
    metadata:
      labels:
        app: docker
    spec:
      containers:
      - name: docker
        image: docker:28.0.4-dind@sha256:ddb0033088b4fab74881ade341a582e3c6c8021b82377703ba1a6106bd3ded44
        imagePullPolicy: IfNotPresent
        command:
        - /entrypoint.sh
        args:
        - dockerd
        - --bridge
        - dind0
        - --data-root
        - /data/data
        - --exec-root
        - /data/exec
        - --host
        - unix:///data/docker.sock
        - --iptables=false
        - --pidfile
        - /data/docker.pid
        env:
        - name: ('DOCKER_ENSURE_BRIDGE', 'dind0:10.32.0.1/16')
          value: ''
        volumeMounts:
        - name: data
          mountPath: /entrypoint.sh
          subPath: '{{ .Release.Name }}/entrypoint.sh'
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/docker'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      - name: seed
        configMap:
          name: '{{ .Release.Name }}-seed'
      initContainers:
      - name: seed
        image: busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -e

          D=/data/{{ .Release.Name }}

          [ -e "$D/entrypoint.sh" ] || cp /seed/f0 "$D/entrypoint.sh"

          '
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
        - name: data
          mountPath: /data
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/arch: amd64
