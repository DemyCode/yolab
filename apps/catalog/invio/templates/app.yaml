{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: frontend
        image: ghcr.io/kittendevv/invio-frontend:v2.2.0@sha256:b2a48dc3bfa04771a2b658905268dfc766958c72be6f783f141e313c189c61b8
        imagePullPolicy: IfNotPresent
        env:
        - name: ('PORT', 8000)
          value: ''
        - name: ('BACKEND_URL', 'http://invio_backend_1:3000')
          value: ''
        - name: ('COOKIE_SECURE', 'false')
          value: ''
        - name: ('FRONTEND_SECURE_HEADERS_DISABLED', 'false')
          value: ''
        - name: ('ENABLE_HSTS', 'false')
          value: ''
        - name: ('ORIGIN', 'http://${DEVICE_DOMAIN_NAME}:8003')
          value: ''
        ports:
        - containerPort: 8000
        readinessProbe:
          tcpSocket:
            port: 8000
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/kittendevv/invio-backend:v2.2.0@sha256:402c3b2255021834fefeeaaae32cd0f68563a2205dbd6b99914a42cf89e699b5
        imagePullPolicy: IfNotPresent
        env:
        - name: ('ADMIN_USER', 'admin')
          value: ''
        - name: ('ADMIN_PASS', '${APP_PASSWORD}')
          value: ''
        - name: ('JWT_SECRET', '${APP_SEED}')
          value: ''
        - name: ('SESSION_TTL_SECONDS', 43200)
          value: ''
        - name: ('SECURE_HEADERS_DISABLED', 'false')
          value: ''
        - name: ('ENABLE_HSTS', 'true')
          value: ''
        - name: ('DATABASE_PATH', '/app/data/invio.db')
          value: ''
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: '{{ .Release.Name }}/data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
