{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
  admin_password: {{ required "config.admin_password is required" .Values.config.admin_password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: frontend
        image: ghcr.io/kittendevv/invio-frontend:v2.4.1@sha256:22244b93397802e19326f8d36f9b0a864e1dd7b253648f6274d5287c783b37e4
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: PORT
          value: '8000'
        - name: BACKEND_URL
          value: http://backend:3000
        - name: COOKIE_SECURE
          value: 'false'
        - name: FRONTEND_SECURE_HEADERS_DISABLED
          value: 'false'
        - name: ENABLE_HSTS
          value: 'false'
        - name: ORIGIN
          value: http://localhost:8003
        ports:
        - containerPort: 8000
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8000
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/kittendevv/invio-backend:v2.4.1@sha256:7d3a3bbae9b682038f1ab3453b019a5a3893d0a4e7fd1934854442dac1a09651
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: admin_password
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: ADMIN_USER
          value: admin
        - name: ADMIN_PASS
          value: $(APP_PASSWORD)
        - name: JWT_SECRET
          value: $(APP_SEED)
        - name: SESSION_TTL_SECONDS
          value: '43200'
        - name: SECURE_HEADERS_DISABLED
          value: 'false'
        - name: ENABLE_HSTS
          value: 'true'
        - name: DATABASE_PATH
          value: /app/data/invio.db
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: 'data'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
