apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    http:
      port: 8080
      disableWebDAV: true
    server:
      disableUpdateCheck: true
      cacheDir: /tmp/filebrowser-cache
      database:
        path: /var/lib/filebrowser/database.sqlite
      sources:
        - path: /files
          name: files
          config:
            defaultEnabled: true
    auth:
      methods:
        password:
          enabled: true
          minLength: 12
          signup: false
          adminUsername: admin
    frontend:
      name: "File Browser"
      disableDefaultLinks: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
      annotations:
        checksum/admin-secret: {{ .Values.config.password | sha256sum }}
    spec:
      initContainers:
        - name: fix-perms
          image: busybox:1@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /state"]
          volumeMounts:
            - name: data
              mountPath: /state
              subPath: "quantum"
        {{- include "yolab-common.filesDirs" (list . (list)) | nindent 8 }}
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.1.4-beta@sha256:d7ae18aa7e8ff81695a35a2c1af399f0c437339241ad90be446c5e71314c0c31
          imagePullPolicy: IfNotPresent
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: FILEBROWSER_CONFIG
              value: /etc/filebrowser/config.yaml
            - name: FILEBROWSER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/filebrowser
              readOnly: true
            - name: data
              mountPath: /var/lib/filebrowser
              subPath: "quantum"
            {{- include "yolab-common.filesMount" . | nindent 12 }}
            - name: cache
              mountPath: /tmp/filebrowser-cache
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: cache
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- include "yolab-common.filesVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: 8080
