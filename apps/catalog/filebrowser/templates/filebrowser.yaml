apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    http:
      port: 8080
      disableWebDAV: true
    server:
      disableUpdateCheck: true
      cacheDir: /tmp/filebrowser-cache
      database:
        path: /var/lib/filebrowser/database.sqlite
      sources:
        - path: /srv
          name: files
          config:
            defaultEnabled: true
    auth:
      methods:
        password:
          enabled: true
          minLength: 12
          signup: false
          adminUsername: admin
    frontend:
      name: "File Browser"
      disableDefaultLinks: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
      annotations:
        checksum/admin-secret: {{ .Values.config.password | sha256sum }}
    spec:
      initContainers:
        - name: fix-perms
          image: busybox:1@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 1000:1000 /state /srv"]
          volumeMounts:
            - name: data
              mountPath: /state
              subPath: {{ printf "%s/quantum" .Release.Name | quote }}
            - name: data
              mountPath: /srv
              subPath: {{ printf "%s/files" .Release.Name | quote }}
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.1.0-beta@sha256:329dfca21dcd04d1430f9f190a719d9e9ecb0fb9a916d26a56cd631876aebaf1
          imagePullPolicy: IfNotPresent
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: FILEBROWSER_CONFIG
              value: /etc/filebrowser/config.yaml
            - name: FILEBROWSER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/filebrowser
              readOnly: true
            - name: data
              mountPath: /var/lib/filebrowser
              subPath: {{ printf "%s/quantum" .Release.Name | quote }}
            - name: data
              mountPath: /srv
              subPath: {{ printf "%s/files" .Release.Name | quote }}
            - name: cache
              mountPath: /tmp/filebrowser-cache
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: cache
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: filebrowser
  ports:
    - port: 80
      targetPort: 8080
