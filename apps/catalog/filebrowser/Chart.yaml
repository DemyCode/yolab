apiVersion: v2
name: filebrowser
description: Web-based file manager for your storage
home: https://filebrowser.org
type: application
version: 0.1.2
appVersion: "2"

dependencies:
  - name: yolab-common
    version: "0.1.1"
    repository: "oci://ghcr.io/demycode/charts"

annotations:
  yolab.io/display-name: "File Browser"
  yolab.io/icon: "🗂️"
  yolab.io/category: "utilities"
  yolab.io/uischema: |
    {
      "subdomain": { "ui:widget": "TunnelWidget" },
      "password": { "ui:widget": "PasswordWidget" }
    }
  yolab.io/outputs: |
    [
      { "key": "url", "label": "Web URL", "type": "url", "pattern": "YOLAB_OUTPUT url (\\S+)" },
      { "key": "file_explorer_url", "label": "File explorer", "type": "url", "pattern": "YOLAB_OUTPUT file_explorer_url (\\S+)" },
      { "key": "file_explorer_password", "label": "File explorer password", "type": "text", "pattern": "YOLAB_OUTPUT file_explorer_password (\\S+)" }
    ]
