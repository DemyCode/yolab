{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "10Gi" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  app_secret: {{ required "config.app_secret is required" .Values.config.app_secret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: ghcr.io/basecamp/once-campfire:1.5.2@sha256:71dbc0874c41192361828dfa2f9d936d32c488073c77d436d09aa1718dfa7088
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        - name: RAILS_ENV
          value: production
        - name: SECRET_KEY_BASE
          value: $(APP_SEED)
        - name: REDIS_URL
          value: redis://redis:6379
        - name: DISABLE_SSL
          value: 'true'
        - name: VAPID_PUBLIC_KEY
          value: ${VAPID_PUBLIC_KEY:-}
        - name: VAPID_PRIVATE_KEY
          value: ${VAPID_PRIVATE_KEY:-}
        - name: SENTRY_DSN
          value: ${SENTRY_DSN:-}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
        volumeMounts:
        - name: data
          mountPath: /rails/storage
          subPath: '{{ .Release.Name }}/data/app'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: server
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - --save
        - '60'
        - '1'
        - --save
        - '300'
        - '10'
        - --save
        - '900'
        - '100'
        - --appendonly
        - 'yes'
        - --loglevel
        - warning
        env:
        - name: APP_SEED
          valueFrom:
            secretKeyRef:
              name: '{{ .Release.Name }}-secrets'
              key: app_secret
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
        volumeMounts:
        - name: data
          mountPath: /data
          subPath: '{{ .Release.Name }}/data/redis'
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: '{{ .Release.Name }}-data'
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
