{{- $cfg := .Values.config -}}
{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.fileExplorerSecret" . }}
---
{{ include "yolab-common.fileExplorerConfigMap" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) }}
{{- $sessionKey := randAlphaNum 64 }}
{{- if and $existing $existing.data (index $existing.data "session_key") }}
{{- $sessionKey = index $existing.data "session_key" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ required "config.password is required" $cfg.password | quote }}
  session_key: {{ $sessionKey | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ $cfg.storage_size | default "10Gi" | quote }}
{{- with $cfg.notes_folder }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: folder-{{ . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    yolab.io/folder: {{ . | quote }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ $.Release.Namespace }}.folder-{{ . }}
  resources:
    requests:
      storage: 1Gi
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      {{- with $cfg.notes_folder }}
      - name: notes-dir
        image: ghcr.io/gamosoft/notediscovery:0.31.7@sha256:13e3566146428db028ec0cfb3e0c0db6dc87b53cc475d19aefc2e2e6d1b37cc2
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        command: ["mkdir", "-p", {{ trimSuffix "/" (printf "/data/%s/%s" . ($cfg.notes_path | default "")) | quote }}]
        volumeMounts:
        - name: folder
          mountPath: /data/{{ . }}
      {{- end }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerContainer" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: web
        image: ghcr.io/gamosoft/notediscovery:0.31.7@sha256:13e3566146428db028ec0cfb3e0c0db6dc87b53cc475d19aefc2e2e6d1b37cc2
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
        - name: AUTHENTICATION_ENABLED
          value: "true"
        - name: AUTHENTICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: password
        - name: AUTHENTICATION_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-secrets
              key: session_key
        {{- with $cfg.notes_folder }}
        - name: NOTES_DIR
          value: {{ trimSuffix "/" (printf "/data/%s/%s" . ($cfg.notes_path | default "")) | quote }}
        {{- end }}
        ports:
        - containerPort: 8000
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
          initialDelaySeconds: 5
          periodSeconds: 60
        volumeMounts:
        - name: data
          mountPath: /app/data
          subPath: '{{ .Release.Name }}/data'
        {{- with $cfg.notes_folder }}
        - name: folder
          mountPath: /data/{{ . }}
        {{- end }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.fileExplorerVolumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
      {{- with $cfg.notes_folder }}
      - name: folder
        persistentVolumeClaim:
          claimName: folder-{{ . }}
      {{- end }}
