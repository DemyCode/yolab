{{- $machine := include "steam-headless.machine" . | fromJson }}
{{- $device := include "steam-headless.device" $machine }}
{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "yolab-common.autheliaSecret" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-passwords
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  desktop: {{ required "config.desktop_password is required" .Values.config.desktop_password | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: yolab-cephfs
  resources:
    requests:
      storage: {{ .Values.config.storage_size | default "200Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "desktop_username" (dict "value" "steamheadless") "desktop_password" (dict "secret" (printf "%s-passwords" .Release.Name) "key" "desktop"))) | nindent 6 }}
      {{- include "yolab-common.autheliaInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "yolab-common.autheliaContainer" . | nindent 6 }}
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "yolab-common.autheliaVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam-headless
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: steam-headless
  template:
    metadata:
      labels:
        app: steam-headless
    spec:
      nodeSelector:
        yolab.io/game-input: "true"
        kubernetes.io/arch: amd64
        {{- if $machine.name }}
        kubernetes.io/hostname: {{ $machine.name | quote }}
        {{- end }}
      containers:
      - name: steam-headless
        image: josh5/steam-headless:2.44.20261004.1@sha256:28acbee506844b60fe0a49f1f2a85f4a0a8dbccf8a83db7af73aacbb08d20f74
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - name: sunshine-https
          containerPort: 47984
          hostPort: 47984
          protocol: TCP
        - name: sunshine-http
          containerPort: 47989
          hostPort: 47989
          protocol: TCP
        - name: sunshine-web
          containerPort: 47990
          hostPort: 47990
          protocol: TCP
        - name: sunshine-rtsp
          containerPort: 48010
          hostPort: 48010
          protocol: TCP
        - name: sunshine-video
          containerPort: 47998
          hostPort: 47998
          protocol: UDP
        - name: sunshine-ctrl
          containerPort: 47999
          hostPort: 47999
          protocol: UDP
        - name: sunshine-audio
          containerPort: 48000
          hostPort: 48000
          protocol: UDP
        - name: desktop
          containerPort: 8483
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8483
          initialDelaySeconds: 60
          periodSeconds: 15
        env:
        - name: TZ
          value: Etc/UTC
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SUNSHINE_NAME
          value: {{ .Release.Name | quote }}
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            yolab.io/uinput: "1"
            {{- if $device }}
            {{ $device }}: "1"
            {{- end }}
        volumeMounts:
        - name: run
          mountPath: /run
        - name: data
          mountPath: /home/steamheadless
          subPath: {{ .Release.Name }}/home
        - name: data
          mountPath: /var/lib/steam-headless
          subPath: {{ .Release.Name }}/state
        - name: data
          mountPath: /mnt/games
          subPath: {{ .Release.Name }}/games
        - name: password
          mountPath: /steam-headless-provisioning-password
          subPath: password
          readOnly: true
        - name: input
          mountPath: /dev/input
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "yolab-common.gateway.pvcName" . }}
      - name: input
        hostPath:
          path: /dev/input
          type: Directory
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: password
        secret:
          secretName: {{ .Release.Name }}-passwords
          items:
          - key: desktop
            path: password
            mode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: steam-headless
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: steam-headless
  ports:
  - name: desktop
    port: 8483
    targetPort: 8483
