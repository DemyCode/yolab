{{- $machine := include "steam-headless.machine" . | fromJson }}
{{- $device := include "steam-headless.device" $machine }}
{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-passwords
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  desktop: {{ required "config.desktop_password is required" .Values.config.desktop_password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-steam
  namespace: {{ .Release.Namespace }}
data:
  {{- range $file := list "steam-supervisor.sh" "steam.conf" "sunshine-ipv6.sh" "sunshine.conf" "shui.conf" }}
  {{ $file }}: |
    {{- $.Files.Get (printf "files/%s" $file) | nindent 4 }}
  {{- end }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      nodeSelector:
        yolab.io/game-input: "true"
        kubernetes.io/arch: amd64
        {{- if $machine.name }}
        kubernetes.io/hostname: {{ $machine.name | quote }}
        {{- end }}
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "yolab-common.printOutputs" (list . (dict "desktop_username" (dict "value" "steamheadless") "desktop_password" (dict "secret" (printf "%s-passwords" .Release.Name) "key" "desktop"))) | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      - name: steam-headless
        image: josh5/steam-headless:2.44.20261019.1@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - name: sunshine-https
          containerPort: 47984
          hostPort: 47984
          protocol: TCP
        - name: sunshine-http
          containerPort: 47989
          hostPort: 47989
          protocol: TCP
        - name: sunshine-web
          containerPort: 47990
          hostPort: 47990
          protocol: TCP
        - name: sunshine-rtsp
          containerPort: 48010
          hostPort: 48010
          protocol: TCP
        - name: sunshine-video
          containerPort: 47998
          hostPort: 47998
          protocol: UDP
        - name: sunshine-ctrl
          containerPort: 47999
          hostPort: 47999
          protocol: UDP
        - name: sunshine-audio
          containerPort: 48000
          hostPort: 48000
          protocol: UDP
        readinessProbe:
          timeoutSeconds: 5
          exec:
            command:
            - bash
            - -c
            - exec 3<>/dev/tcp/127.0.0.1/8483
          initialDelaySeconds: 60
          periodSeconds: 15
        env:
        - name: TZ
          value: Etc/UTC
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SUNSHINE_NAME
          value: {{ .Release.Name | quote }}
        - name: STEAM_HEADLESS_SESSION_MODE
          value: gaming
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            yolab.io/uinput: "1"
            {{- if $device }}
            {{ $device }}: "1"
            {{- end }}
        volumeMounts:
        - name: run
          mountPath: /run
        - name: data
          mountPath: /home/steamheadless
          subPath: home
        - name: data
          mountPath: /var/lib/steam-headless
          subPath: state
        - name: data
          mountPath: /mnt/games
          subPath: games
        - name: password
          mountPath: /steam-headless-provisioning-password
          subPath: password
          readOnly: true
        - name: input
          mountPath: /dev/input
        - name: shm
          mountPath: /dev/shm
        - name: yolab-steam
          mountPath: /etc/yolab-steam
          readOnly: true
        - name: yolab-steam
          mountPath: /etc/systemd/system/steam-headless-steam.service.d/50-yolab.conf
          subPath: steam.conf
          readOnly: true
        - name: yolab-steam
          mountPath: /etc/systemd/system/steam-headless-sunshine.service.d/50-yolab.conf
          subPath: sunshine.conf
          readOnly: true
        - name: yolab-steam
          mountPath: /etc/systemd/system/steam-headless-shui.service.d/50-yolab.conf
          subPath: shui.conf
          readOnly: true
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
      - name: yolab-steam
        configMap:
          name: {{ .Release.Name }}-steam
      - name: input
        hostPath:
          path: /dev/input
          type: Directory
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: password
        secret:
          secretName: {{ .Release.Name }}-passwords
          items:
          - key: desktop
            path: password
            mode: 0400
