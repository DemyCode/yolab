{{ include "yolab-common.caddyConfigMap" . }}
---
{{ include "authelia.embed.secret" . }}
---
{{ include "authelia.embed.service" . }}
---
{{ include "yolab-common.privateAccessResources" . }}
---
{{ include "yolab-common.uninstallHook" . }}
---
{{ include "yolab-common.homeVolume" $ }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  auth_secret_key: {{ required "config.auth_secret_key is required" .Values.config.auth_secret_key | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
      {{- include "yolab-common.wgRegisterInit" . | nindent 6 }}
      {{- include "authelia.embed.init" . | nindent 6 }}
      {{- include "authelia.oidc.clientInit" . | nindent 6 }}
      {{- include "yolab-common.privateAccessInit" . | nindent 6 }}
      containers:
      {{- include "yolab-common.gatewayContainers" . | nindent 6 }}
      {{- include "authelia.embed.container" . | nindent 6 }}
      {{- include "yolab-common.privateAccessContainers" . | nindent 6 }}
      - name: romm
        image: rommapp/romm:latest@sha256:03295f95a6290e752641f9553ac4198b0e5b71b879d57f7b2371b98f608feb54
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            {{- if eq (include "authelia.embed.oidc" .) "true" }}
            . /yolab/env
            . /yolab/oidc.env
            export OIDC_ENABLED=true
            export OIDC_PROVIDER=authelia
            export OIDC_CLIENT_ID OIDC_CLIENT_SECRET
            export OIDC_SERVER_APPLICATION_URL="$OIDC_ISSUER"
            export OIDC_REDIRECT_URI="$YOLAB_URL/api/oauth/openid"
            {{- end }}
            cd /romm
            exec /docker-entrypoint.sh /init
        env:
          - name: DB_HOST
            value: "mariadb.{{ .Release.Namespace }}.svc.cluster.local"
          - name: DB_PORT
            value: "3306"
          - name: DB_NAME
            value: "romm"
          - name: DB_USER
            value: "romm"
          - name: DB_PASSWD
            value: "romm"
          - name: ROMM_AUTH_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secrets
                key: auth_secret_key
        readinessProbe:
          timeoutSeconds: 5
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /romm/library
            subPath: romm/library
          - name: data
            mountPath: /romm/resources
            subPath: romm/resources
          - name: data
            mountPath: /romm/assets
            subPath: romm/assets
          - name: data
            mountPath: /romm/config
            subPath: romm/config
          - name: data
            mountPath: /redis-data
            subPath: romm/redis
          - name: yolab
            mountPath: /yolab
      volumes:
      {{- include "yolab-common.gatewayVolumes" . | nindent 6 }}
      {{- include "authelia.embed.volumes" . | nindent 6 }}
      {{- include "yolab-common.privateAccessVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
          imagePullPolicy: IfNotPresent
          env:
            - name: MARIADB_USER
              value: "romm"
            - name: MARIADB_PASSWORD
              value: "romm"
            - name: MARIADB_DATABASE
              value: "romm"
            - name: MARIADB_ROOT_PASSWORD
              value: "romm-root"
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mariadb
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
